version: 1
repository:
  current_name: HENU-Kit-DEV
  target_name: HENUKitDev
  public_project_repository: HENU-Kit
  public_project_repository_policy: preserve
  default_branch: main
  unofficial_notice: 学生自主运营 · 非河南大学官方项目
  historical_source_policy: git_history_only
  public_project_snapshot_policy: removed_from_worktree

modules:
  - id: portal
    kind: web_app
    current_path: apps/portal
    target_path: apps/portal
    owner: portal
    deploy_unit: portal-web
    target_domain: henukit.cn
    status: active
    notes:
      - Primary public product surface via docker-compose.henukit.yml

  - id: study_web
    kind: web_app
    current_path: apps/web
    target_path: apps/study-web
    owner: study
    deploy_unit: study-web
    current_domain: study.superhuazai.me
    target_domain: study.henukit.cn
    status: migrate_in_place

  - id: study_legacy_admin
    kind: web_app
    current_path: apps/study-legacy-admin
    target_path: apps/study-legacy-admin
    owner: study
    deploy_unit: study-admin
    status: retired_keep_source
    notes:
      - Source kept for rollback and historical Study admin behavior
      - Not a default deploy target; Console is the only ops admin entry

  - id: console
    kind: web_app
    current_path: apps/console
    target_path: apps/console
    owner: platform
    deploy_unit: henukit-console
    target_domain: console.henukit.cn
    status: active
    notes:
      - Primary ops/admin UI; dual Study admin entry is retired from product path
      - Served on its own subdomain so same-origin /api/* reaches Console Gateway

  - id: study_api
    kind: go_service
    current_path: services/api
    target_path: services/study-api
    owner: study
    deploy_unit: study-api
    status: mixed_legacy
    notes:
      - 当前包含账号、资料、刷题、社区、支付、AI 等混合能力
      - 公共能力迁出前不得直接改名为 platform-core

  - id: study_worker
    kind: go_worker
    current_path: services/worker
    target_path: services/study-worker
    owner: study
    deploy_unit: study-worker
    status: migrate_in_place

  - id: quizcraft_product
    kind: imported_product
    source_repository: jry21223/quizcraft-cn
    source_branch: master
    source_commit: e9d31993960d233869dc3704eb211f8374384b7f
    current_path: products/quizcraft
    owner: quiz
    status: imported
    target_components:
      web: apps/quiz-web
      api: services/quiz-api-legacy
    current_domain: superhuazai.me
    target_domain: quiz.henukit.cn

  - id: portal_api
    kind: go_service
    current_path: services/portal-api
    target_path: services/portal-api
    owner: portal
    deploy_unit: portal-api
    status: active_development
    notes:
      - User-facing data API for Portal frontend
      - Serves Library, Food, Practice, Campus data
      - Contract derived from frontend mock interfaces

  - id: portal_gateway
    kind: go_service
    current_path: services/portal-gateway
    target_path: services/portal-gateway
    owner: portal
    deploy_unit: portal-gateway
    status: active_development
    notes:
      - Read-only BFF for Portal frontend
      - OAuth session with Platform Core
      - Proxies product data to portal-api

  - id: platform_core
    kind: go_service
    current_path: services/platform-core
    target_path: services/platform-core
    owner: platform
    deploy_unit: platform-core-api
    target_domain: account.henukit.cn
    status: identity_foundation

  - id: platform_worker
    kind: go_worker
    current_path: services/platform-core
    target_path: services/platform-core
    owner: platform
    deploy_unit: platform-mail-worker
    status: active
    notes:
      - 邮件/通知 outbox worker：services/platform-core/cmd/mail-worker + Dockerfile.worker，compose 服务名 platform-mail-worker

  - id: account_portfolio
    kind: go_service
    current_path: services/account-portfolio
    target_path: services/account-portfolio
    owner: platform
    deploy_unit: account-portfolio
    status: active
    notes:
      - 积分、会员、会员订单、账户通知与客服工单的独立持久化数据 Owner

  - id: notice
    kind: go_service
    current_path: services/notice
    target_path: services/notice
    owner: notice
    deploy_unit: notice
    status: active
    notes:
      - Notice Module API：通知来源、不可变版本、审核、受众与分发

  - id: notice_worker
    kind: go_worker
    current_path: services/notice
    target_path: services/notice
    owner: notice
    deploy_unit: notice-worker
    status: active
    notes:
      - services/notice 的 Dockerfile.worker，compose 服务名 notice-worker

  - id: food
    kind: go_service
    current_path: services/food
    target_path: services/food
    owner: food
    deploy_unit: food
    status: active
    notes:
      - Food Module API：美食投稿、条目、校准轮次、票、异常与调档

  - id: library
    kind: go_service
    current_path: services/library
    target_path: services/library
    owner: library
    deploy_unit: library
    status: active
    notes:
      - Library Module：课程、资料、下载、投稿、审核与纠错

  - id: career_opportunities
    kind: go_service
    current_path: services/career-opportunities
    target_path: services/career-opportunities
    owner: career
    deploy_unit: career-opportunities
    status: active
    notes:
      - 公开职位机会与会员职业偏好、匹配、追踪和摘要

  - id: portal_summary
    kind: go_service
    current_path: services/portal-summary
    target_path: services/portal-summary
    owner: portal
    deploy_unit: portal-summary
    status: active
    notes:
      - Portal 摘要服务（release baseline 镜像之一）

  - id: food_mcp
    kind: go_service
    current_path: services/food-mcp
    target_path: services/food-mcp
    owner: food
    deploy_unit: food-mcp
    status: active

  - id: career_mcp
    kind: go_service
    current_path: services/career-mcp
    target_path: services/career-mcp
    owner: career
    deploy_unit: career-mcp
    status: active

  - id: deploy_webhook
    kind: deployment_service
    current_path: services/deploy-webhook
    target_path: services/deploy-webhook
    owner: infra
    deploy_unit: deploy-webhook
    status: release_candidate
    exposure: loopback_only
    notes:
      - GitHub push receiver and persistent deployment queue
      - Deploys only an exact current origin/main SHA through root-owned hooks
      - Does not replace production approval, Migration, backup, restore, or cutover gates

  - id: design_tokens
    kind: shared_package
    current_path: packages/design-tokens
    owner: design
    status: foundation

  - id: api_contracts
    kind: shared_package
    current_path: packages/api-contracts
    owner: platform
    status: foundation

data_owners:
  platform_identity: platform_core
  verification_codes: platform_core
  sessions: platform_core
  account_links: platform_core
  user_roles: platform_core
  memberships: platform_core
  entitlement_grants: platform_core
  notifications: platform_core
  email_deliveries: platform_core
  user_metrics: platform_core
  courses: study_api
  materials: study_api
  material_files: study_api
  material_downloads: study_api
  question_banks: quizcraft_product
  questions: quizcraft_product
  attempts: quizcraft_product
  wrong_questions: quizcraft_product
  rankings: quizcraft_product
  food_rankings: food
  tool_catalog: portal
