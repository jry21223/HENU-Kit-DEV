server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Built with VITE_BASE_PATH=/console/ — assets live under /console/.
    location /console/ {
        try_files $uri $uri/ /console/index.html;
    }

    location = / {
        return 302 /console/;
    }
}
