server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Console subdomain (console.henukit.cn): assets are built at /.
    # The legacy /console/ subpath is NOT served by this image (built with
    # VITE_BASE_PATH=/); the shared edge should redirect /console/ to the
    # subdomain or drop the route once the cutover completes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
