apiVersion: v1
kind: Tool
metadata:
  name: search_catalog
  label:
    en_US: Search Catalog
    zh_Hans: 搜索课程包
  description:
    en_US: Search published final review course packages
    zh_Hans: 搜索已发布的期末复习课程包
spec:
  parameters:
    type: object
    properties:
      query:
        type: string
        description: Course or package keyword
      school:
        type: string
        default: 河南大学
      college:
        type: string
        default: 软件学院
      major:
        type: string
      grade:
        type: string
    required:
      - query
  llm_prompt: Search published course packages only. Do not invent prices or package contents.
execution:
  python:
    path: search_catalog.py
    attr: SearchCatalog
