apiVersion: v1
kind: Tool
metadata:
  name: get_package_detail
  label:
    en_US: Get Package Detail
    zh_Hans: 查询课程包详情
  description:
    en_US: Get package detail from final-review-platform
    zh_Hans: 从后端查询课程包详情
spec:
  parameters:
    type: object
    properties:
      packageId:
        type: string
        description: Package id returned by search_catalog
    required:
      - packageId
  llm_prompt: Return only package detail from the tool result. Do not add unverified materials.
execution:
  python:
    path: get_package_detail.py
    attr: GetPackageDetail
