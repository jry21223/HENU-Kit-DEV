name: Render Typst Resume

on:
  pull_request:
    branches: [main]
    paths:
      - "resume-render/**"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-ibm-plex

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Compile PDF
        run: typst compile resume-render/resume.typ resume-render/jin-renyuan-fde-original-typst.pdf --root .

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: original-typst-resume
          path: resume-render/jin-renyuan-fde-original-typst.pdf
          if-no-files-found: error
