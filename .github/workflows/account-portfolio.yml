name: Account Portfolio

on:
  pull_request:
    paths:
      - services/account-portfolio/**
      - packages/api-contracts/openapi/account-portfolio.yaml
      - .github/workflows/account-portfolio.yml
  push:
    branches: [main]
    paths:
      - services/account-portfolio/**
      - packages/api-contracts/openapi/account-portfolio.yaml
      - .github/workflows/account-portfolio.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PGPASSWORD: account_portfolio_test
      ACCOUNT_PORTFOLIO_TEST_DATABASE_URL: postgres://account_portfolio:account_portfolio_test@localhost:5432/account_portfolio_test?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: account_portfolio_test
          POSTGRES_USER: account_portfolio
          POSTGRES_PASSWORD: account_portfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U account_portfolio -d account_portfolio_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/account-portfolio/go.mod
          cache-dependency-path: services/account-portfolio/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify migration round trip and recovery
        run: |
          set -euo pipefail
          psql -h localhost -U account_portfolio -d account_portfolio_test -v ON_ERROR_STOP=1 -c "CREATE TABLE baseline_probe(id integer PRIMARY KEY); INSERT INTO baseline_probe VALUES(1)"
          mapfile -t up_migrations < <(find services/account-portfolio/db/migrations -maxdepth 1 -type f -name '*.up.sql' -print | LC_ALL=C sort)
          mapfile -t down_migrations < <(find services/account-portfolio/db/migrations -maxdepth 1 -type f -name '*.down.sql' -print | LC_ALL=C sort -r)
          for migration in "${up_migrations[@]}"; do
            psql -h localhost -U account_portfolio -d account_portfolio_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          for migration in "${up_migrations[@]}"; do
            psql -h localhost -U account_portfolio -d account_portfolio_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          test "$(psql -h localhost -U account_portfolio -d account_portfolio_test -Atc "SELECT to_regclass('public.account_portfolio_accounts') IS NOT NULL AND to_regclass('public.account_portfolio_points') IS NOT NULL AND to_regclass('public.account_portfolio_memberships') IS NOT NULL AND to_regclass('public.account_portfolio_service_nonces') IS NOT NULL AND to_regclass('public.account_portfolio_ticket_events') IS NOT NULL AND to_regclass('public.account_portfolio_command_idempotency') IS NOT NULL AND (SELECT count(*) FROM baseline_probe)=1")" = t
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" postgres:17-alpine \
            pg_dump -h 127.0.0.1 -U account_portfolio -d account_portfolio_test --format=custom \
            > /tmp/account-portfolio-recovery.dump
          for migration in "${down_migrations[@]}"; do
            psql -h localhost -U account_portfolio -d account_portfolio_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          for migration in "${up_migrations[@]}"; do
            psql -h localhost -U account_portfolio -d account_portfolio_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          createdb -h localhost -U account_portfolio account_portfolio_recovery
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" \
            -v /tmp/account-portfolio-recovery.dump:/tmp/account-portfolio-recovery.dump:ro \
            postgres:17-alpine \
            pg_restore -h 127.0.0.1 -U account_portfolio -d account_portfolio_recovery --no-owner /tmp/account-portfolio-recovery.dump
          test "$(psql -h localhost -U account_portfolio -d account_portfolio_recovery -Atc "SELECT to_regclass('public.account_portfolio_tickets') IS NOT NULL AND to_regclass('public.account_portfolio_ticket_events') IS NOT NULL AND to_regclass('public.account_portfolio_command_idempotency') IS NOT NULL AND to_regclass('public.account_portfolio_membership_orders') IS NOT NULL")" = t

      - name: Verify Account Portfolio contract
        run: |
          set -euo pipefail
          cd services/account-portfolio
          go run ./cmd/contractgen
          cd ../..
          git diff --exit-code -- services/account-portfolio/internal/contract/generated.go
          npx --yes --package=@redocly/cli@2.39.0 redocly lint packages/api-contracts/openapi/account-portfolio.yaml
          if [ "${{ github.event_name }}" = "pull_request" ] && git cat-file -e "origin/${{ github.base_ref }}:packages/api-contracts/openapi/account-portfolio.yaml" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:packages/api-contracts/openapi/account-portfolio.yaml" > /tmp/account-portfolio-base.yaml
            cd services/account-portfolio
            go run github.com/oasdiff/oasdiff@v1.23.0 breaking /tmp/account-portfolio-base.yaml ../../packages/api-contracts/openapi/account-portfolio.yaml
          fi

      - name: Vet, test, and build
        working-directory: services/account-portfolio
        run: |
          set -euo pipefail
          gofmt -d . | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go test -race -count=1 ./...
          go build -o /tmp/account-portfolio ./cmd/server
          go build -o /tmp/account-portfolio-migrate ./cmd/migrate
          go build -o /tmp/account-portfolio-healthcheck ./cmd/healthcheck

      - name: Build and scan Account Portfolio image
        run: |
          docker build -t henukit-account-portfolio:${{ github.sha }} services/account-portfolio
          docker run --rm -v "$PWD:/workspace" aquasec/trivy:0.70.0 fs --scanners secret --exit-code 1 /workspace
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0 image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 henukit-account-portfolio:${{ github.sha }}
