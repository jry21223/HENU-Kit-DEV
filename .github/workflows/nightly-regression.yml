name: Nightly regression

# Per-service workflows are aggressively path-filtered, so a change outside a
# service's own subtree (a shared contract, a lockfile, a base image) never
# triggers its tests. docs/DEVELOPMENT.md documents a daily full regression as
# the safety net that makes those path filters legitimate; this workflow is it.
#
# It also runs the suites no pull-request workflow covers at all:
# services/api, services/worker, services/career-mcp, services/food-mcp and
# integrations/langbot-sales-agent.
#
# Coverage profiles are collected here rather than on the pull-request path so
# they never slow a review down. They are published as artifacts, not gates —
# there is no baseline to ratchet against yet.

on:
  schedule:
    # 02:00 China Standard Time (UTC+8).
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go-${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Only services/portal-api reads this; the others provision their own
      # containers through testcontainers or need no database at all.
      PORTAL_API_TEST_DATABASE_URL: postgres://portal:portal@localhost:5432/portal_test?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: portal_test, POSTGRES_USER: portal, POSTGRES_PASSWORD: portal }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal -d portal_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-portfolio
          - api
          - career-mcp
          - career-opportunities
          - console-gateway
          - deploy-webhook
          - food
          - food-mcp
          - library
          - notice
          - platform-core
          - portal-api
          - portal-gateway
          - portal-summary
          - worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      # Services that need PostgreSQL or Redis start their own containers via
      # testcontainers, which uses the runner's Docker daemon. No service block
      # is needed here.
      - name: Test with coverage
        working-directory: services/${{ matrix.service }}
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Summarize coverage
        working-directory: services/${{ matrix.service }}
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-go-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.out
          if-no-files-found: warn

  rowserrcheck:
    name: rowserrcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/ops/rowserrcheck/go.mod
      # A `for rows.Next()` loop with no rows.Err() returns a truncated result
      # set with a nil error, which a handler then serves as a success. The
      # off-the-shelf linters cannot run here — upstream rowserrcheck does not
      # parse Go 1.26, and golangci-lint's release is built with an older Go
      # than these modules target — so the check is a small stdlib program.
      - name: Verify every query loop consults rows.Err()
        run: go run ./scripts/ops/rowserrcheck services products

  python:
    name: python-${{ matrix.suite.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: quizcraft
            directory: products/quizcraft
            package: .
          - name: langbot-sales-agent
            directory: integrations/langbot-sales-agent
            package: final_review_sales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.suite.directory }}/requirements.txt
      - name: Install dependencies
        working-directory: ${{ matrix.suite.directory }}
        run: python -m pip install -r requirements.txt pytest pytest-cov
      - name: Test with coverage
        working-directory: ${{ matrix.suite.directory }}
        run: PYTHONPATH=. python -m pytest -q tests/ --cov=${{ matrix.suite.package }} --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.suite.name }}
          path: ${{ matrix.suite.directory }}/coverage.xml
          if-no-files-found: warn

  node:
    name: node-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify ops and libraryctl scripts
        run: |
          node --test scripts/ops/tests/*.test.mjs
          node --test scripts/libraryctl/tests/*.test.mjs
      - name: Verify Portal unit behavior with coverage
        run: pnpm --filter @henukit/portal run test:coverage
      - name: Verify Portal unit contracts
        run: pnpm --filter @henukit/portal run test:unit
      - name: Verify Console unit behavior with coverage
        run: pnpm --filter @henukit/console run test:coverage
      - name: Verify QuizCraft web-app unit behavior
        run: pnpm --filter quiz-app run test:unit
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-node
          path: |
            apps/portal/coverage/**
            apps/console/coverage/**
          if-no-files-found: warn
