name: Pull Request Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  branch-name:
    runs-on: ubuntu-24.04
    # Dependabot can satisfy neither gate: the bot fixes its own branch name and
    # cannot write review evidence, so both checks were permanently red and said
    # nothing about the bump. Skip the job, not the step -- a job skipped by its
    # own condition reports success, and it costs no runner.
    # Both the PR author and the acting identity must be Dependabot. Dependabot
    # branches live in this repository, so anyone with write access can push to
    # an open Dependabot PR; on that push the author still reads as the bot
    # while the head commit is a person's. Checking the actor closes it.
    if: >-
      ${{ !(github.event.pull_request.user.login == 'dependabot[bot]'
            && github.actor == 'dependabot[bot]') }}
    steps:
      - name: Require a conventional branch name
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REF" =~ ^(feature|fix)/[a-z0-9][a-z0-9-]*/hc-[0-9]+$ ]] || {
            echo "Branch '$HEAD_REF' must match feature/<area>/hc-<issue> or fix/<area>/hc-<issue>." >&2
            exit 1
          }

  review-evidence:
    runs-on: ubuntu-24.04
    # Dependabot can satisfy neither gate: the bot fixes its own branch name and
    # cannot write review evidence, so both checks were permanently red and said
    # nothing about the bump. Skip the job, not the step -- a job skipped by its
    # own condition reports success, and it costs no runner.
    # Both the PR author and the acting identity must be Dependabot. Dependabot
    # branches live in this repository, so anyone with write access can push to
    # an open Dependabot PR; on that push the author still reads as the bot
    # while the head commit is a person's. Checking the actor closes it.
    if: >-
      ${{ !(github.event.pull_request.user.login == 'dependabot[bot]'
            && github.actor == 'dependabot[bot]') }}
    steps:
      - name: Require current-commit Standards and Spec evidence
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          body = os.environ.get("PR_BODY", "")
          head_sha = os.environ["HEAD_SHA"]
          expected = {
              "Review-Head": head_sha,
              "Standards-Review": "0 findings",
              "Spec-Review": "0 findings",
          }
          for field, value in expected.items():
              match = re.search(rf"(?mi)^{re.escape(field)}:\s*`?([^`\r\n]+)`?\s*$", body)
              if not match or match.group(1).strip().lower() != value.lower():
                  raise SystemExit(f"PR body must contain `{field}: {value}` for the current commit.")
          PY
