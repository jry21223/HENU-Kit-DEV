name: Pull Request Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  branch-name:
    runs-on: ubuntu-24.04
    steps:
      - name: Require a conventional branch name
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REF" =~ ^(feature|fix)/[a-z0-9][a-z0-9-]*/hc-[0-9]+$ ]] || {
            echo "Branch '$HEAD_REF' must match feature/<area>/hc-<issue> or fix/<area>/hc-<issue>." >&2
            exit 1
          }
