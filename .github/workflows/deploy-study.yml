name: Deploy study platform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: study-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: |
            services/api/go.sum
            services/worker/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build release artifact
        run: |
          set -euo pipefail
          npm ci
          mkdir -p release/bin
          (cd services/api && go build -trimpath -ldflags='-s -w' -o ../../release/bin/final-review-api ./cmd/server)
          (cd services/worker && go build -trimpath -ldflags='-s -w' -o ../../release/bin/final-review-worker ./cmd/worker)
          npm run build:web
          npm run build:admin

          mkdir -p release/web/apps/web/.next
          cp -a apps/web/.next/standalone/. release/web/
          cp -a apps/web/.next/static release/web/apps/web/.next/static
          cp -a apps/admin/dist release/admin
          test -x release/bin/final-review-api
          test -x release/bin/final-review-worker
          test -f release/web/apps/web/server.js
          test -f release/admin/index.html
          tar -C release -czf "final-review-study-${GITHUB_SHA}.tar.gz" .

      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.STUDY_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STUDY_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_study_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_study_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.STUDY_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.STUDY_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.STUDY_DEPLOY_USER }}
        run: |
          set -euo pipefail
          artifact="final-review-study-${GITHUB_SHA}.tar.gz"
          scp -i "$HOME/.ssh/id_study_deploy" -P "$DEPLOY_PORT" "$artifact" \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/final-review-study/incoming/$artifact"
          ssh -i "$HOME/.ssh/id_study_deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/bin/final-review-study-deploy '$GITHUB_SHA' '/opt/final-review-study/incoming/$artifact'"

      - name: Verify public readiness
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-all-errors --retry-delay 3 \
            --max-time 20 https://study.superhuazai.me/api/v1/readyz
