name: Listening Training Stack
on:
  workflow_dispatch:
  pull_request:
    paths: [apps/portal/**, services/portal-gateway/**, products/quizcraft/go-service/**, packages/api-contracts/openapi/*training.yaml, scripts/test-training-stack.sh, .github/workflows/training-listening.yml]
  push:
    branches: [main]
    paths: [apps/portal/**, services/portal-gateway/**, products/quizcraft/go-service/**, packages/api-contracts/openapi/*training.yaml, scripts/test-training-stack.sh, .github/workflows/training-listening.yml]
permissions:
  contents: read
jobs:
  listening-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QUIZCRAFT_TEST_DATABASE_URL: postgres://quizcraft:quizcraft@localhost:5432/quizcraft_test?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: quizcraft_test, POSTGRES_USER: quizcraft, POSTGRES_PASSWORD: quizcraft }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quizcraft -d quizcraft_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: products/quizcraft/go-service/go.mod
          cache-dependency-path: |
            products/quizcraft/go-service/go.sum
            services/portal-gateway/go.sum
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @henukit/portal exec playwright install --with-deps chromium
      - run: corepack pnpm run test:training:stack --repeat-each=3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listening-stack-browser
          path: apps/portal/test-results
