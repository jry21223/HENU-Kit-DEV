name: Deploy webhook

on:
  pull_request:
    paths:
      - docker-compose.henukit.yml
      - infra/nginx/henukit.conf.example
      - services/deploy-webhook/**
      - scripts/ops/prepare-henukit-materials.mjs
      - scripts/ops/seal-henukit-materials.mjs
      - scripts/ops/activate-henukit-materials.mjs
      - scripts/ops/import-henukit-materials.mjs
      - scripts/ops/convert-henukit-slides.py
      - scripts/ops/tests/prepare-henukit-materials.test.mjs
      - scripts/ops/tests/henukit-materials-prepare-wrapper.test.mjs
      - scripts/ops/tests/henukit-materials-systemd.test.mjs
      - scripts/ops/tests/henukit-materials-seal.test.mjs
      - scripts/ops/tests/henukit-materials-seal-wrapper.test.mjs
      - scripts/ops/tests/henukit-materials-seal-linux.test.mjs
      - scripts/ops/tests/henukit-materials-activate-wrapper.test.mjs
      - scripts/ops/tests/activate-henukit-materials.test.mjs
      - scripts/ops/tests/convert-henukit-slides.test.mjs
      - scripts/ops/tests/import-henukit-materials.test.mjs
      - scripts/ops/tests/henukit-materials-nginx.test.mjs
      - scripts/ops/tests/henukit-materials-orchestrate.test.mjs
      - scripts/ops/tests/henukit-materials-publish-oss-wrapper.test.mjs
      - scripts/ops/tests/deploy-webhook-materials-ci.test.mjs
      - docs/adr/0022-materials-candidate-preparation.md
      - docs/adr/0023-materials-latest-arrival-queue.md
      - docs/adr/0024-materials-sealed-release-boundary.md
      - docs/adr/0025-materials-atomic-activation.md
      - docs/adr/0026-materials-oss-canary-publication.md
      - docs/adr/README.md
      - docs/development/306-materials-secure-preparation.md
      - docs/operations/henukit-materials-sync.md
      - docs/operations/henukit-materials-oss-canary.md
      - docs/operations/github-webhook-deploy.md
      - docs/operations/PRODUCTION_RELEASE_CHECKLIST.md
      - docs/operations/README.md
      - docs/operations/PRODUCTION_RELEASE_REPORT-2026-07-24.md
      - henukit.modules.yaml
      - .github/workflows/deploy-webhook.yml
  push:
    branches: [main]
    paths:
      - docker-compose.henukit.yml
      - infra/nginx/henukit.conf.example
      - services/deploy-webhook/**
      - scripts/ops/prepare-henukit-materials.mjs
      - scripts/ops/seal-henukit-materials.mjs
      - scripts/ops/activate-henukit-materials.mjs
      - scripts/ops/import-henukit-materials.mjs
      - scripts/ops/convert-henukit-slides.py
      - scripts/ops/tests/prepare-henukit-materials.test.mjs
      - scripts/ops/tests/henukit-materials-prepare-wrapper.test.mjs
      - scripts/ops/tests/henukit-materials-systemd.test.mjs
      - scripts/ops/tests/henukit-materials-seal.test.mjs
      - scripts/ops/tests/henukit-materials-seal-wrapper.test.mjs
      - scripts/ops/tests/henukit-materials-seal-linux.test.mjs
      - scripts/ops/tests/henukit-materials-activate-wrapper.test.mjs
      - scripts/ops/tests/activate-henukit-materials.test.mjs
      - scripts/ops/tests/convert-henukit-slides.test.mjs
      - scripts/ops/tests/import-henukit-materials.test.mjs
      - scripts/ops/tests/henukit-materials-nginx.test.mjs
      - scripts/ops/tests/henukit-materials-orchestrate.test.mjs
      - scripts/ops/tests/henukit-materials-publish-oss-wrapper.test.mjs
      - scripts/ops/tests/deploy-webhook-materials-ci.test.mjs
      - docs/adr/0022-materials-candidate-preparation.md
      - docs/adr/0023-materials-latest-arrival-queue.md
      - docs/adr/0024-materials-sealed-release-boundary.md
      - docs/adr/0025-materials-atomic-activation.md
      - docs/adr/0026-materials-oss-canary-publication.md
      - docs/adr/README.md
      - docs/development/306-materials-secure-preparation.md
      - docs/operations/henukit-materials-sync.md
      - docs/operations/henukit-materials-oss-canary.md
      - docs/operations/github-webhook-deploy.md
      - docs/operations/PRODUCTION_RELEASE_CHECKLIST.md
      - docs/operations/README.md
      - docs/operations/PRODUCTION_RELEASE_REPORT-2026-07-24.md
      - henukit.modules.yaml
      - .github/workflows/deploy-webhook.yml

permissions:
  contents: read

concurrency:
  group: deploy-webhook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/deploy-webhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/deploy-webhook/go.mod
          cache-dependency-path: services/deploy-webhook/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Privileged materials consumer cross-UID test
        run: sudo "$(command -v go)" test -count=1 ./internal/state -run '^TestPrivilegedMaterialsConsumer'
      - name: Build static receiver
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/henukit-deploy-webhook ./cmd/server
      - name: Build inert OSS canary publisher
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/materials-oss-canary ./cmd/materials-oss-canary
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packaging validators
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate shell scripts
        run: |
          set -euo pipefail
          shellcheck \
            services/deploy-webhook/deploy/henukit-deploy \
            services/deploy-webhook/deploy/henukit-approve-release \
            services/deploy-webhook/deploy/henukit-materials-prepare \
            services/deploy-webhook/deploy/henukit-materials-seal \
            services/deploy-webhook/deploy/henukit-materials-activate \
            services/deploy-webhook/deploy/henukit-materials-orchestrate \
            services/deploy-webhook/deploy/henukit-materials-publish-oss \
            services/deploy-webhook/deploy/install.sh \
            services/deploy-webhook/deploy/hooks/10-command.example \
            services/deploy-webhook/deploy/hooks/20-study.example
          bash -n services/deploy-webhook/deploy/henukit-deploy
          bash -n services/deploy-webhook/deploy/henukit-approve-release
          bash -n services/deploy-webhook/deploy/henukit-materials-prepare
          sh -n services/deploy-webhook/deploy/henukit-materials-seal
          sh -n services/deploy-webhook/deploy/henukit-materials-activate
          bash -n services/deploy-webhook/deploy/henukit-materials-orchestrate
          sh -n services/deploy-webhook/deploy/henukit-materials-publish-oss
          bash -n services/deploy-webhook/deploy/henukit-materials-seal
          bash -n services/deploy-webhook/deploy/install.sh
          bash -n services/deploy-webhook/deploy/hooks/10-command.example
          bash -n services/deploy-webhook/deploy/hooks/20-study.example
      - name: Validate systemd units
        run: |
          sudo install -m 0755 /bin/true /usr/local/bin/henukit-deploy-webhook
          systemd-analyze verify services/deploy-webhook/deploy/systemd/*.service services/deploy-webhook/deploy/systemd/*.path
      - name: Validate the complete materials release boundary
        run: |
          node --check scripts/ops/prepare-henukit-materials.mjs
          node --check scripts/ops/seal-henukit-materials.mjs
          node --check scripts/ops/activate-henukit-materials.mjs
          node --test \
            scripts/ops/tests/prepare-henukit-materials.test.mjs \
            scripts/ops/tests/henukit-materials-prepare-wrapper.test.mjs \
            scripts/ops/tests/henukit-materials-systemd.test.mjs \
            scripts/ops/tests/henukit-materials-seal.test.mjs \
            scripts/ops/tests/henukit-materials-seal-wrapper.test.mjs \
            scripts/ops/tests/henukit-materials-seal-linux.test.mjs \
            scripts/ops/tests/henukit-materials-activate-wrapper.test.mjs \
            scripts/ops/tests/activate-henukit-materials.test.mjs \
            scripts/ops/tests/convert-henukit-slides.test.mjs \
            scripts/ops/tests/import-henukit-materials.test.mjs \
            scripts/ops/tests/henukit-materials-nginx.test.mjs \
            scripts/ops/tests/henukit-materials-orchestrate.test.mjs \
            scripts/ops/tests/henukit-materials-publish-oss-wrapper.test.mjs \
            scripts/ops/tests/deploy-webhook-materials-ci.test.mjs
          docker compose -f docker-compose.henukit.yml config --quiet
          docker run --rm \
            -v "$PWD/infra/nginx/henukit.conf.example:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
      - name: Reject committed deployment secrets
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings 'BEGIN OPENSSH PRIVATE KEY' services/deploy-webhook
          ! find services/deploy-webhook -type f \( -name 'webhook-secret' -o -name 'id_ed25519' \) -print -quit | grep .
