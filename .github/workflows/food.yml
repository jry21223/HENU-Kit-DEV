name: Food

on:
  pull_request:
    paths:
      - services/food/**
      - packages/api-contracts/openapi/food.yaml
      - .github/workflows/food.yml
  push:
    branches: [main]
    paths:
      - services/food/**
      - packages/api-contracts/openapi/food.yaml
      - .github/workflows/food.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PGPASSWORD: food_test
      FOOD_TEST_DATABASE_URL: postgres://food:food_test@localhost:5432/food_test?sslmode=disable
      FOOD_TEST_REDIS_ADDR: localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: food_test, POSTGRES_USER: food, POSTGRES_PASSWORD: food_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U food -d food_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/food/go.mod
          cache-dependency-path: services/food/go.sum
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Verify migration round trip and recovery
        run: |
          set -euo pipefail
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -c "CREATE TABLE baseline_probe(id integer PRIMARY KEY); INSERT INTO baseline_probe VALUES(1)"
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -f services/food/db/migrations/000001_food_operations.up.sql
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -f services/food/db/migrations/000001_food_operations.up.sql
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -f services/food/db/migrations/000002_food_posts.up.sql
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -f services/food/db/migrations/000003_food_submission_campus.up.sql
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -f services/food/db/migrations/000004_food_post_version.up.sql
          test "$(psql -h localhost -U food -d food_test -Atc "SELECT to_regclass('public.food_operations') IS NOT NULL AND to_regclass('public.food_submissions') IS NOT NULL AND (SELECT count(*) FROM baseline_probe)=1")" = t
          pg_dump -h localhost -U food -d food_test --format=custom --file=/tmp/food-recovery.dump
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -f services/food/db/migrations/000004_food_post_version.down.sql
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -f services/food/db/migrations/000003_food_submission_campus.down.sql
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -f services/food/db/migrations/000002_food_posts.down.sql
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -f services/food/db/migrations/000001_food_operations.down.sql
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -f services/food/db/migrations/000001_food_operations.up.sql
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -f services/food/db/migrations/000002_food_posts.up.sql
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -f services/food/db/migrations/000003_food_submission_campus.up.sql
          psql -h localhost -U food -d food_test -v ON_ERROR_STOP=1 -f services/food/db/migrations/000004_food_post_version.up.sql
          createdb -h localhost -U food food_recovery
          pg_restore -h localhost -U food -d food_recovery --no-owner /tmp/food-recovery.dump
          test "$(psql -h localhost -U food -d food_recovery -Atc "SELECT to_regclass('public.food_audit_events') IS NOT NULL")" = t
      - name: Verify Food contract
        run: |
          set -euo pipefail
          cd services/food
          go run ./cmd/contractgen
          cd ../..
          git diff --exit-code -- services/food/internal/contract/generated.go
          npx --yes --package=@redocly/cli@2.39.0 redocly lint packages/api-contracts/openapi/food.yaml
          if [ "${{ github.event_name }}" = "pull_request" ] && git cat-file -e "origin/${{ github.base_ref }}:packages/api-contracts/openapi/food.yaml" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:packages/api-contracts/openapi/food.yaml" > /tmp/food-base.yaml
            cd services/food
            go run github.com/oasdiff/oasdiff@v1.23.0 breaking /tmp/food-base.yaml ../../packages/api-contracts/openapi/food.yaml
          fi
      - name: Vet, test, and build
        working-directory: services/food
        run: |
          set -euo pipefail
          gofmt -d . | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
          go test -race -count=1 ./...
          go build -o /tmp/food ./cmd/server
      - name: Build image
        run: docker build -t henukit-food:${{ github.sha }} services/food
