name: Build HENU Kit release artifacts

# Compile production Docker images in GitHub Actions. Production hosts consume
# these fixed-SHA artifacts with docker load and never compile source in place.
# Legacy Study and standalone QuizCraft runtimes are intentionally excluded;
# Portal consumes their preserved databases through its integrated APIs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: henukit-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-contract:
    name: release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify artifact and runtime boundaries
        run: |
          node --test \
            scripts/ops/tests/deploy-henukit-workflow.test.mjs \
            scripts/ops/tests/deploy-henukit-artifact.test.mjs \
            scripts/ops/tests/account-portfolio-workflow.test.mjs \
            scripts/ops/tests/check-account-production-boundary.test.mjs \
            scripts/ops/tests/henukit-release-images.test.mjs \
            scripts/ops/tests/import-henukit-materials-preflight.test.mjs \
            scripts/ops/tests/materials-study-migration.test.mjs \
            scripts/ops/tests/package-henukit-runtime.test.mjs \
            scripts/ops/tests/verify-henukit-local-release.test.mjs \
            scripts/ops/tests/build-henukit-release-local.test.mjs \
            scripts/ops/tests/deploy-henukit-release-from-wsl.test.mjs \
            scripts/ops/tests/watch-henukit-actions.test.mjs \
            scripts/ops/tests/activate-henukit-release.test.mjs
      - name: Reject Account mock and fallback sources
        run: node scripts/ops/check-account-production-boundary.mjs

  portal-responsive:
    name: portal-responsive
    needs: validate-release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Portal and Console browser-test dependencies
        run: pnpm install --frozen-lockfile --filter @henukit/portal... --filter @henukit/console...
      - name: Verify Portal unit behavior
        run: pnpm --filter @henukit/portal test
      - name: Verify Portal unit contracts
        run: pnpm --filter @henukit/portal test:unit
      - name: Install Chromium
        run: pnpm --filter @henukit/portal exec playwright install --with-deps chromium
      - name: Verify responsive Portal layout
        run: pnpm --filter @henukit/portal test:e2e:responsive
      - name: Verify enabled QuizCraft V2 stats and rankings
        run: pnpm --filter @henukit/portal test:e2e:stats
      - name: Verify Food ranking, detail, and recommendation behavior
        run: pnpm --filter @henukit/portal test:e2e:food
      - name: Verify Account Portfolio browser behavior
        run: pnpm --filter @henukit/portal test:e2e:account
      - name: Verify Library owner download behavior
        run: pnpm --filter @henukit/portal test:e2e:library-download

  release-image-matrix:
    name: release-image-matrix
    needs: validate-release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: inventory
        name: Read canonical image inventory
        run: echo "matrix=$(scripts/ops/henukit-release-images.sh --github-matrix)" >> "$GITHUB_OUTPUT"

  build-image:
    name: image-${{ matrix.name }}
    needs: [validate-release-contract, release-image-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-image-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build fixed-SHA image
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r arg; do
            if [[ -n "$arg" ]]; then
              args+=(--build-arg "$arg")
            fi
          done <<< "$BUILD_ARGS"
          docker build \
            --platform linux/amd64 \
            "${args[@]}" \
            --file "$DOCKERFILE" \
            --tag "$IMAGE:$GITHUB_SHA" \
            "$CONTEXT"
          test "$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"

      - name: Export Docker image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir -p release
          cd release
          docker save "$IMAGE:$GITHUB_SHA" |
            gzip -1 > "${IMAGE}-${GITHUB_SHA}.docker.tar.gz"
          test -s "${IMAGE}-${GITHUB_SHA}.docker.tar.gz"
          sha256sum "${IMAGE}-${GITHUB_SHA}.docker.tar.gz" > "${IMAGE}-${GITHUB_SHA}.docker.tar.gz.sha256"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-${{ github.sha }}
          path: |-
            release/${{ matrix.image }}-${{ github.sha }}.docker.tar.gz
            release/${{ matrix.image }}-${{ github.sha }}.docker.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  package-runtime:
    name: runtime-config
    needs: validate-release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Package fixed-SHA runtime and prebuilt materials tools
        run: scripts/ops/package-henukit-runtime.sh --sha "$GITHUB_SHA" --output-dir release

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: henukit-runtime-${{ github.sha }}
          path: |-
            release/henukit-runtime-${{ github.sha }}.tar.gz
            release/henukit-runtime-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
