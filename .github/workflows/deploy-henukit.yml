name: Build HENU Kit release artifacts

# Compile production Docker images in GitHub Actions. Production hosts consume
# these fixed-SHA artifacts with docker load and never compile source in place.
# Study remains a separate deploy unit and is intentionally excluded.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: henukit-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-contract:
    name: release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify artifact and runtime boundaries
        run: node --test scripts/ops/tests/deploy-henukit-workflow.test.mjs

  build-image:
    name: image-${{ matrix.name }}
    needs: validate-release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: console
            image: henukit-console
            context: .
            dockerfile: apps/console/Dockerfile
            build_args: |-
              VITE_BASE_PATH=/console/
              VITE_QUIZCRAFT_WORKSHOP_URL=/quiz/extract
          - name: console-gateway
            image: henukit-console-gateway
            context: services/console-gateway
            dockerfile: services/console-gateway/Dockerfile
            build_args: ""
          - name: platform-core
            image: henukit-platform-core
            context: services/platform-core
            dockerfile: services/platform-core/Dockerfile
            build_args: ""
          - name: platform-mail-worker
            image: henukit-platform-mail-worker
            context: services/platform-core
            dockerfile: services/platform-core/Dockerfile.worker
            build_args: ""
          - name: platform-smtp-provider
            image: henukit-platform-smtp-provider
            context: services/platform-core
            dockerfile: services/platform-core/Dockerfile.smtp-provider
            build_args: ""
          - name: portal
            image: henukit-portal
            context: .
            dockerfile: apps/portal/Dockerfile
            build_args: |-
              NEXT_PUBLIC_PORTAL_GATEWAY_URL=
              NEXT_PUBLIC_PORTAL_GATEWAY_BASE_URL=/api
              NEXT_PUBLIC_PORTAL_REQUIRE_GATEWAY=1
          - name: portal-api
            image: henukit-portal-api
            context: services/portal-api
            dockerfile: services/portal-api/Dockerfile
            build_args: ""
          - name: portal-gateway
            image: henukit-portal-gateway
            context: services/portal-gateway
            dockerfile: services/portal-gateway/Dockerfile
            build_args: ""
          - name: quizcraft-api
            image: henukit-quizcraft-api
            context: products/quizcraft
            dockerfile: products/quizcraft/Dockerfile
            build_args: ""
          - name: quizcraft-web
            image: henukit-quizcraft-web
            context: .
            dockerfile: products/quizcraft/web-app/Dockerfile
            build_args: |-
              VITE_BASE_PATH=/quiz/
              VITE_API_BASE_URL=/quiz-api/api
              VITE_APP_MODE=full
    steps:
      - uses: actions/checkout@v4

      - name: Build fixed-SHA image
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r arg; do
            if [[ -n "$arg" ]]; then
              args+=(--build-arg "$arg")
            fi
          done <<< "$BUILD_ARGS"
          docker build \
            "${args[@]}" \
            --file "$DOCKERFILE" \
            --tag "$IMAGE:$GITHUB_SHA" \
            "$CONTEXT"
          test "$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{.Architecture}}')" = "amd64"

      - name: Export Docker image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir -p release
          cd release
          docker save "$IMAGE:$GITHUB_SHA" |
            gzip -1 > "${IMAGE}-${GITHUB_SHA}.docker.tar.gz"
          test -s "${IMAGE}-${GITHUB_SHA}.docker.tar.gz"
          sha256sum "${IMAGE}-${GITHUB_SHA}.docker.tar.gz" > "${IMAGE}-${GITHUB_SHA}.docker.tar.gz.sha256"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-${{ github.sha }}
          path: |-
            release/${{ matrix.image }}-${{ github.sha }}.docker.tar.gz
            release/${{ matrix.image }}-${{ github.sha }}.docker.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  package-runtime:
    name: runtime-config
    needs: validate-release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Package fixed-SHA runtime configuration
        run: |
          set -euo pipefail
          runtime="release/runtime"
          install -d "$runtime/infra/nginx"
          docker compose \
            -f docker-compose.henukit.yml \
            -f docker-compose.henukit.prebuilt.yml \
            config --no-interpolate --no-path-resolution > "$runtime/docker-compose.henukit.release.yml"
          cp infra/nginx/henukit.conf.example "$runtime/infra/nginx/"
          printf '%s\n' "$GITHUB_SHA" > "$runtime/RELEASE_SHA"
          tar -C "$runtime" -czf "release/henukit-runtime-${GITHUB_SHA}.tar.gz" .
          cd release
          sha256sum "henukit-runtime-${GITHUB_SHA}.tar.gz" > "henukit-runtime-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: henukit-runtime-${{ github.sha }}
          path: |-
            release/henukit-runtime-${{ github.sha }}.tar.gz
            release/henukit-runtime-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
