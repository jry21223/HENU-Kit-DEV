name: Build HENU Kit release artifacts

# Compile production Docker images in GitHub Actions. Production hosts consume
# these fixed-SHA artifacts with docker load and never compile source in place.
# Legacy Study runtime is intentionally excluded; the QuizCraft Go core is now
# a first-class stack image (henukit-quizcraft, 方案 2 containerization) and
# Portal consumes the preserved QuizCraft/Study databases through the Gateway.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: henukit-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-contract:
    name: release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify artifact and runtime boundaries
        run: |
          set -euo pipefail
          run_contract_tests() {
            node --test \
              scripts/ops/tests/deploy-henukit-workflow.test.mjs \
              scripts/ops/tests/import-legacy-portal-food-images.test.mjs \
              scripts/ops/tests/retired-henukit-materials-sync.test.mjs \
              scripts/ops/tests/deploy-henukit-artifact.test.mjs \
              scripts/ops/tests/account-portfolio-workflow.test.mjs \
              scripts/ops/tests/check-account-production-boundary.test.mjs \
              scripts/ops/tests/oauth-continuation-release-gate.test.mjs \
              scripts/ops/tests/henukit-release-images.test.mjs \
              scripts/ops/tests/import-henukit-materials-preflight.test.mjs \
              scripts/ops/tests/materials-study-migration.test.mjs \
              scripts/ops/tests/verify-henukit-local-release.test.mjs \
              scripts/ops/tests/build-henukit-release-local.test.mjs \
              scripts/ops/tests/deploy-henukit-release-from-wsl.test.mjs \
              scripts/ops/tests/activate-henukit-release.test.mjs \
              scripts/ops/tests/getwork-actions-provenance.test.mjs \
              scripts/ops/tests/getwork-node-rollback.test.mjs \
              scripts/ops/tests/getwork-wsl-node-contract.test.mjs

            # Runtime packaging creates a temporary Git checkout and validates
            # it is clean. Keep it isolated from cross-file fixtures that also
            # create and mutate temporary repositories.
            node --test --test-concurrency=1 \
              scripts/ops/tests/package-henukit-runtime.test.mjs

            # The watcher fixture launches many short-lived fake runtimes. Run
            # it without cross-file test load so scheduling cannot turn a
            # successful activation into a one-second timeout.
            node --test --test-concurrency=1 \
              scripts/ops/tests/watch-henukit-actions.test.mjs
          }
          run_contract_tests
      - name: Reject Account mock and fallback sources
        run: node scripts/ops/check-account-production-boundary.mjs

  portal-responsive:
    name: portal-responsive
    needs: validate-release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Portal and Console browser-test dependencies
        run: pnpm install --frozen-lockfile --filter @henukit/portal... --filter @henukit/console...
      - name: Verify Portal unit behavior
        run: pnpm --filter @henukit/portal test
      - name: Verify Portal unit contracts
        run: pnpm --filter @henukit/portal test:unit
      - name: Install Chromium
        run: pnpm --filter @henukit/portal exec playwright install --with-deps chromium
      - name: Verify responsive Portal layout
        run: pnpm --filter @henukit/portal test:e2e:responsive
      - name: Verify enabled QuizCraft V2 stats and rankings
        run: pnpm --filter @henukit/portal test:e2e:stats
      - name: Verify Food ranking, detail, and recommendation behavior
        run: pnpm --filter @henukit/portal test:e2e:food
      - name: Verify Account Portfolio browser behavior
        run: pnpm --filter @henukit/portal test:e2e:account
      - name: Verify Library owner download behavior
        run: pnpm --filter @henukit/portal test:e2e:library-download

  oauth-continuation:
    name: oauth-continuation
    needs: validate-release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.x
          cache-dependency-path: |
            services/platform-core/go.sum
            services/portal-gateway/go.sum
            services/console-gateway/go.sum
      - name: Install cross-product browser-test dependencies
        run: pnpm install --frozen-lockfile --filter @henukit/portal... --filter @henukit/console...
      - name: Install Chromium
        run: pnpm --filter @henukit/portal exec playwright install --with-deps chromium
      - name: Verify cumulative Account Center continuation journeys
        run: |
          mkdir -p release-gates
          scripts/ops/oauth-continuation-release-gate.sh run \
            --sha "$GITHUB_SHA" \
            --output "release-gates/oauth-continuation-${GITHUB_SHA}.env"
      - name: Upload SHA-bound OAuth continuation gate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: henukit-oauth-continuation-gate-${{ github.sha }}
          path: release-gates/oauth-continuation-${{ github.sha }}.env
          if-no-files-found: error
          retention-days: 14

  release-image-matrix:
    name: release-image-matrix
    needs: validate-release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: inventory
        name: Read canonical image inventory
        run: echo "matrix=$(scripts/ops/henukit-release-images.sh --github-matrix)" >> "$GITHUB_OUTPUT"

  build-image:
    name: image-${{ matrix.name }}
    needs: [validate-release-contract, oauth-continuation, release-image-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-image-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download SHA-bound OAuth continuation gate receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: henukit-oauth-continuation-gate-${{ github.sha }}
          path: release-gates

      - name: Verify OAuth continuation gate receipt
        run: |
          scripts/ops/oauth-continuation-release-gate.sh verify \
            --sha "$GITHUB_SHA" \
            --receipt "release-gates/oauth-continuation-${GITHUB_SHA}.env"

      - name: Build fixed-SHA image
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          set -euo pipefail
          source_root="$(mktemp -d)"
          trap 'rm -rf -- "$source_root"' EXIT
          git -c tar.umask=0022 archive --format=tar "$GITHUB_SHA" |
            tar -xf - -C "$source_root"
          cd "$source_root"
          args=()
          while IFS= read -r arg; do
            if [[ -n "$arg" ]]; then
              args+=(--build-arg "$arg")
            fi
          done <<< "$BUILD_ARGS"
          docker build \
            --platform linux/amd64 \
            "${args[@]}" \
            --file "$DOCKERFILE" \
            --tag "$IMAGE:$GITHUB_SHA" \
            "$CONTEXT"
          test "$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"

      - name: Verify getWork MCP release image
        if: matrix.name == 'getwork-mcp'
        env:
          GETWORK_MCP_SMOKE_TOKEN: github-actions-getwork-release-smoke-0000000000000000
        run: |
          set -euo pipefail
          docker run -d --rm --name getwork-mcp-release-smoke -p 127.0.0.1:18100:8100 \
            -e GETWORK_MCP_ACCESS_TOKEN="$GETWORK_MCP_SMOKE_TOKEN" \
            "${{ matrix.image }}:$GITHUB_SHA"
          trap 'docker logs getwork-mcp-release-smoke || true; docker rm -f getwork-mcp-release-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error http://127.0.0.1:18100/healthz >/dev/null && break
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Accept: application/json, text/event-stream' -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"unauthorized-release-smoke","version":"1"}}}' \
            http://127.0.0.1:18100/mcp)" = 401
          mcp_call() {
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GETWORK_MCP_SMOKE_TOKEN" \
              -H 'Accept: application/json, text/event-stream' \
              -H 'Content-Type: application/json' \
              --data "$1" http://127.0.0.1:18100/mcp
          }
          mcp_call '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | jq -e '.result.tools | map(.name) | sort == ["crawl_jobs","list_sources"]'
          mcp_call '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_sources","arguments":{}}}' \
            | jq -e '.result.content[] | select(.type=="text") | .text | fromjson | .sources | any(.key=="meituan")'
          for attempt in 1 2 3; do
            if mcp_call '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"crawl_jobs","arguments":{"source":"meituan","since_days":7}}}' \
              | jq -e '.result.content[] | select(.type=="text") | .text | fromjson | .status == "ok"'; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Export Docker image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir -p release
          cd release
          docker save "$IMAGE:$GITHUB_SHA" |
            gzip -1 > "${IMAGE}-${GITHUB_SHA}.docker.tar.gz"
          test -s "${IMAGE}-${GITHUB_SHA}.docker.tar.gz"
          sha256sum "${IMAGE}-${GITHUB_SHA}.docker.tar.gz" > "${IMAGE}-${GITHUB_SHA}.docker.tar.gz.sha256"

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.image }}-${{ github.sha }}
          path: |-
            release/${{ matrix.image }}-${{ github.sha }}.docker.tar.gz
            release/${{ matrix.image }}-${{ github.sha }}.docker.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  package-runtime:
    name: runtime-config
    needs: [validate-release-contract, oauth-continuation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download SHA-bound OAuth continuation gate receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: henukit-oauth-continuation-gate-${{ github.sha }}
          path: release-gates

      - name: Package fixed-SHA runtime and prebuilt materials tools
        run: |
          scripts/ops/package-henukit-runtime.sh \
            --sha "$GITHUB_SHA" \
            --output-dir release \
            --oauth-gate-receipt "release-gates/oauth-continuation-${GITHUB_SHA}.env"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: henukit-runtime-${{ github.sha }}
          path: |-
            release/henukit-runtime-${{ github.sha }}.tar.gz
            release/henukit-runtime-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  attest-getwork-wsl-release:
    name: attest-getwork-wsl-release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-image, package-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download exact-SHA getWork image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: henukit-getwork-mcp-${{ github.sha }}
          path: release

      - name: Download exact-SHA runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: henukit-runtime-${{ github.sha }}
          path: release

      - name: Build getWork WSL handoff manifest
        run: |
          scripts/ops/create-getwork-actions-manifest.sh \
            --sha "$GITHUB_SHA" \
            --artifact-dir release \
            --output "release/henukit-getwork-actions-${GITHUB_SHA}.manifest"

      - id: attest-getwork
        name: Attest getWork WSL handoff manifest
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3
        with:
          subject-path: release/henukit-getwork-actions-${{ github.sha }}.manifest
          predicate-type: https://github.com/jry21223/HENU-Kit-DEV/attestations/getwork-actions-release-v1
          predicate: '{}'

      - name: Retain the offline Sigstore bundle
        run: |
          install -m 0444 \
            "${{ steps.attest-getwork.outputs.bundle-path }}" \
            "release/henukit-getwork-actions-${GITHUB_SHA}.attestation.json"

      - name: Upload attested getWork WSL handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: henukit-getwork-actions-provenance-${{ github.sha }}
          path: |-
            release/henukit-getwork-actions-${{ github.sha }}.manifest
            release/henukit-getwork-actions-${{ github.sha }}.attestation.json
          if-no-files-found: error
          retention-days: 14
