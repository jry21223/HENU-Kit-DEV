name: Build HENU Kit release artifacts

# Compile production Docker images in GitHub Actions. Production hosts consume
# these fixed-SHA artifacts with docker load and never compile source in place.
# Legacy Study and standalone QuizCraft runtimes are intentionally excluded;
# Portal consumes their preserved databases through its integrated APIs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: henukit-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-contract:
    name: release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify artifact and runtime boundaries
        run: node --test scripts/ops/tests/deploy-henukit-workflow.test.mjs scripts/ops/tests/account-portfolio-workflow.test.mjs scripts/ops/tests/check-account-production-boundary.test.mjs
      - name: Reject Account mock and fallback sources
        run: node scripts/ops/check-account-production-boundary.mjs

  portal-responsive:
    name: portal-responsive
    needs: validate-release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Portal and Console browser-test dependencies
        run: pnpm install --frozen-lockfile --filter @henukit/portal... --filter @henukit/console...
      - name: Verify Portal unit behavior
        run: pnpm --filter @henukit/portal test
      - name: Verify Portal unit contracts
        run: pnpm --filter @henukit/portal test:unit
      - name: Install Chromium
        run: pnpm --filter @henukit/portal exec playwright install --with-deps chromium
      - name: Verify responsive Portal layout
        run: pnpm --filter @henukit/portal test:e2e:responsive
      - name: Verify Food ranking, detail, and recommendation behavior
        run: pnpm --filter @henukit/portal test:e2e:food
      - name: Verify Account Portfolio browser behavior
        run: pnpm --filter @henukit/portal test:e2e:account

  build-image:
    name: image-${{ matrix.name }}
    needs: validate-release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: console
            image: henukit-console
            context: .
            dockerfile: apps/console/Dockerfile
            build_args: |-
              VITE_BASE_PATH=/console/
              VITE_QUIZCRAFT_WORKSHOP_URL=
          - name: console-gateway
            image: henukit-console-gateway
            context: services/console-gateway
            dockerfile: services/console-gateway/Dockerfile
            build_args: ""
          - name: platform-core
            image: henukit-platform-core
            context: services/platform-core
            dockerfile: services/platform-core/Dockerfile
            build_args: ""
          - name: platform-mail-worker
            image: henukit-platform-mail-worker
            context: services/platform-core
            dockerfile: services/platform-core/Dockerfile.worker
            build_args: ""
          - name: platform-smtp-provider
            image: henukit-platform-smtp-provider
            context: services/platform-core
            dockerfile: services/platform-core/Dockerfile.smtp-provider
            build_args: ""
          - name: portal
            image: henukit-portal
            context: .
            dockerfile: apps/portal/Dockerfile
            build_args: |-
              NEXT_PUBLIC_PORTAL_GATEWAY_URL=
              NEXT_PUBLIC_PORTAL_GATEWAY_BASE_URL=/api
              NEXT_PUBLIC_PORTAL_REQUIRE_GATEWAY=1
              NEXT_PUBLIC_PORTAL_ENABLE_QUIZCRAFT_CATALOG=0
              NEXT_PUBLIC_PORTAL_ENABLE_QUIZCRAFT_V2_READS=0
          - name: portal-api
            image: henukit-portal-api
            context: services/portal-api
            dockerfile: services/portal-api/Dockerfile
            build_args: ""
          - name: account-portfolio
            image: henukit-account-portfolio
            context: services/account-portfolio
            dockerfile: services/account-portfolio/Dockerfile
            build_args: ""
          - name: portal-gateway
            image: henukit-portal-gateway
            context: services/portal-gateway
            dockerfile: services/portal-gateway/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Build fixed-SHA image
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r arg; do
            if [[ -n "$arg" ]]; then
              args+=(--build-arg "$arg")
            fi
          done <<< "$BUILD_ARGS"
          docker build \
            "${args[@]}" \
            --file "$DOCKERFILE" \
            --tag "$IMAGE:$GITHUB_SHA" \
            "$CONTEXT"
          test "$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{.Architecture}}')" = "amd64"

      - name: Export Docker image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir -p release
          cd release
          docker save "$IMAGE:$GITHUB_SHA" |
            gzip -1 > "${IMAGE}-${GITHUB_SHA}.docker.tar.gz"
          test -s "${IMAGE}-${GITHUB_SHA}.docker.tar.gz"
          sha256sum "${IMAGE}-${GITHUB_SHA}.docker.tar.gz" > "${IMAGE}-${GITHUB_SHA}.docker.tar.gz.sha256"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-${{ github.sha }}
          path: |-
            release/${{ matrix.image }}-${{ github.sha }}.docker.tar.gz
            release/${{ matrix.image }}-${{ github.sha }}.docker.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  package-runtime:
    name: runtime-config
    needs: validate-release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Package fixed-SHA runtime configuration
        run: |
          set -euo pipefail
          runtime="release/runtime"
          install -d "$runtime/bin" "$runtime/infra/nginx" "$runtime/infra/systemd" "$runtime/infra/epay-gateway/patches" "$runtime/migrations/platform-core" "$runtime/migrations/account-portfolio" "$runtime/release-gates"
          docker compose \
            -f docker-compose.henukit.yml \
            -f docker-compose.henukit.prebuilt.yml \
            config --no-interpolate --no-path-resolution > "$runtime/docker-compose.henukit.release.yml"
          cp infra/nginx/henukit.conf.example "$runtime/infra/nginx/"
          cp infra/systemd/henukit-actions-watch.service "$runtime/infra/systemd/"
          cp infra/epay-gateway/patches/*.patch "$runtime/infra/epay-gateway/patches/"
          cp services/platform-core/db/migrations/*.up.sql "$runtime/migrations/platform-core/"
          cp services/account-portfolio/db/migrations/*.up.sql "$runtime/migrations/account-portfolio/"
          install -m 0555 scripts/ops/deploy-henukit-artifact.sh "$runtime/bin/deploy-henukit-artifact.sh"
          install -m 0555 scripts/ops/watch-henukit-actions.sh "$runtime/bin/watch-henukit-actions.sh"
          install -m 0555 scripts/ops/activate-henukit-release.sh "$runtime/bin/activate-henukit-release.sh"
          install -m 0555 scripts/ops/deploy-epay-gateway-patches.sh "$runtime/bin/deploy-epay-gateway-patches.sh"
          RELEASE_SHA="$GITHUB_SHA" node scripts/ops/check-account-production-boundary.mjs --report "$runtime/release-gates/account-production-boundary.env"
          printf '%s\n' "$GITHUB_SHA" > "$runtime/RELEASE_SHA"
          tar -C "$runtime" -czf "release/henukit-runtime-${GITHUB_SHA}.tar.gz" .
          cd release
          sha256sum "henukit-runtime-${GITHUB_SHA}.tar.gz" > "henukit-runtime-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: henukit-runtime-${{ github.sha }}
          path: |-
            release/henukit-runtime-${{ github.sha }}.tar.gz
            release/henukit-runtime-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
