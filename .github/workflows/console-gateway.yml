name: Console Gateway

on:
  pull_request:
    paths:
      - services/console-gateway/**
      - services/food/**
      - apps/console/**
      - packages/api-contracts/openapi/console-gateway.yaml
      - packages/api-contracts/openapi/library.yaml
      - packages/api-contracts/openapi/food.yaml
      - packages/api-contracts/openapi/account-portfolio.yaml
      - .github/workflows/console-gateway.yml
  push:
    branches: [main]
    paths:
      - services/console-gateway/**
      - services/food/**
      - apps/console/**
      - packages/api-contracts/openapi/console-gateway.yaml
      - packages/api-contracts/openapi/library.yaml
      - packages/api-contracts/openapi/food.yaml
      - packages/api-contracts/openapi/account-portfolio.yaml
      - .github/workflows/console-gateway.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: food_integration
          POSTGRES_USER: food
          POSTGRES_PASSWORD: food_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U food -d food_integration"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/console-gateway/go.mod
          cache-dependency-path: services/console-gateway/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify OpenAPI examples, implementation, and generated clients
        run: |
          set -euo pipefail
          cd services/console-gateway
          go run ./cmd/contractgen
          go run ./cmd/noticecontractgen
          go run ./cmd/librarycontractgen
          go run ./cmd/foodcontractgen
          go run ./cmd/accountportfoliocontractgen
          CONSOLE_GATEWAY_TEST_REDIS_ADDR=localhost:6379 go test ./internal/httpapi -run ConformsToContract -count=1
          cd ../..
          git diff --exit-code -- services/console-gateway/internal/contract services/console-gateway/internal/notice/contract_generated.go services/console-gateway/internal/library/contract_generated.go services/console-gateway/internal/food/contract_generated.go services/console-gateway/internal/accountportfolio/contract_generated.go apps/console/src/lib/console-gateway.ts
          npx --yes --package=@redocly/cli@2.39.0 redocly lint packages/api-contracts/openapi/console-gateway.yaml
          if [ "${{ github.event_name }}" = "pull_request" ] && git cat-file -e "origin/${{ github.base_ref }}:packages/api-contracts/openapi/console-gateway.yaml" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:packages/api-contracts/openapi/console-gateway.yaml" > /tmp/console-gateway-base.yaml
            go run github.com/oasdiff/oasdiff@v1.23.0 breaking /tmp/console-gateway-base.yaml packages/api-contracts/openapi/console-gateway.yaml
          fi
      - name: Verify Gateway boundary and Go service
        working-directory: services/console-gateway
        env:
          CONSOLE_GATEWAY_TEST_REDIS_ADDR: localhost:6379
        run: |
          set -euo pipefail
          test ! -d db
          test ! -d migrations
          ! grep -E 'gorm|database/sql|jackc/pgx' go.mod
          gofmt -d . | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go test -race -count=1 ./...
          go build -o /tmp/console-gateway ./cmd/server
      - name: Verify real Food owner read and review
        env:
          PGPASSWORD: food_test
          FOOD_ADDR: 127.0.0.1:18096
          FOOD_DATABASE_URL: postgres://food:food_test@localhost:5432/food_integration?sslmode=disable
          FOOD_REDIS_URL: redis://localhost:6379/4
          FOOD_SERVICE_CLIENT_ID: console-gateway-food
          FOOD_SERVICE_KEY_ID: food-integration-key
          FOOD_SERVICE_SECRET: food-integration-secret-with-32-bytes-min
          CONSOLE_GATEWAY_TEST_REDIS_ADDR: localhost:6379
          CONSOLE_GATEWAY_TEST_FOOD_URL: http://localhost:18096
          CONSOLE_GATEWAY_TEST_FOOD_CLIENT_ID: console-gateway-food
          CONSOLE_GATEWAY_TEST_FOOD_KEY_ID: food-integration-key
          CONSOLE_GATEWAY_TEST_FOOD_CLIENT_SECRET: food-integration-secret-with-32-bytes-min
        run: |
          set -euo pipefail
          psql -h localhost -U food -d food_integration -v ON_ERROR_STOP=1 -f services/food/db/migrations/000001_food_operations.up.sql
          psql -h localhost -U food -d food_integration -v ON_ERROR_STOP=1 -f services/food/db/migrations/000002_food_posts.up.sql
          psql -h localhost -U food -d food_integration -v ON_ERROR_STOP=1 -f services/food/db/migrations/000003_food_submission_campus.up.sql
          psql -h localhost -U food -d food_integration -v ON_ERROR_STOP=1 -f services/food/db/migrations/000004_food_post_version.up.sql
          psql -h localhost -U food -d food_integration -v ON_ERROR_STOP=1 -f services/console-gateway/testdata/food_submission.sql
          (cd services/food && go build -o /tmp/food-integration ./cmd/server)
          /tmp/food-integration >/tmp/food-integration.log 2>&1 &
          food_pid=$!
          cleanup() { kill "$food_pid" 2>/dev/null || true; wait "$food_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18096/readyz >/dev/null; then ready=1; break; fi
            if ! kill -0 "$food_pid" 2>/dev/null; then cat /tmp/food-integration.log; exit 1; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/food-integration.log; exit 1; fi
          cd services/console-gateway
          go test ./internal/httpapi -run '^TestFoodSubmissionReviewPersistsAcrossGatewayAndOwner$' -count=1
      - name: Verify Console browser behavior
        run: |
          pnpm --filter @henukit/console run lint
          pnpm --filter @henukit/console run test
          pnpm --filter @henukit/console run test:e2e
          pnpm --filter @henukit/console run build
      - name: Build and scan service image
        run: |
          docker build -t henukit-console-gateway:${{ github.sha }} services/console-gateway
          docker run --rm -v "$PWD:/workspace" aquasec/trivy:0.70.0 fs --scanners secret --exit-code 1 /workspace
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0 image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 henukit-console-gateway:${{ github.sha }}
