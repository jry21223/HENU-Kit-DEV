# ⚠️ 已废弃：旧 Study-only 兼容栈（library web + study-legacy-admin）。
# 生产已全量运行 docker-compose.henukit.yml（2026-08-19 实测，20 服务）；
# 旧栈（apps/web、apps/study-legacy-admin、services/api、services/worker）已物理退役。
# 本文件仅保留供历史排障/紧急回滚，默认 `docker compose up` 会误命中本栈，请勿启动。
# 兼容开发请使用 docker-compose.dev.yml。
# LEGACY Study-only stack (library web + study-legacy-admin).
# Primary public+ops surface is docker-compose.henukit.yml
# (Portal / Console / QuizCraft / Study API as library backend).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: final_review_v2
      POSTGRES_USER: final_review
      POSTGRES_PASSWORD: final_review_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U final_review -d final_review_v2"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      APP_ENV: development
      API_PORT: 8080
      DATABASE_URL: postgres://final_review:final_review_dev@postgres:5432/final_review_v2?sslmode=disable
      REDIS_ADDR: redis:6379
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz | grep '\"ready\":true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./services/worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://final_review:final_review_dev@postgres:5432/final_review_v2?sslmode=disable
      REDIS_ADDR: redis:6379
      LLM_MODE: mock
      WORKER_HEALTH_PORT: 9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/readyz | grep '\"ready\":true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

  admin:
    build:
      context: .
      dockerfile: apps/study-legacy-admin/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      - api
    ports:
      - "5173:4173"

volumes:
  postgres_data:
  redis_data:
