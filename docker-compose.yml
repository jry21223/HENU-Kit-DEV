services:
  postgres:
    image: mirror.gcr.io/library/postgres:17-alpine
    container_name: final-review-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: final_review
      POSTGRES_USER: final_review
      POSTGRES_PASSWORD: final_review_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U final_review -d final_review"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
