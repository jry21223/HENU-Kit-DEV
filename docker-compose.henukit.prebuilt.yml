# Production overlay for fixed-SHA GitHub Actions image artifacts.
# It disables every HENU source build. Legacy Study and standalone QuizCraft
# runtimes are intentionally absent; Portal keeps their databases as data sources.
services:
  portal:
    image: henukit-portal:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    mem_limit: 256m
  portal-summary:
    image: henukit-portal-summary:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    mem_limit: 64m
    environment:
      PORTAL_SUMMARY_ACTIVE_SECRET: ${PORTAL_SUMMARY_CLIENT_SECRET:?PORTAL_SUMMARY_CLIENT_SECRET is required}
      PORTAL_VERSION: ${PORTAL_VERSION:?PORTAL_VERSION is required}
      PORTAL_COMMIT_SHA: ${RELEASE_SHA:?RELEASE_SHA is required}
      PORTAL_DEPLOYED_AT: ${PORTAL_DEPLOYED_AT:?PORTAL_DEPLOYED_AT is required}
  console:
    image: henukit-console:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    mem_limit: 64m
  platform-core:
    image: henukit-platform-core:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    mem_limit: 192m
    environment:
      PLATFORM_CORE_DATABASE_URL: ${PLATFORM_CORE_DATABASE_URL:?PLATFORM_CORE_DATABASE_URL is required}
      PLATFORM_CORE_REDIS_URL: ${PLATFORM_CORE_REDIS_URL:?PLATFORM_CORE_REDIS_URL is required}
      PLATFORM_CORE_IDEMPOTENCY_KEY: ${PLATFORM_CORE_IDEMPOTENCY_KEY:?PLATFORM_CORE_IDEMPOTENCY_KEY is required}
      PLATFORM_CORE_VERIFICATION_KEY: ${PLATFORM_CORE_VERIFICATION_KEY:?PLATFORM_CORE_VERIFICATION_KEY is required}
      PLATFORM_CORE_MAIL_DELIVERY_TOKEN: ${PLATFORM_CORE_MAIL_DELIVERY_TOKEN:?PLATFORM_CORE_MAIL_DELIVERY_TOKEN is required}
  platform-mail-worker:
    image: henukit-platform-mail-worker:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    mem_limit: 64m
    environment:
      PLATFORM_CORE_DATABASE_URL: ${PLATFORM_CORE_DATABASE_URL:?PLATFORM_CORE_DATABASE_URL is required}
      PLATFORM_CORE_VERIFICATION_KEY: ${PLATFORM_CORE_VERIFICATION_KEY:?PLATFORM_CORE_VERIFICATION_KEY is required}
      PLATFORM_CORE_MAIL_PROVIDER_TOKEN: ${PLATFORM_CORE_MAIL_PROVIDER_TOKEN:?PLATFORM_CORE_MAIL_PROVIDER_TOKEN is required}
  platform-smtp-provider:
    image: henukit-platform-smtp-provider:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    mem_limit: 64m
    environment:
      PLATFORM_CORE_MAIL_PROVIDER_TOKEN: ${PLATFORM_CORE_MAIL_PROVIDER_TOKEN:?PLATFORM_CORE_MAIL_PROVIDER_TOKEN is required}
      PLATFORM_CORE_SMTP_ADDRESS: ${PLATFORM_CORE_SMTP_ADDRESS:?PLATFORM_CORE_SMTP_ADDRESS is required}
      PLATFORM_CORE_SMTP_USERNAME: ${PLATFORM_CORE_SMTP_USERNAME:?PLATFORM_CORE_SMTP_USERNAME is required}
      PLATFORM_CORE_SMTP_PASSWORD: ${PLATFORM_CORE_SMTP_PASSWORD:?PLATFORM_CORE_SMTP_PASSWORD is required}
      PLATFORM_CORE_SMTP_FROM: ${PLATFORM_CORE_SMTP_FROM:?PLATFORM_CORE_SMTP_FROM is required}
  portal-api:
    image: henukit-portal-api:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    mem_limit: 96m
    environment:
      QUIZCRAFT_DATABASE_URL: ${QUIZCRAFT_DATABASE_URL:?QUIZCRAFT_DATABASE_URL is required}
      STUDY_DATABASE_URL: ${STUDY_DATABASE_URL:?STUDY_DATABASE_URL is required}
  account-portfolio:
    image: henukit-account-portfolio:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    mem_limit: 96m
    environment:
      ACCOUNT_PORTFOLIO_DATABASE_URL: ${ACCOUNT_PORTFOLIO_DATABASE_URL:?ACCOUNT_PORTFOLIO_DATABASE_URL is required}
      ACCOUNT_PORTFOLIO_SERVICE_CLIENT_ID: ${ACCOUNT_PORTFOLIO_CLIENT_ID:?ACCOUNT_PORTFOLIO_CLIENT_ID is required}
      ACCOUNT_PORTFOLIO_SERVICE_KEY_ID: ${ACCOUNT_PORTFOLIO_KEY_ID:?ACCOUNT_PORTFOLIO_KEY_ID is required}
      ACCOUNT_PORTFOLIO_SERVICE_SECRET: ${ACCOUNT_PORTFOLIO_CLIENT_SECRET:?ACCOUNT_PORTFOLIO_CLIENT_SECRET is required}
      ACCOUNT_PORTFOLIO_CONSOLE_CLIENT_ID: ${ACCOUNT_PORTFOLIO_CONSOLE_CLIENT_ID:?ACCOUNT_PORTFOLIO_CONSOLE_CLIENT_ID is required}
      ACCOUNT_PORTFOLIO_CONSOLE_KEY_ID: ${ACCOUNT_PORTFOLIO_CONSOLE_KEY_ID:?ACCOUNT_PORTFOLIO_CONSOLE_KEY_ID is required}
      ACCOUNT_PORTFOLIO_CONSOLE_SECRET: ${ACCOUNT_PORTFOLIO_CONSOLE_SECRET:?ACCOUNT_PORTFOLIO_CONSOLE_SECRET is required}
      ACCOUNT_PORTFOLIO_POINT_CURSOR_KEY: ${ACCOUNT_PORTFOLIO_POINT_CURSOR_KEY:?ACCOUNT_PORTFOLIO_POINT_CURSOR_KEY is required}
      ACCOUNT_PORTFOLIO_REQUIRE_STRONG_SECRET: "1"
      ACCOUNT_PORTFOLIO_EASYPAY_ENABLED: ${ACCOUNT_PORTFOLIO_EASYPAY_ENABLED:-0}
      ACCOUNT_PORTFOLIO_EASYPAY_BASE_URL: ${ACCOUNT_PORTFOLIO_EASYPAY_BASE_URL:-}
      ACCOUNT_PORTFOLIO_EASYPAY_PID: ${ACCOUNT_PORTFOLIO_EASYPAY_PID:-}
      ACCOUNT_PORTFOLIO_EASYPAY_KEY: ${ACCOUNT_PORTFOLIO_EASYPAY_KEY:-}
      ACCOUNT_PORTFOLIO_EASYPAY_NOTIFY_URL: ${ACCOUNT_PORTFOLIO_EASYPAY_NOTIFY_URL:-}
      ACCOUNT_PORTFOLIO_EASYPAY_RETURN_URL: ${ACCOUNT_PORTFOLIO_EASYPAY_RETURN_URL:-}
      ACCOUNT_PORTFOLIO_MEMBERSHIP_AMOUNT_CENTS: ${ACCOUNT_PORTFOLIO_MEMBERSHIP_AMOUNT_CENTS:-990}
      ACCOUNT_PORTFOLIO_MEMBERSHIP_PRODUCT_NAME: ${ACCOUNT_PORTFOLIO_MEMBERSHIP_PRODUCT_NAME:-HENU Kit 终身会员}
  notice:
    image: henukit-notice:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    mem_limit: 96m
    environment:
      NOTICE_DATABASE_URL: ${NOTICE_DATABASE_URL:?NOTICE_DATABASE_URL is required}
      NOTICE_REDIS_URL: ${NOTICE_REDIS_URL:?NOTICE_REDIS_URL is required}
      NOTICE_SERVICE_CLIENT_ID: ${NOTICE_SUMMARY_CLIENT_ID:?NOTICE_SUMMARY_CLIENT_ID is required}
      NOTICE_SERVICE_KEY_ID: ${NOTICE_SUMMARY_KEY_ID:?NOTICE_SUMMARY_KEY_ID is required}
      NOTICE_SERVICE_SECRET: ${NOTICE_SUMMARY_CLIENT_SECRET:?NOTICE_SUMMARY_CLIENT_SECRET is required}
  notice-worker:
    image: henukit-notice-worker:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    mem_limit: 64m
    environment:
      NOTICE_DATABASE_URL: ${NOTICE_DATABASE_URL:?NOTICE_DATABASE_URL is required}
  food:
    image: henukit-food:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    mem_limit: 96m
    environment:
      FOOD_DATABASE_URL: ${FOOD_DATABASE_URL:?FOOD_DATABASE_URL is required}
      FOOD_REDIS_URL: ${FOOD_REDIS_URL:?FOOD_REDIS_URL is required}
      FOOD_SERVICE_CLIENT_ID: ${FOOD_SUMMARY_CLIENT_ID:?FOOD_SUMMARY_CLIENT_ID is required}
      FOOD_SERVICE_KEY_ID: ${FOOD_SUMMARY_KEY_ID:?FOOD_SUMMARY_KEY_ID is required}
      FOOD_SERVICE_SECRET: ${FOOD_SUMMARY_CLIENT_SECRET:?FOOD_SUMMARY_CLIENT_SECRET is required}
  food-mcp:
    image: henukit-food-mcp:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    environment:
      FOOD_MCP_ADDR: ${FOOD_MCP_ADDR:-:8098}
      FOOD_MCP_ACCESS_TOKEN: ${FOOD_MCP_ACCESS_TOKEN:-}
      FOOD_POSTS_URL: ${FOOD_POSTS_URL:-http://food:8096}
      FOOD_POST_CREATE_CLIENT_ID: ${FOOD_POST_CREATE_CLIENT_ID:-portal-gateway-food-post-create}
      FOOD_POST_CREATE_KEY_ID: ${FOOD_POST_CREATE_KEY_ID:-food-post-create-key}
      FOOD_POST_CREATE_SECRET: ${FOOD_POST_CREATE_SECRET:-replace-food-post-create-secret-32bytes!!}
      FOOD_POST_READ_CLIENT_ID: ${FOOD_POST_READ_CLIENT_ID:-portal-gateway-food-post-read}
      FOOD_POST_READ_KEY_ID: ${FOOD_POST_READ_KEY_ID:-food-post-read-key}
      FOOD_POST_READ_SECRET: ${FOOD_POST_READ_SECRET:-replace-food-post-read-secret-32bytes!!}
  career-mcp:
    image: henukit-career-mcp:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    environment:
      CAREER_MCP_ADDR: ${CAREER_MCP_ADDR:-:8099}
      CAREER_MCP_ACCESS_TOKEN: ${CAREER_MCP_ACCESS_TOKEN:-}
      CAREER_URL: ${CAREER_URL:-http://career-opportunities:8097}
      CAREER_CLIENT_ID: ${CAREER_CLIENT_ID:-portal-gateway-career}
      CAREER_CLIENT_SECRET: ${CAREER_CLIENT_SECRET:?CAREER_CLIENT_SECRET is required}
      CAREER_KEY_ID: ${CAREER_KEY_ID:-career-key-1}
  library:
    image: henukit-library:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    mem_limit: 96m
    environment:
      LIBRARY_DATABASE_URL: ${LIBRARY_DATABASE_URL:?LIBRARY_DATABASE_URL is required}
      LIBRARY_REDIS_URL: ${LIBRARY_REDIS_URL:?LIBRARY_REDIS_URL is required}
      LIBRARY_SERVICE_CLIENT_ID: ${LIBRARY_SUMMARY_CLIENT_ID:?LIBRARY_SUMMARY_CLIENT_ID is required}
      LIBRARY_SERVICE_KEY_ID: ${LIBRARY_SUMMARY_KEY_ID:?LIBRARY_SUMMARY_KEY_ID is required}
      LIBRARY_SERVICE_SECRET: ${LIBRARY_SUMMARY_CLIENT_SECRET:?LIBRARY_SUMMARY_CLIENT_SECRET is required}
      LIBRARY_DOWNLOAD_SERVICE_CLIENT_ID: ${LIBRARY_DOWNLOAD_CLIENT_ID:?LIBRARY_DOWNLOAD_CLIENT_ID is required}
      LIBRARY_DOWNLOAD_SERVICE_KEY_ID: ${LIBRARY_DOWNLOAD_KEY_ID:?LIBRARY_DOWNLOAD_KEY_ID is required}
      LIBRARY_DOWNLOAD_SERVICE_SECRET: ${LIBRARY_DOWNLOAD_CLIENT_SECRET:?LIBRARY_DOWNLOAD_CLIENT_SECRET is required}
      LIBRARY_OSS_BUCKET: ${LIBRARY_OSS_BUCKET:?LIBRARY_OSS_BUCKET is required}
      LIBRARY_OSS_REGION: ${LIBRARY_OSS_REGION:?LIBRARY_OSS_REGION is required}
      LIBRARY_OSS_INTERNAL_ENDPOINT: ${LIBRARY_OSS_INTERNAL_ENDPOINT:?LIBRARY_OSS_INTERNAL_ENDPOINT is required}
      LIBRARY_OSS_PUBLIC_ENDPOINT: ${LIBRARY_OSS_PUBLIC_ENDPOINT:?LIBRARY_OSS_PUBLIC_ENDPOINT is required}
      LIBRARY_OSS_ECS_RAM_ROLE: ${LIBRARY_OSS_ECS_RAM_ROLE:?LIBRARY_OSS_ECS_RAM_ROLE is required}
      ALIBABA_CLOUD_IMDSV1_DISABLE: "true"
      STUDY_LEGACY_API_URL: ${STUDY_LEGACY_API_URL:?STUDY_LEGACY_API_URL is required}
      STUDY_LEGACY_ADMIN_TOKEN: ${STUDY_LEGACY_ADMIN_TOKEN:?STUDY_LEGACY_ADMIN_TOKEN is required}
  career-opportunities:
    image: henukit-career-opportunities:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    environment:
      CAREER_ADDR: ${CAREER_ADDR:-:8097}
      CAREER_DATABASE_URL: ${CAREER_DATABASE_URL:?CAREER_DATABASE_URL is required}
      CAREER_REDIS_URL: ${CAREER_REDIS_URL:-redis://redis:6379/6}
      CAREER_SERVICE_CLIENT_ID: ${CAREER_CLIENT_ID:-portal-gateway-career}
      CAREER_SERVICE_KEY_ID: ${CAREER_KEY_ID:-career-key-1}
      CAREER_SERVICE_SECRET: ${CAREER_CLIENT_SECRET:?CAREER_CLIENT_SECRET is required}
      CAREER_AI_MODE: ${CAREER_AI_MODE:-}
      CAREER_AI_BASE_URL: ${CAREER_AI_BASE_URL:-}
      CAREER_AI_API_KEY: ${CAREER_AI_API_KEY:-}
      CAREER_AI_MODEL: ${CAREER_AI_MODEL:-}
      CAREER_EXTRACT_RATE_LIMIT: ${CAREER_EXTRACT_RATE_LIMIT:-5}
  portal-gateway:
    image: henukit-portal-gateway:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    mem_limit: 128m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PLATFORM_CLIENT_SECRET: ${PLATFORM_CLIENT_SECRET:?PLATFORM_CLIENT_SECRET is required}
      PORTAL_SESSION_KEY: ${PORTAL_SESSION_KEY:?PORTAL_SESSION_KEY is required}
      LIBRARY_DOWNLOAD_URL: ${LIBRARY_DOWNLOAD_URL:?LIBRARY_DOWNLOAD_URL is required}
      LIBRARY_DOWNLOAD_CLIENT_ID: ${LIBRARY_DOWNLOAD_CLIENT_ID:?LIBRARY_DOWNLOAD_CLIENT_ID is required}
      LIBRARY_DOWNLOAD_CLIENT_SECRET: ${LIBRARY_DOWNLOAD_CLIENT_SECRET:?LIBRARY_DOWNLOAD_CLIENT_SECRET is required}
      LIBRARY_DOWNLOAD_KEY_ID: ${LIBRARY_DOWNLOAD_KEY_ID:?LIBRARY_DOWNLOAD_KEY_ID is required}
      # The fixed-SHA cutover catalog must call the internal QuizCraft Core.
      # Reusing the development Portal API defaults makes the public catalog
      # fail with 503 even while Core and its dedicated credentials are valid.
      PRACTICE_SERVICE_URL: ${QUIZCRAFT_CORE_URL:?QUIZCRAFT_CORE_URL is required}
      PRACTICE_CLIENT_ID: ${QUIZCRAFT_PORTAL_CATALOG_CLIENT_ID:?QUIZCRAFT_PORTAL_CATALOG_CLIENT_ID is required}
      PRACTICE_CLIENT_SECRET: ${QUIZCRAFT_PORTAL_CATALOG_CLIENT_SECRET:?QUIZCRAFT_PORTAL_CATALOG_CLIENT_SECRET is required}
      PRACTICE_KEY_ID: ${QUIZCRAFT_PORTAL_CATALOG_KEY_ID:?QUIZCRAFT_PORTAL_CATALOG_KEY_ID is required}
      PRACTICE_COMMAND_CLIENT_ID: ${PRACTICE_COMMAND_CLIENT_ID:?PRACTICE_COMMAND_CLIENT_ID is required}
      PRACTICE_COMMAND_CLIENT_SECRET: ${PRACTICE_COMMAND_CLIENT_SECRET:?PRACTICE_COMMAND_CLIENT_SECRET is required}
      PRACTICE_COMMAND_KEY_ID: ${PRACTICE_COMMAND_KEY_ID:?PRACTICE_COMMAND_KEY_ID is required}
      NOTICE_CLIENT_SECRET: ${NOTICE_CLIENT_SECRET:?NOTICE_CLIENT_SECRET is required}
      ACCOUNT_PORTFOLIO_CLIENT_SECRET: ${ACCOUNT_PORTFOLIO_CLIENT_SECRET:?ACCOUNT_PORTFOLIO_CLIENT_SECRET is required}
      ACCOUNT_PORTFOLIO_REQUIRE_STRONG_SECRET: "1"
  console-gateway:
    image: henukit-console-gateway:${RELEASE_SHA:?RELEASE_SHA is required}
    build: !reset null
    pull_policy: never
    ports: !override []
    mem_limit: 96m
    environment:
      PLATFORM_CLIENT_SECRET: ${CONSOLE_PLATFORM_CLIENT_SECRET:?CONSOLE_PLATFORM_CLIENT_SECRET is required}
      CONSOLE_SESSION_KEY: ${CONSOLE_SESSION_KEY:?CONSOLE_SESSION_KEY is required}
      PORTAL_SUMMARY_CLIENT_SECRET: ${PORTAL_SUMMARY_CLIENT_SECRET:?PORTAL_SUMMARY_CLIENT_SECRET is required}
      PLATFORM_SUMMARY_CLIENT_SECRET: ${PLATFORM_SUMMARY_CLIENT_SECRET:?PLATFORM_SUMMARY_CLIENT_SECRET is required}
      NOTICE_SUMMARY_CLIENT_SECRET: ${NOTICE_SUMMARY_CLIENT_SECRET:?NOTICE_SUMMARY_CLIENT_SECRET is required}
      LIBRARY_SUMMARY_CLIENT_SECRET: ${LIBRARY_SUMMARY_CLIENT_SECRET:?LIBRARY_SUMMARY_CLIENT_SECRET is required}
      QUIZCRAFT_SUMMARY_CLIENT_SECRET: ${QUIZCRAFT_SUMMARY_CLIENT_SECRET:?QUIZCRAFT_SUMMARY_CLIENT_SECRET is required}
      FOOD_SUMMARY_CLIENT_SECRET: ${FOOD_SUMMARY_CLIENT_SECRET:?FOOD_SUMMARY_CLIENT_SECRET is required}
      ACCOUNT_PORTFOLIO_API_URL: http://account-portfolio:8097
      ACCOUNT_PORTFOLIO_CONSOLE_CLIENT_ID: ${ACCOUNT_PORTFOLIO_CONSOLE_CLIENT_ID:?ACCOUNT_PORTFOLIO_CONSOLE_CLIENT_ID is required}
      ACCOUNT_PORTFOLIO_CONSOLE_KEY_ID: ${ACCOUNT_PORTFOLIO_CONSOLE_KEY_ID:?ACCOUNT_PORTFOLIO_CONSOLE_KEY_ID is required}
      ACCOUNT_PORTFOLIO_CONSOLE_SECRET: ${ACCOUNT_PORTFOLIO_CONSOLE_SECRET:?ACCOUNT_PORTFOLIO_CONSOLE_SECRET is required}
      ACCOUNT_PORTFOLIO_REQUIRE_STRONG_SECRET: "1"
  postgres:
    ports: !override []
    mem_limit: 256m
    volumes: !override
      - henukit_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  redis:
    ports: !override []
    mem_limit: 64m
  nginx:
    ports: !override
      - "127.0.0.1:8088:80"
    depends_on: !override
      - portal
      - portal-gateway
      - console
      - console-gateway
    mem_limit: 32m
