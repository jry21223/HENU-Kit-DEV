        -
          name: "X-Actor-User-Id"
          in: "header"
          required: false
          schema:
            type: "string"
            format: "uuid"
          description: "Verified Portal account UUID only, signed as canonical line 6. Absent for guests, whose identity is only the Core-issued cookie. Invalid Portal sessions are rejected, not guests."
      responses:
        200:
          description: "Owner-confirmed typed result."
          headers:
            Cache-Control:
              required: true
              schema:
                type: "string"
                enum: ["private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSessionEnvelope"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
        503:
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/portal/practice/training/sessions/{session_id}/answers:
    post:
      operationId: "submitTrainingAnswer"
      summary: "One immutable first answer per pinned question"
      description: "One immutable first answer per pinned question; stable per-question idempotency key. Never releases shared review."
      tags: ["TrainingOwner"]
      security:
        -
          trainingCommandBasic: []
          trainingCommandSignature: []
      x-internal: true
      parameters:
        -
          $ref: "#/components/parameters/SessionID"
        -
          $ref: "#/components/parameters/IdempotencyKey"
        -
          name: "X-Key-Id"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Timestamp"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Nonce"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Actor-User-Id"
          in: "header"
          required: false
          schema:
            type: "string"
            format: "uuid"
          description: "Verified Portal account UUID only, signed as canonical line 6. Absent for guests, whose identity is only the Core-issued cookie. Invalid Portal sessions are rejected, not guests."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingAnswerSubmission"
      responses:
        200:
          description: "Owner-confirmed typed result."
          headers:
            Cache-Control:
              required: true
              schema:
                type: "string"
                enum: ["private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingAnswerReceiptEnvelope"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
        503:
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/portal/practice/training/sessions/{session_id}/hints:
    post:
      operationId: "discloseTrainingHint"
      summary: "Cloze only"
      description: "Cloze only; persist a sequential authored hint layer before disclosure and mark all still-unanswered questions assisted under the same session lock."
      tags: ["TrainingOwner"]
      security:
        -
          trainingCommandBasic: []
          trainingCommandSignature: []
      x-internal: true
      parameters:
        -
          $ref: "#/components/parameters/SessionID"
        -
          $ref: "#/components/parameters/IdempotencyKey"
        -
          name: "X-Key-Id"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Timestamp"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Nonce"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Actor-User-Id"
          in: "header"
          required: false
          schema:
            type: "string"
            format: "uuid"
          description: "Verified Portal account UUID only, signed as canonical line 6. Absent for guests, whose identity is only the Core-issued cookie. Invalid Portal sessions are rejected, not guests."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingHintRequest"
      responses:
        200:
          description: "Owner-confirmed typed result."
          headers:
            Cache-Control:
              required: true
              schema:
                type: "string"
                enum: ["private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingHintDisclosureEnvelope"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
        503:
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/portal/practice/training/sessions/{session_id}/review:
    get:
      operationId: "getTrainingReview"
      summary: "Owner-bound"
      description: "Owner-bound; UNIT_INCOMPLETE until all exact pinned questions have first answers. Contains keys, analysis and evidence plus only already disclosed text layers."
      tags: ["TrainingOwner"]
      security:
        -
          trainingReadBasic: []
          trainingReadSignature: []
          trainingReadPermission: []
          trainingReadScope: []
          trainingReadProduct: []
      x-internal: true
      parameters:
        -
          $ref: "#/components/parameters/SessionID"
        -
          name: "X-Key-Id"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Timestamp"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Nonce"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Actor-User-Id"
          in: "header"
          required: false
          schema:
            type: "string"
            format: "uuid"
          description: "Verified Portal account UUID only, signed as canonical line 6. Absent for guests, whose identity is only the Core-issued cookie. Invalid Portal sessions are rejected, not guests."
      responses:
        200:
          description: "Owner-confirmed typed result."
          headers:
            Cache-Control:
              required: true
              schema:
                type: "string"
                enum: ["private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingReviewEnvelope"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
        503:
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/portal/practice/training/sessions/{session_id}/reveals:
    post:
      operationId: "revealTrainingLayer"
      summary: "Owner-bound complete-session reveal"
      description: "Owner-bound complete-session reveal; persist English before Chinese. Recovery/review replays only committed layers."
      tags: ["TrainingOwner"]
      security:
        -
          trainingCommandBasic: []
          trainingCommandSignature: []
      x-internal: true
      parameters:
        -
          $ref: "#/components/parameters/SessionID"
        -
          $ref: "#/components/parameters/IdempotencyKey"
        -
          name: "X-Key-Id"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Timestamp"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Nonce"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Actor-User-Id"
          in: "header"
          required: false
          schema:
            type: "string"
            format: "uuid"
          description: "Verified Portal account UUID only, signed as canonical line 6. Absent for guests, whose identity is only the Core-issued cookie. Invalid Portal sessions are rejected, not guests."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingRevealRequest"
      responses:
        200:
          description: "Owner-confirmed typed result."
          headers:
            Cache-Control:
              required: true
              schema:
                type: "string"
                enum: ["private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingLayerDisclosureEnvelope"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
        503:
          $ref: "#/components/responses/ServiceUnavailable"
components:
  parameters:
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        minLength: 16
        maxLength: 160
    SessionID:
      name: "session_id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
  responses:
    BadRequest:
      description: "Invalid closed request, option index, or pinned member/version."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrainingErrorEnvelope"
    Unauthorized:
      description: "Missing/invalid service signature or invalid Portal session; never downgraded to guest."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrainingErrorEnvelope"
    Forbidden:
      description: "Service permission or product scope is invalid."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrainingErrorEnvelope"
    NotFound:
      description: "Gate disabled, missing resource, or resource belongs to another actor; no existence leak."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrainingErrorEnvelope"
    Conflict:
      description: "Incomplete unit, locked layer, unavailable version, immutable answer, idempotency conflict, or nonce replay. error.code distinguishes the cause."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrainingErrorEnvelope"
    ServiceUnavailable:
      description: "Write/command/read gate closed, stop-write in force, or required owner/dependency unavailable."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrainingErrorEnvelope"
  schemas:
    TrainingStableID:
      type: "string"
      minLength: 1
      maxLength: 80
      pattern: "^[a-z0-9][a-z0-9_-]*$"
    TrainingSHA256:
      type: "string"
      pattern: "^[0-9a-f]{64}$"
    TrainingKind:
      type: "string"
      enum: ["listening", "cloze"]
    TrainingPhase:
      type: "string"
      enum: ["pending", "partial", "completed"]
    TrainingOutcome:
      type: "string"
      enum: ["independent_correct", "assisted_completion", "review_required"]
    TrainingAttribution:
      type: "object"
      additionalProperties: false
      required: ["component", "original", "source_url", "license_id", "license_url", "attribution", "modifications"]
      properties:
        component:
          type: "string"
          enum: ["audio", "text", "translation"]
        original:
          type: "boolean"
        source_url:
          type: "string"
          minLength: 1
          maxLength: 2048
          format: "uri"
          pattern: "^https://"
        license_id:
          type: "string"
          minLength: 1
          maxLength: 80
        license_url:
          type: "string"
          minLength: 1
          maxLength: 2048
          format: "uri"
          pattern: "^https://"
        attribution:
          type: "string"
          minLength: 1
          maxLength: 2000
        modifications:
          type: "string"
          minLength: 0
          maxLength: 2000
    TrainingCatalogItem:
      type: "object"
      additionalProperties: false
      required: ["unit_id", "unit_version_id", "bank_id", "bank_version_id", "kind", "title", "question_count", "content_sha256", "attributions"]
      properties:
        unit_id:
          type: "string"
          format: "uuid"
        unit_version_id:
          type: "string"
          format: "uuid"
        bank_id:
          type: "string"
          format: "uuid"
        bank_version_id:
          type: "string"
          format: "uuid"
        kind:
          $ref: "#/components/schemas/TrainingKind"
        title:
          type: "string"
          minLength: 1
          maxLength: 160
        question_count:
          type: "integer"
          minimum: 1
          maximum: 20
        content_sha256:
          $ref: "#/components/schemas/TrainingSHA256"
        attributions:
          type: "array"
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/TrainingAttribution"
    TrainingReviewItem:
      type: "object"
      additionalProperties: false
      required: ["unit_id", "unit_version_id", "session_id", "title", "kind", "phase", "review_required_count", "last_attempt_at"]
      properties:
        unit_id:
          type: "string"
          format: "uuid"
        unit_version_id:
          type: "string"
          format: "uuid"
        session_id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
          minLength: 1
          maxLength: 160
        kind:
          $ref: "#/components/schemas/TrainingKind"
        phase:
          $ref: "#/components/schemas/TrainingPhase"
        review_required_count:
          type: "integer"
          minimum: 1
          maximum: 20
        last_attempt_at:
          type: "string"
          format: "date-time"
    TrainingReviewItems:
      type: "object"
      additionalProperties: false
      required: ["items", "next_cursor"]
      properties:
        items:
          type: "array"
          minItems: 0
          maxItems: 50
          items:
            $ref: "#/components/schemas/TrainingReviewItem"
        next_cursor:
          type: "string"
          minLength: 0
          maxLength: 512
          pattern: "^[A-Za-z0-9_-]*$"
      description: "Actor-owned current review index, grouped by immutable unit version. Empty next_cursor means final page. Each item links a pinned session, not a browser question bank; fresh independent success updates the Core learning-state projection and may remove it."
    TrainingCatalog:
      type: "object"
      additionalProperties: false
      required: ["units"]
      properties:
        units:
          type: "array"
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/TrainingCatalogItem"
    TrainingQuestion:
      type: "object"
      additionalProperties: false
      required: ["question_id", "question_version_id", "content", "options"]
      properties:
        question_id:
          type: "string"
          format: "uuid"
        question_version_id:
          type: "string"
          format: "uuid"
        content:
          type: "string"
          minLength: 1
          maxLength: 3000
        options:
          type: "array"
          minItems: 2
          maxItems: 8
          items:
            type: "string"
            minLength: 1
            maxLength: 1000
    TrainingMedia:
      type: "object"
      additionalProperties: false
      required: ["asset_id", "sha256", "url", "content_type", "duration_ms"]
      properties:
        asset_id:
          type: "string"
          format: "uuid"
        sha256:
          $ref: "#/components/schemas/TrainingSHA256"
        url:
          type: "string"
          minLength: 1
          maxLength: 160
          pattern: "^/practice-media/[0-9a-f]{64}\\.mp3$"
        content_type:
          type: "string"
          enum: ["audio/mpeg"]
        duration_ms:
          type: "integer"
          minimum: 1
          maximum: 1800000
    TrainingHintDescriptor:
      type: "object"
      additionalProperties: false
      required: ["hint_id", "level_count"]
      properties:
        hint_id:
          $ref: "#/components/schemas/TrainingStableID"
        level_count:
          type: "integer"
          minimum: 1
          maximum: 3
