openapi: "3.1.0"
info:
  title: "QuizCraft Training Owner API"
  version: "0.1.0"
  description: "Frozen additive training contract (HC-641 / ADR-0060); declarations and generated clients only, not implemented endpoints. Ordinary Practice envelopes, routes and gates are unchanged. Internal exact allowlist. Read requests reuse the existing read credential; commands reuse the distinct existing command credential. HMAC is METHOD\\nREQUEST_URI\\nTIMESTAMP\\nNONCE\\nSHA256(raw body), plus \\nACTOR_UUID only for an authenticated actor. Catalog always has no actor or cookie. Session and review GET may forward only quizcraft_anonymous; no cookie alone authenticates a request without service HMAC. Canonical RequestURI includes the exact path and query (review-items alone accepts cursor and page_size). Read permission=portal.practice.read, scope=product, product=quizcraft. No new credentials or permissions. All routes except review-items reject query parameters; review-items accepts only one cursor and page_size, in that canonical order. All JSON objects reject unknown fields. Responses are private, no-store; Content-Type application/json. See docs/development/english-training-contract.md for gates, recovery, cross-field invariants and errors."
  license:
    name: "Private"
    identifier: "LicenseRef-Private"
servers:
  -
    url: "http://quizcraft:8080"
tags:
  -
    name: "TrainingOwner"
    description: "General English listening and cloze training."
paths:
  /api/v1/portal/practice/training/catalog:
    get:
      operationId: "listTrainingCatalog"
      summary: "Public safe catalog"
      description: "Public safe catalog; no session identity, hints, keys or private material."
      tags: ["TrainingOwner"]
      security:
        -
          trainingReadBasic: []
          trainingReadSignature: []
          trainingReadPermission: []
          trainingReadScope: []
          trainingReadProduct: []
      x-internal: true
      parameters:
        -
          name: "X-Key-Id"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Timestamp"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Nonce"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
      responses:
        200:
          description: "Owner-confirmed typed result."
          headers:
            Cache-Control:
              required: true
              schema:
                type: "string"
                enum: ["private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingCatalogEnvelope"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
        503:
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/portal/practice/training/review-items:
    get:
      operationId: "listTrainingReviewItems"
      summary: "Actor-owned review index"
      description: "Actor-owned review index; recover the returned pinned session for complete unit context. Current Core learning state decides review membership."
      tags: ["TrainingOwner"]
      security:
        -
          trainingReadBasic: []
          trainingReadSignature: []
          trainingReadPermission: []
          trainingReadScope: []
          trainingReadProduct: []
      x-internal: true
      parameters:
        -
          name: "cursor"
          in: "query"
          required: false
          schema:
            type: "string"
            minLength: 1
            maxLength: 512
            pattern: "^[A-Za-z0-9_-]+$"
        -
          name: "page_size"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 50
            default: 20
        -
          name: "X-Key-Id"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Timestamp"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Nonce"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Actor-User-Id"
          in: "header"
          required: false
          schema:
            type: "string"
            format: "uuid"
          description: "Verified Portal account UUID only, signed as canonical line 6. Absent for guests, whose identity is only the Core-issued cookie. Invalid Portal sessions are rejected, not guests."
      responses:
        200:
          description: "Owner-confirmed typed result."
          headers:
            Cache-Control:
              required: true
              schema:
                type: "string"
                enum: ["private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingReviewItemsEnvelope"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
        503:
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/portal/practice/training/sessions:
    post:
      operationId: "createTrainingSession"
      summary: "Pin exactly the selected currently published immutable unit version. Never substitute a newer version."
      description: "Pin exactly the selected currently published immutable unit version. Never substitute a newer version."
      tags: ["TrainingOwner"]
      security:
        -
          trainingCommandBasic: []
          trainingCommandSignature: []
      x-internal: true
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
        -
          name: "X-Key-Id"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Timestamp"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Nonce"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Actor-User-Id"
          in: "header"
          required: false
          schema:
            type: "string"
            format: "uuid"
          description: "Verified Portal account UUID only, signed as canonical line 6. Absent for guests, whose identity is only the Core-issued cookie. Invalid Portal sessions are rejected, not guests."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingCreateSession"
      responses:
        201:
          description: "Owner-confirmed typed result."
          headers:
            Cache-Control:
              required: true
              schema:
                type: "string"
                enum: ["private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSessionEnvelope"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
        503:
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/portal/practice/training/sessions/{session_id}:
    get:
      operationId: "getTrainingSession"
      summary: "Owner-bound recovery of safe pinned content, saved first answers, hints and disclosed layer names. Does not return shared review."
      description: "Owner-bound recovery of safe pinned content, saved first answers, hints and disclosed layer names. Does not return shared review."
      tags: ["TrainingOwner"]
      security:
        -
          trainingReadBasic: []
          trainingReadSignature: []
          trainingReadPermission: []
          trainingReadScope: []
          trainingReadProduct: []
      x-internal: true
      parameters:
        -
          $ref: "#/components/parameters/SessionID"
        -
          name: "X-Key-Id"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 160
        -
          name: "X-Timestamp"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
