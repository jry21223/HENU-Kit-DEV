          enum: ["TRAINING_DISABLED", "INVALID_REQUEST", "UNAUTHENTICATED", "FORBIDDEN", "NOT_FOUND", "VERSION_UNAVAILABLE", "UNIT_INCOMPLETE", "LAYER_LOCKED", "IDEMPOTENCY_CONFLICT", "FIRST_ANSWER_IMMUTABLE", "SERVICE_REPLAY", "DEPENDENCY_UNAVAILABLE"]
        message:
          type: "string"
          minLength: 1
          maxLength: 500
    TrainingErrorEnvelope:
      type: "object"
      additionalProperties: false
      required: ["request_id", "error"]
      properties:
        request_id:
          type: "string"
          minLength: 1
          maxLength: 120
          pattern: "^req_[A-Za-z0-9_-]+$"
        error:
          $ref: "#/components/schemas/TrainingError"
  securitySchemes:
    trainingReadBasic:
      type: "http"
      scheme: "basic"
      description: "Existing independent QuizCraft catalog/read credential; no credential provisioning is part of HC-641."
    trainingReadSignature:
      type: "apiKey"
      in: "header"
      name: "X-Signature"
      description: "Exact raw-body HMAC with optional signed actor; timestamp, key id and nonce are also mandatory."
    trainingReadPermission:
      type: "apiKey"
      in: "header"
      name: "X-Permission-Code"
      description: "Exactly portal.practice.read, a service claim, not a learner role grant."
    trainingReadScope:
      type: "apiKey"
      in: "header"
      name: "X-Scope-Kind"
      description: "Exactly product."
    trainingReadProduct:
      type: "apiKey"
      in: "header"
      name: "X-Product-Code"
      description: "Exactly quizcraft."
    trainingCommandBasic:
      type: "http"
      scheme: "basic"
      description: "Existing command credential, independent of reads."
    trainingCommandSignature:
      type: "apiKey"
      in: "header"
      name: "X-Signature"
      description: "Exact raw-body HMAC, nonce and optional signed account UUID."
