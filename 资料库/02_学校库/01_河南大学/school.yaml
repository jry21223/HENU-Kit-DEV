# 河南大学 学院-专业归属关系
# 路径: 02_学校库/01_河南大学/school.yaml
# 用途: 定义学校下设学院及专业，供 course.yaml 的 applicable_majors 引用校验

school: 河南大学

colleges:
  - name: 软件学院
    code: "01"
    majors:
      - 软件工程
      - 网络工程
      - 科学与工程可视化
      - 工程智能
      - 数智空间

# 说明：
# - 此文件是 course.yaml 中 applicable_majors 的合法值来源
# - libraryctl validate 可据此校验 course.yaml 中的专业名是否合法
# - 新增专业时在此文件追加，不要分散在各 course.yaml 中
