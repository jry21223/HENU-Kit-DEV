# HENU Kit primary full-stack compose.
# Study-only stacks in docker-compose.yml / docker-compose.dev.yml remain
# available for legacy maintenance; this file is the default public+ops surface.
#
# Usage:
#   cp .env.henukit.example .env.henukit
#   docker compose -f docker-compose.henukit.yml --env-file .env.henukit up --build
#
# Edge: http://localhost:8088
#   /            Portal
#   /api/        Portal Gateway
#   /console/    302 → https://console.henukit.cn/ (Console subdomain)
#   /library     Portal integrated materials
#   /practice    Portal integrated practice

name: henukit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-henukit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-henukit_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - henukit_postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-henukit-dbs.sh:/docker-entrypoint-initdb.d/01-init-henukit-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - henukit_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  platform-core:
    build:
      context: ./services/platform-core
    environment:
      PLATFORM_CORE_ADDRESS: ${PLATFORM_CORE_ADDRESS:-:8081}
      PLATFORM_CORE_DATABASE_URL: ${PLATFORM_CORE_DATABASE_URL:-postgres://henukit:henukit_dev_change_me@postgres:5432/platform?sslmode=disable}
      PLATFORM_CORE_REDIS_URL: ${PLATFORM_CORE_REDIS_URL:-redis://redis:6379/0}
      # base64 of exactly 32 raw bytes (dev placeholders only)
      PLATFORM_CORE_IDEMPOTENCY_KEY: ${PLATFORM_CORE_IDEMPOTENCY_KEY:-cUUpjiEH+E5FD5YBx3ZKWN7qS7tyWHo24/HCXs+OIGI=}
      PLATFORM_CORE_VERIFICATION_KEY: ${PLATFORM_CORE_VERIFICATION_KEY:-cUUpjiEH+E5FD5YBx3ZKWN7qS7tyWHo24/HCXs+OIGI=}
      PLATFORM_CORE_MAIL_DELIVERY_TOKEN: ${PLATFORM_CORE_MAIL_DELIVERY_TOKEN:-Wld9pvxGjnWc_54pv7SliNmbZELBYpFHsX1vaqpK4co}
      PLATFORM_CORE_MAIL_DELIVERY_KEY_ID: ${PLATFORM_CORE_MAIL_DELIVERY_KEY_ID:-mail-provider-active}
      PLATFORM_CORE_STUDENT_EMAIL_DOMAINS: ${PLATFORM_CORE_STUDENT_EMAIL_DOMAINS:-henu.edu.cn}
      PLATFORM_CORE_PUBLIC_PATH_PREFIX: ${PLATFORM_CORE_PUBLIC_PATH_PREFIX:-/account-auth}
      PLATFORM_CORE_TRUSTED_PROXY_CIDRS: ${PLATFORM_CORE_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      PLATFORM_CORE_LOCAL_COOKIE_NAME: ${PLATFORM_CORE_LOCAL_COOKIE_NAME:-henukit_core_session_local}
      PLATFORM_CORE_CORE_SESSION_TTL: ${PLATFORM_CORE_CORE_SESSION_TTL:-720h}
      PLATFORM_CORE_AUTHORIZATION_TTL: ${PLATFORM_CORE_AUTHORIZATION_TTL:-90s}
      PLATFORM_CORE_EXCHANGE_SESSION_TTL: ${PLATFORM_CORE_EXCHANGE_SESSION_TTL:-8h}
      # The Portal client's exchange Session outlives the 8h default so the
      # Portal Session (cookie MaxAge + permission checks) stays valid for the
      # full 30-day Core Session window. Console and QuizCraft keep 8h.
      PLATFORM_CORE_EXCHANGE_SESSION_TTL_OVERRIDES: ${PLATFORM_CORE_EXCHANGE_SESSION_TTL_OVERRIDES:-portal-gateway=720h}
      PLATFORM_CORE_IDEMPOTENCY_TTL: ${PLATFORM_CORE_IDEMPOTENCY_TTL:-24h}
      PLATFORM_CORE_VERIFICATION_CODE_TTL: ${PLATFORM_CORE_VERIFICATION_CODE_TTL:-10m}
      PLATFORM_CORE_VERIFICATION_RESEND_DELAY: ${PLATFORM_CORE_VERIFICATION_RESEND_DELAY:-60s}
      PLATFORM_CORE_CAREER_DIGEST_CLIENT_ID: ${PLATFORM_CORE_CAREER_DIGEST_CLIENT_ID:-}
      PLATFORM_CORE_CAREER_DIGEST_KEY_ID: ${PLATFORM_CORE_CAREER_DIGEST_KEY_ID:-}
      PLATFORM_CORE_CAREER_DIGEST_SECRET: ${PLATFORM_CORE_CAREER_DIGEST_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8081"

  # Mail delivery: outbox consumer + local SMTP bridge (Aliyun DirectMail etc.)
  platform-smtp-provider:
    build:
      context: ./services/platform-core
      dockerfile: Dockerfile.smtp-provider
    environment:
      PLATFORM_CORE_SMTP_ALLOW_DOCKER: "1"
      PLATFORM_CORE_SMTP_PROVIDER_ADDRESS: ${PLATFORM_CORE_SMTP_PROVIDER_ADDRESS:-0.0.0.0:18081}
      PLATFORM_CORE_SMTP_PROVIDER_ID: ${PLATFORM_CORE_SMTP_PROVIDER_ID:-aliyun-directmail}
      PLATFORM_CORE_SMTP_LEDGER_DIR: /var/lib/henukit-smtp-provider
      PLATFORM_CORE_MAIL_PROVIDER_TOKEN: ${PLATFORM_CORE_MAIL_PROVIDER_TOKEN:-replace-mail-provider-token-32chars-min!!}
      PLATFORM_CORE_MAIL_PROVIDER_KEY_ID: ${PLATFORM_CORE_MAIL_PROVIDER_KEY_ID:-mail-provider-active}
      # Fill after Aliyun DirectMail console setup (see docs/operations/aliyun-directmail-setup.md)
      PLATFORM_CORE_SMTP_ADDRESS: ${PLATFORM_CORE_SMTP_ADDRESS:-smtpdm.aliyun.com:465}
      PLATFORM_CORE_SMTP_USERNAME: ${PLATFORM_CORE_SMTP_USERNAME:-}
      PLATFORM_CORE_SMTP_PASSWORD: ${PLATFORM_CORE_SMTP_PASSWORD:-}
      PLATFORM_CORE_SMTP_FROM: ${PLATFORM_CORE_SMTP_FROM:-noreply@notify.henukit.cn}
      PLATFORM_CORE_SMTP_MESSAGE_ID_DOMAIN: ${PLATFORM_CORE_SMTP_MESSAGE_ID_DOMAIN:-henukit.cn}
    volumes:
      - henukit_smtp_ledger:/var/lib/henukit-smtp-provider
    # Do NOT publish 18081 to the host in production.
    expose:
      - "18081"
    restart: unless-stopped

  platform-mail-worker:
    build:
      context: ./services/platform-core
      dockerfile: Dockerfile.worker
    environment:
      PLATFORM_CORE_DATABASE_URL: ${PLATFORM_CORE_DATABASE_URL:-postgres://henukit:henukit_dev_change_me@postgres:5432/platform?sslmode=disable}
      PLATFORM_CORE_VERIFICATION_KEY: ${PLATFORM_CORE_VERIFICATION_KEY:-cUUpjiEH+E5FD5YBx3ZKWN7qS7tyWHo24/HCXs+OIGI=}
      PLATFORM_CORE_MAIL_PROVIDER_ENDPOINT: ${PLATFORM_CORE_MAIL_PROVIDER_ENDPOINT:-http://platform-smtp-provider:18081/internal/send}
      PLATFORM_CORE_MAIL_PROVIDER_TOKEN: ${PLATFORM_CORE_MAIL_PROVIDER_TOKEN:-replace-mail-provider-token-32chars-min!!}
      PLATFORM_CORE_MAIL_WORKER_ID: ${PLATFORM_CORE_MAIL_WORKER_ID:-platform-mail-worker-1}
      # Allow http://platform-smtp-provider on the compose network (see mailworker.NewHTTPSender).
      PLATFORM_CORE_SMTP_ALLOW_DOCKER: ${PLATFORM_CORE_SMTP_ALLOW_DOCKER:-1}
    depends_on:
      postgres:
        condition: service_healthy
      platform-smtp-provider:
        condition: service_started
    restart: unless-stopped


  portal-api:
    build:
      context: ./services/portal-api
    environment:
      LISTEN_ADDR: ${PORTAL_API_LISTEN_ADDR:-:8085}
      # Production defaults to durable PostgreSQL-backed product data.
      PORTAL_API_MODE: ${PORTAL_API_MODE:-live}
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:-http://localhost:8088}
      STUDY_DATABASE_URL: ${STUDY_DATABASE_URL:-postgres://henukit:henukit_dev_change_me@postgres:5432/study?sslmode=disable}
      PORTAL_DATABASE_URL: ${PORTAL_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8085"

  # Account Portfolio owns user-visible points, memberships, orders,
  # notifications, and support tickets. It is deliberately isolated from the
  # legacy Study database and only accepts signed requests from the separately
  # credentialed Portal Gateway and Console Gateway.
  account-portfolio:
    build:
      context: ./services/account-portfolio
    environment:
      ACCOUNT_PORTFOLIO_ADDR: ${ACCOUNT_PORTFOLIO_ADDR:-:8097}
      ACCOUNT_PORTFOLIO_DATABASE_URL: ${ACCOUNT_PORTFOLIO_DATABASE_URL:-postgres://henukit:henukit_dev_change_me@postgres:5432/account_portfolio?sslmode=disable}
      ACCOUNT_PORTFOLIO_SERVICE_CLIENT_ID: ${ACCOUNT_PORTFOLIO_CLIENT_ID:-portal-gateway}
      ACCOUNT_PORTFOLIO_SERVICE_KEY_ID: ${ACCOUNT_PORTFOLIO_KEY_ID:-account-portfolio-key}
      ACCOUNT_PORTFOLIO_SERVICE_SECRET: ${ACCOUNT_PORTFOLIO_CLIENT_SECRET:-replace-account-portfolio-client-secret-32bytes-min!!}
      ACCOUNT_PORTFOLIO_CONSOLE_CLIENT_ID: ${ACCOUNT_PORTFOLIO_CONSOLE_CLIENT_ID:-console-gateway}
      ACCOUNT_PORTFOLIO_CONSOLE_KEY_ID: ${ACCOUNT_PORTFOLIO_CONSOLE_KEY_ID:-account-portfolio-console-key}
      ACCOUNT_PORTFOLIO_CONSOLE_SECRET: ${ACCOUNT_PORTFOLIO_CONSOLE_SECRET:-replace-account-portfolio-console-secret-32bytes-min!!}
      ACCOUNT_PORTFOLIO_POINT_CURSOR_KEY: ${ACCOUNT_PORTFOLIO_POINT_CURSOR_KEY:-cmVwbGFjZS14eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=}
      ACCOUNT_PORTFOLIO_REQUIRE_STRONG_SECRET: ${ACCOUNT_PORTFOLIO_REQUIRE_STRONG_SECRET:-0}
      ACCOUNT_PORTFOLIO_EASYPAY_ENABLED: ${ACCOUNT_PORTFOLIO_EASYPAY_ENABLED:-0}
      ACCOUNT_PORTFOLIO_EASYPAY_BASE_URL: ${ACCOUNT_PORTFOLIO_EASYPAY_BASE_URL:-}
      ACCOUNT_PORTFOLIO_EASYPAY_PID: ${ACCOUNT_PORTFOLIO_EASYPAY_PID:-}
      ACCOUNT_PORTFOLIO_EASYPAY_KEY: ${ACCOUNT_PORTFOLIO_EASYPAY_KEY:-}
      ACCOUNT_PORTFOLIO_EASYPAY_NOTIFY_URL: ${ACCOUNT_PORTFOLIO_EASYPAY_NOTIFY_URL:-}
      ACCOUNT_PORTFOLIO_EASYPAY_RETURN_URL: ${ACCOUNT_PORTFOLIO_EASYPAY_RETURN_URL:-}
      ACCOUNT_PORTFOLIO_MEMBERSHIP_AMOUNT_CENTS: ${ACCOUNT_PORTFOLIO_MEMBERSHIP_AMOUNT_CENTS:-990}
      ACCOUNT_PORTFOLIO_MEMBERSHIP_PRODUCT_NAME: ${ACCOUNT_PORTFOLIO_MEMBERSHIP_PRODUCT_NAME:-HENU Kit 终身会员}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8097"
    healthcheck:
      test: ["CMD", "/account-portfolio-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Notice owns whitelisted sources, immutable versions, review, audience, and
  # distribution. It accepts only signed Console Gateway calls and verifies the
  # same NOTICE_SUMMARY_* credential pair the Gateway presents.
  notice:
    build:
      context: ./services/notice
    environment:
      NOTICE_ADDR: ${NOTICE_ADDR:-:8094}
      NOTICE_DATABASE_URL: ${NOTICE_DATABASE_URL:-postgres://henukit:henukit_dev_change_me@postgres:5432/notice?sslmode=disable}
      NOTICE_REDIS_URL: ${NOTICE_REDIS_URL:-redis://redis:6379/3}
      NOTICE_SERVICE_CLIENT_ID: ${NOTICE_SUMMARY_CLIENT_ID:-console-gateway-notice}
      NOTICE_SERVICE_KEY_ID: ${NOTICE_SUMMARY_KEY_ID:-notice-summary-key}
      NOTICE_SERVICE_SECRET: ${NOTICE_SUMMARY_CLIENT_SECRET:-replace-notice-summary-client-secret-32bytes-min!!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8094"
    healthcheck:
      test: ["CMD", "/notice-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Notice delivery daemon: claims queued distributions with SKIP LOCKED,
  # retries provider failures up to three times, and records audited outcomes.
  # Delivery completes only when NOTICE_DELIVERY_URL / NOTICE_DELIVERY_TOKEN
  # point at a provider webhook; until then distributions stay queued.
  notice-worker:
    build:
      context: ./services/notice
      dockerfile: Dockerfile.worker
    environment:
      NOTICE_DATABASE_URL: ${NOTICE_DATABASE_URL:-postgres://henukit:henukit_dev_change_me@postgres:5432/notice?sslmode=disable}
      NOTICE_DELIVERY_URL: ${NOTICE_DELIVERY_URL:-}
      NOTICE_DELIVERY_TOKEN: ${NOTICE_DELIVERY_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Food owns submissions, anomaly tickets, and tier adjustments. It accepts
  # only signed Console Gateway calls and verifies the same FOOD_SUMMARY_*
  # credential pair the Gateway presents.
  food:
    build:
      context: ./services/food
    environment:
      FOOD_ADDR: ${FOOD_ADDR:-:8096}
      FOOD_DATABASE_URL: ${FOOD_DATABASE_URL:-postgres://henukit:henukit_dev_change_me@postgres:5432/food?sslmode=disable}
      FOOD_REDIS_URL: ${FOOD_REDIS_URL:-redis://redis:6379/4}
      FOOD_SERVICE_CLIENT_ID: ${FOOD_SUMMARY_CLIENT_ID:-console-gateway-food}
      FOOD_SERVICE_KEY_ID: ${FOOD_SUMMARY_KEY_ID:-food-summary-key}
      FOOD_SERVICE_SECRET: ${FOOD_SUMMARY_CLIENT_SECRET:-replace-food-summary-client-secret-32bytes-min!!}
      # Food Post rings (ADR-0032): create/read are independent of each other
      # and of the Console FOOD_SUMMARY_* credential above.
      FOOD_POST_CREATE_CLIENT_ID: ${FOOD_POST_CREATE_CLIENT_ID:-portal-gateway-food-post-create}
      FOOD_POST_CREATE_KEY_ID: ${FOOD_POST_CREATE_KEY_ID:-food-post-create-key}
      FOOD_POST_CREATE_SECRET: ${FOOD_POST_CREATE_SECRET:-replace-food-post-create-secret-32bytes!!}
      FOOD_POST_READ_CLIENT_ID: ${FOOD_POST_READ_CLIENT_ID:-portal-gateway-food-post-read}
      FOOD_POST_READ_KEY_ID: ${FOOD_POST_READ_KEY_ID:-food-post-read-key}
      FOOD_POST_READ_SECRET: ${FOOD_POST_READ_SECRET:-replace-food-post-read-secret-32bytes!!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8096"
    healthcheck:
      test: ["CMD", "/food-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Food Post MCP (ADR-0033): exposes the ADR-0032 Food Post capability to
  # remote AI agents over Streamable HTTP. Reuses the same Food Post rings as
  # portal-gateway; fails closed without FOOD_MCP_ACCESS_TOKEN.
  food-mcp:
    build:
      context: ./services/food-mcp
    environment:
      FOOD_MCP_ADDR: ${FOOD_MCP_ADDR:-:8098}
      FOOD_MCP_ACCESS_TOKEN: ${FOOD_MCP_ACCESS_TOKEN:-}
      FOOD_POSTS_URL: ${FOOD_POSTS_URL:-http://food:8096}
      FOOD_POST_CREATE_CLIENT_ID: ${FOOD_POST_CREATE_CLIENT_ID:-portal-gateway-food-post-create}
      FOOD_POST_CREATE_KEY_ID: ${FOOD_POST_CREATE_KEY_ID:-food-post-create-key}
      FOOD_POST_CREATE_SECRET: ${FOOD_POST_CREATE_SECRET:-replace-food-post-create-secret-32bytes!!}
      FOOD_POST_READ_CLIENT_ID: ${FOOD_POST_READ_CLIENT_ID:-portal-gateway-food-post-read}
      FOOD_POST_READ_KEY_ID: ${FOOD_POST_READ_KEY_ID:-food-post-read-key}
      FOOD_POST_READ_SECRET: ${FOOD_POST_READ_SECRET:-replace-food-post-read-secret-32bytes!!}
    depends_on:
      food:
        condition: service_healthy
    expose:
      - "8098"

  # Career Resume MCP: exposes the resume AI-extraction capability (upload →
  # AI extract → profile prefill draft) to remote AI agents over Streamable
  # HTTP. Fails closed without CAREER_MCP_ACCESS_TOKEN; the actor is
  # caller-declared with no membership check, matching food-mcp (ADR-0033).
  career-mcp:
    build:
      context: ./services/career-mcp
    environment:
      CAREER_MCP_ADDR: ${CAREER_MCP_ADDR:-:8099}
      CAREER_MCP_ACCESS_TOKEN: ${CAREER_MCP_ACCESS_TOKEN:-}
      CAREER_URL: ${CAREER_URL:-http://career-opportunities:8097}
      CAREER_CLIENT_ID: ${CAREER_CLIENT_ID:-portal-gateway-career}
      CAREER_CLIENT_SECRET: ${CAREER_CLIENT_SECRET:-replace-career-service-secret-32bytes!!}
      CAREER_KEY_ID: ${CAREER_KEY_ID:-career-key-1}
    depends_on:
      career-opportunities:
        condition: service_healthy
    expose:
      - "8099"

  # Authorized upstream getWork MCP: internal job-fact source for the Career
  # worker. It is not published to the host and its mutable/login/mail tools are
  # never exposed through the HENU browser contract.
  getwork-mcp:
    profiles: ["getwork"]
    build:
      context: ./services/getwork-mcp
    environment:
      GETWORK_MCP_HOST: 0.0.0.0
      GETWORK_MCP_PORT: 8100
      GETWORK_MCP_ACCESS_TOKEN: ${GETWORK_MCP_ACCESS_TOKEN:-}
    expose:
      - "8100"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2))['ok'] is True"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Career Opportunities owns the Work Radar async search core (#392): the
  # Portal Gateway signs the verified actor in; the worker drives queued
  # searches to completion. Fails closed without credentials.
  career-opportunities:
    build:
      context: ./services/career-opportunities
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 192MiB
      CAREER_ADDR: ${CAREER_ADDR:-:8097}
      CAREER_DATABASE_URL: ${CAREER_DATABASE_URL:-postgres://henukit:henukit_dev_change_me@postgres:5432/career?sslmode=disable}
      CAREER_REDIS_URL: ${CAREER_REDIS_URL:-redis://redis:6379/6}
      CAREER_SERVICE_CLIENT_ID: ${CAREER_CLIENT_ID:-portal-gateway-career}
      CAREER_SERVICE_KEY_ID: ${CAREER_KEY_ID:-career-key-1}
      CAREER_SERVICE_SECRET: ${CAREER_CLIENT_SECRET:-replace-career-service-secret-32bytes!!}
      CAREER_GETWORK_MCP_URL: ${CAREER_GETWORK_MCP_URL:-}
      CAREER_GETWORK_MCP_ACCESS_TOKEN: ${GETWORK_MCP_ACCESS_TOKEN:-}
      CAREER_GETWORK_SINCE_DAYS: ${CAREER_GETWORK_SINCE_DAYS:-7}
      PLATFORM_CORE_CAREER_DIGEST_URL: ${PLATFORM_CORE_CAREER_DIGEST_URL:-}
      PLATFORM_CORE_CAREER_DIGEST_CLIENT_ID: ${PLATFORM_CORE_CAREER_DIGEST_CLIENT_ID:-}
      PLATFORM_CORE_CAREER_DIGEST_KEY_ID: ${PLATFORM_CORE_CAREER_DIGEST_KEY_ID:-}
      PLATFORM_CORE_CAREER_DIGEST_SECRET: ${PLATFORM_CORE_CAREER_DIGEST_SECRET:-}
      CAREER_RESULT_URL: ${CAREER_RESULT_URL:-http://localhost:8088/career}
      # Resume AI extraction (#resume-upload): leave the AI vars empty for the
      # production-safe off state, or fill in a custom OpenAI-compatible
      # provider (CAREER_AI_MODE=mock selects the deterministic dev extractor).
      CAREER_AI_MODE: ${CAREER_AI_MODE:-}
      CAREER_AI_BASE_URL: ${CAREER_AI_BASE_URL:-}
      CAREER_AI_API_KEY: ${CAREER_AI_API_KEY:-}
      CAREER_AI_MODEL: ${CAREER_AI_MODEL:-}
      CAREER_REQUIRE_AI: ${CAREER_REQUIRE_AI:-0}
      CAREER_ALLOW_INSECURE_AI_HTTP: ${CAREER_ALLOW_INSECURE_AI_HTTP:-0}
      CAREER_SUIFY_ALLOW_INSECURE_AI_HTTP: ${CAREER_SUIFY_ALLOW_INSECURE_AI_HTTP:-0}
      CAREER_EXTRACT_RATE_LIMIT: ${CAREER_EXTRACT_RATE_LIMIT:-5}
      CAREER_SUIFY_RATE_LIMIT: ${CAREER_SUIFY_RATE_LIMIT:-5}
      CAREER_SEARCH_RATE_LIMIT: ${CAREER_SEARCH_RATE_LIMIT:-10}
      CAREER_SEARCH_ACTIVE_LIMIT: ${CAREER_SEARCH_ACTIVE_LIMIT:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      getwork-mcp:
        condition: service_healthy
        required: false
      platform-core:
        condition: service_started
    expose:
      - "8097"
    healthcheck:
      test: ["CMD", "/career-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Library owns the Console materials operation surface over the retired
  # Study admin API and fails closed without the credentials below (ADR-0020).
  library:
    build:
      context: ./services/library
    environment:
      LIBRARY_ADDR: ${LIBRARY_ADDR:-:8095}
      LIBRARY_DATABASE_URL: ${LIBRARY_DATABASE_URL:-postgres://henukit:henukit_dev_change_me@postgres:5432/library?sslmode=disable}
      LIBRARY_REDIS_URL: ${LIBRARY_REDIS_URL:-redis://redis:6379/5}
      LIBRARY_SERVICE_CLIENT_ID: ${LIBRARY_SUMMARY_CLIENT_ID:-console-gateway-library}
      LIBRARY_SERVICE_KEY_ID: ${LIBRARY_SUMMARY_KEY_ID:-library-summary-key}
      LIBRARY_SERVICE_SECRET: ${LIBRARY_SUMMARY_CLIENT_SECRET:-replace-library-summary-client-secret-32bytes-min!!}
      LIBRARY_DOWNLOAD_SERVICE_CLIENT_ID: ${LIBRARY_DOWNLOAD_CLIENT_ID:-portal-gateway-library-download}
      LIBRARY_DOWNLOAD_SERVICE_KEY_ID: ${LIBRARY_DOWNLOAD_KEY_ID:-library-download-key-1}
      LIBRARY_DOWNLOAD_SERVICE_SECRET: ${LIBRARY_DOWNLOAD_CLIENT_SECRET:-replace-library-download-client-secret-32bytes!!}
      LIBRARY_OSS_BUCKET: ${LIBRARY_OSS_BUCKET:-henukit}
      LIBRARY_OSS_REGION: ${LIBRARY_OSS_REGION:-cn-beijing}
      LIBRARY_OSS_INTERNAL_ENDPOINT: ${LIBRARY_OSS_INTERNAL_ENDPOINT:-https://oss-cn-beijing-internal.aliyuncs.com}
      LIBRARY_OSS_PUBLIC_ENDPOINT: ${LIBRARY_OSS_PUBLIC_ENDPOINT:-https://oss-cn-beijing.aliyuncs.com}
      LIBRARY_OSS_ECS_RAM_ROLE: ${LIBRARY_OSS_ECS_RAM_ROLE:-henukit-library-download}
      ALIBABA_CLOUD_IMDSV1_DISABLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8095"
    healthcheck:
      test: ["CMD", "/library-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  portal-gateway:
    build:
      context: ./services/portal-gateway
    environment:
      LISTEN_ADDR: ${PORTAL_GATEWAY_LISTEN_ADDR:-:8084}
      PLATFORM_CORE_URL: ${PLATFORM_CORE_URL:-http://platform-core:8081}
      PLATFORM_CORE_PUBLIC_URL: ${PLATFORM_CORE_PUBLIC_URL:-http://localhost:8088/account-auth}
      PLATFORM_CLIENT_ID: ${PLATFORM_CLIENT_ID:-portal-gateway}
      PLATFORM_CLIENT_SECRET: ${PLATFORM_CLIENT_SECRET:-replace-platform-client-secret-32bytes-min!!}
      PLATFORM_KEY_ID: ${PLATFORM_KEY_ID:-portal-gateway-key}
      PORTAL_REDIRECT_URI: ${PORTAL_REDIRECT_URI:-http://localhost:8088/api/v1/auth/callback}
      # raw 32-byte string (gateway does not base64-decode this value)
      PORTAL_SESSION_KEY: ${PORTAL_SESSION_KEY:-0123456789abcdef0123456789abcdef}
      PORTAL_LOCAL_OAUTH_COOKIE_NAME: ${PORTAL_LOCAL_OAUTH_COOKIE_NAME:-henukit_portal_oauth_local}
      PORTAL_LOCAL_SESSION_COOKIE_NAME: ${PORTAL_LOCAL_SESSION_COOKIE_NAME:-henukit_portal_session_local}
      PORTAL_TRUSTED_PROXY_CIDRS: ${PORTAL_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      REDIS_URL: ${PORTAL_GATEWAY_REDIS_URL:-redis://redis:6379/2}
      PORTAL_API_URL: ${PORTAL_API_URL:-http://portal-api:8085}
      PRACTICE_SERVICE_URL: ${PRACTICE_SERVICE_URL:-http://portal-api:8085}
      PORTAL_ENABLE_QUIZCRAFT_CATALOG: ${PORTAL_ENABLE_QUIZCRAFT_CATALOG:-0}
      NOTICE_SERVICE_URL: ${NOTICE_SERVICE_URL:-http://portal-api:8085}
      PRACTICE_CLIENT_ID: ${PRACTICE_CLIENT_ID:-portal-practice}
      PRACTICE_CLIENT_SECRET: ${PRACTICE_CLIENT_SECRET:-replace-practice-client-secret-32bytes-min!!}
      PRACTICE_KEY_ID: ${PRACTICE_KEY_ID:-practice-key}
      NOTICE_CLIENT_ID: ${NOTICE_CLIENT_ID:-portal-notice}
      NOTICE_CLIENT_SECRET: ${NOTICE_CLIENT_SECRET:-replace-notice-client-secret-32bytes-min!!}
      NOTICE_KEY_ID: ${NOTICE_KEY_ID:-notice-key}
      ACCOUNT_PORTFOLIO_URL: ${ACCOUNT_PORTFOLIO_URL:-http://account-portfolio:8097}
      ACCOUNT_PORTFOLIO_CLIENT_ID: ${ACCOUNT_PORTFOLIO_CLIENT_ID:-portal-gateway}
      ACCOUNT_PORTFOLIO_CLIENT_SECRET: ${ACCOUNT_PORTFOLIO_CLIENT_SECRET:-replace-account-portfolio-client-secret-32bytes-min!!}
      ACCOUNT_PORTFOLIO_KEY_ID: ${ACCOUNT_PORTFOLIO_KEY_ID:-account-portfolio-key}
      LIBRARY_DOWNLOAD_URL: ${LIBRARY_DOWNLOAD_URL:-http://library:8095}
      LIBRARY_DOWNLOAD_CLIENT_ID: ${LIBRARY_DOWNLOAD_CLIENT_ID:-portal-gateway-library-download}
      LIBRARY_DOWNLOAD_CLIENT_SECRET: ${LIBRARY_DOWNLOAD_CLIENT_SECRET:-replace-library-download-client-secret-32bytes!!}
      LIBRARY_DOWNLOAD_KEY_ID: ${LIBRARY_DOWNLOAD_KEY_ID:-library-download-key-1}
      # Keep QuizCraft V2 personal-data reads dark until the #166 cutover.
      PORTAL_ENABLE_QUIZCRAFT_V2_READS: ${PORTAL_ENABLE_QUIZCRAFT_V2_READS:-0}
      # 容器化后（方案 2）应指向 http://quizcraft:10089（compose 服务名）；
      # 历史 env 值 host.docker.internal:10089 仅对尚未迁移的旧 env 兼容。
      QUIZCRAFT_CORE_URL: ${QUIZCRAFT_CORE_URL:-}
      QUIZCRAFT_PORTAL_CATALOG_CLIENT_ID: ${QUIZCRAFT_PORTAL_CATALOG_CLIENT_ID:-}
      QUIZCRAFT_PORTAL_CATALOG_CLIENT_SECRET: ${QUIZCRAFT_PORTAL_CATALOG_CLIENT_SECRET:-}
      QUIZCRAFT_PORTAL_CATALOG_KEY_ID: ${QUIZCRAFT_PORTAL_CATALOG_KEY_ID:-}
      PORTAL_PRACTICE_COMMANDS_ENABLED: ${PORTAL_PRACTICE_COMMANDS_ENABLED:-0}
      PRACTICE_COMMAND_CLIENT_ID: ${PRACTICE_COMMAND_CLIENT_ID:-}
      PRACTICE_COMMAND_CLIENT_SECRET: ${PRACTICE_COMMAND_CLIENT_SECRET:-}
      PRACTICE_COMMAND_KEY_ID: ${PRACTICE_COMMAND_KEY_ID:-}
      # Food Post forwarding (ADR-0032): the third read-only-proxy exception.
      # Empty FOOD_POSTS_URL fails closed with an honest 503, never falling
      # back to the portal-api wildcard.
      FOOD_POSTS_URL: ${FOOD_POSTS_URL:-http://food:8096}
      FOOD_POST_CREATE_CLIENT_ID: ${FOOD_POST_CREATE_CLIENT_ID:-portal-gateway-food-post-create}
      FOOD_POST_CREATE_SECRET: ${FOOD_POST_CREATE_SECRET:-replace-food-post-create-secret-32bytes!!}
      FOOD_POST_CREATE_KEY_ID: ${FOOD_POST_CREATE_KEY_ID:-food-post-create-key}
      FOOD_POST_READ_CLIENT_ID: ${FOOD_POST_READ_CLIENT_ID:-portal-gateway-food-post-read}
      FOOD_POST_READ_SECRET: ${FOOD_POST_READ_SECRET:-replace-food-post-read-secret-32bytes!!}
      FOOD_POST_READ_KEY_ID: ${FOOD_POST_READ_KEY_ID:-food-post-read-key}
      # Career Opportunities forwarding (#393): the 05 求职雷达 boundary. Empty
      # CAREER_URL fails closed with an honest 503 and never falls back to the
      # portal-api wildcard.
      CAREER_URL: ${CAREER_URL:-http://career-opportunities:8097}
      CAREER_CLIENT_ID: ${CAREER_CLIENT_ID:-portal-gateway-career}
      CAREER_CLIENT_SECRET: ${CAREER_CLIENT_SECRET:-replace-career-service-secret-32bytes!!}
      CAREER_KEY_ID: ${CAREER_KEY_ID:-career-key-1}
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:-http://localhost:8088}
    depends_on:
      redis:
        condition: service_healthy
      portal-api:
        condition: service_started
      platform-core:
        condition: service_started
      food:
        condition: service_healthy
      account-portfolio:
        condition: service_healthy
      library:
        condition: service_healthy
      career-opportunities:
        condition: service_healthy
    expose:
      - "8084"

  # QuizCraft Go core（方案 2：容器化纳入主栈，替代宿主机 systemd
  # quizcraft-go.service）。它是 Portal /practice 的读写数据 owner，只被
  # portal-gateway 经 compose 网络调用（PRACTICE_SERVICE_URL /
  # QUIZCRAFT_CORE_URL 指向 http://quizcraft:10089）。
  # 切流过渡拓扑：DATABASE_URL 默认连宿主机 postgres 16 的 quizcraft_v2 库
  # （经 host.docker.internal:host-gateway）；quizcraft_v2 迁入 docker
  # postgres 后移除 extra_hosts 并改用 compose 内数据库地址。
  # 镜像为 distroless（无 shell/wget），不设容器级 healthcheck：就绪探测由
  # portal-gateway 请求时 fail-closed（503）承担；如需容器级探针，后续可仿照
  # services/food 增加 cmd/healthcheck 静态二进制（不在本任务范围）。
  quizcraft:
    build:
      context: ./products/quizcraft/go-service
    environment:
      QUIZCRAFT_HTTP_ADDR: ":10089"
      # 兼容键（FastAPI 时代遗留；Go core 实际读取 QUIZCRAFT_HTTP_ADDR）。
      QUIZCRAFT_APP_HOST: ${QUIZCRAFT_APP_HOST:-0.0.0.0}
      QUIZCRAFT_WRITES_ENABLED: ${QUIZCRAFT_WRITES_ENABLED:-0}
      QUIZCRAFT_PORTAL_COMMANDS_ENABLED: ${QUIZCRAFT_PORTAL_COMMANDS_ENABLED:-0}
      QUIZCRAFT_AUTH_HMAC_SECRET: ${QUIZCRAFT_AUTH_HMAC_SECRET:-replace-quizcraft-hmac-secret-32bytes-min!!}
      QUIZCRAFT_CUTOVER_EVIDENCE_SECRET: ${QUIZCRAFT_CUTOVER_EVIDENCE_SECRET:-replace-quizcraft-cutover-evidence-secret-32bytes-min!!}
      QUIZCRAFT_PORTAL_CATALOG_CLIENT_ID: ${QUIZCRAFT_PORTAL_CATALOG_CLIENT_ID:-}
      QUIZCRAFT_PORTAL_CATALOG_KEY_ID: ${QUIZCRAFT_PORTAL_CATALOG_KEY_ID:-}
      QUIZCRAFT_PORTAL_CATALOG_CLIENT_SECRET: ${QUIZCRAFT_PORTAL_CATALOG_CLIENT_SECRET:-}
      QUIZCRAFT_PORTAL_COMMAND_CLIENT_ID: ${QUIZCRAFT_PORTAL_COMMAND_CLIENT_ID:-}
      QUIZCRAFT_PORTAL_COMMAND_KEY_ID: ${QUIZCRAFT_PORTAL_COMMAND_KEY_ID:-}
      QUIZCRAFT_PORTAL_COMMAND_CLIENT_SECRET: ${QUIZCRAFT_PORTAL_COMMAND_CLIENT_SECRET:-}
      QUIZCRAFT_SUMMARY_CLIENT_ID: ${QUIZCRAFT_SUMMARY_CLIENT_ID:-}
      QUIZCRAFT_SUMMARY_KEY_ID: ${QUIZCRAFT_SUMMARY_KEY_ID:-}
      QUIZCRAFT_SUMMARY_CLIENT_SECRET: ${QUIZCRAFT_SUMMARY_CLIENT_SECRET:-}
      # 宿主机 postgres 16（127.0.0.1:5432）的 quizcraft_v2 库；切流过渡拓扑见上注释。
      DATABASE_URL: ${QUIZCRAFT_V2_DATABASE_URL:-postgres://quizcraft_v2:change-me@host.docker.internal:5432/quizcraft_v2?sslmode=disable}
      # Legacy 比对源（FastAPI 已退役，留空即关闭 legacy 比对路径）。
      QUIZCRAFT_LEGACY_BASE_URL: ${QUIZCRAFT_LEGACY_BASE_URL:-}
      QUIZCRAFT_LEGACY_COMPARE_SECRET: ${QUIZCRAFT_LEGACY_COMPARE_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 连宿主机 postgres，不依赖 docker postgres / redis，故无 depends_on。
    # 不暴露公网端口；仅 compose 网络内可达（portal-gateway 调用）。
    expose:
      - "10089"
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://henukit.cn}
        NEXT_PUBLIC_PORTAL_GATEWAY_URL: ${NEXT_PUBLIC_PORTAL_GATEWAY_URL:-}
        NEXT_PUBLIC_PORTAL_GATEWAY_BASE_URL: ${NEXT_PUBLIC_PORTAL_GATEWAY_BASE_URL:-/api}
        NEXT_PUBLIC_PORTAL_REQUIRE_GATEWAY: ${NEXT_PUBLIC_PORTAL_REQUIRE_GATEWAY:-1}
        NEXT_PUBLIC_PORTAL_ENABLE_QUIZCRAFT_CATALOG: ${NEXT_PUBLIC_PORTAL_ENABLE_QUIZCRAFT_CATALOG:-0}
        # This public Next.js value is baked into the Portal image. #166 must
        # rebuild the fixed-SHA Portal artifact when enabling the V2 read path.
        NEXT_PUBLIC_PORTAL_ENABLE_QUIZCRAFT_V2_READS: ${NEXT_PUBLIC_PORTAL_ENABLE_QUIZCRAFT_V2_READS:-0}
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    depends_on:
      - portal-gateway
    expose:
      - "3001"

  portal-summary:
    build:
      context: ./services/portal-summary
    environment:
      LISTEN_ADDR: ${PORTAL_SUMMARY_LISTEN_ADDR:-:8083}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      PORTAL_SUMMARY_CLIENT_ID: ${PORTAL_SUMMARY_CLIENT_ID:-console-gateway-portal}
      PORTAL_SUMMARY_ACTIVE_SECRET: ${PORTAL_SUMMARY_CLIENT_SECRET:-replace-portal-summary-client-secret-32bytes-min!!}
      PORTAL_SUMMARY_ACTIVE_KEY_ID: ${PORTAL_SUMMARY_KEY_ID:-portal-summary-key}
      PORTAL_VERSION: ${PORTAL_VERSION:-development}
      PORTAL_COMMIT_SHA: ${PORTAL_COMMIT_SHA:-0000000000000000000000000000000000000000}
      PORTAL_DEPLOYED_AT: ${PORTAL_DEPLOYED_AT:-1970-01-01T00:00:00Z}
      PORTAL_READINESS_URL: ${PORTAL_READINESS_URL:-https://henukit.cn/}
      PORTAL_KEY_PROBES_JSON: '${PORTAL_KEY_PROBES_JSON:-[{"name":"首页","url":"https://henukit.cn/"}]}'
      PORTAL_ENTRY_PROBES_JSON: '${PORTAL_ENTRY_PROBES_JSON:-[{"name":"资料库","url":"https://henukit.cn/library"}]}'
      PORTAL_FEEDBACK_SUMMARY_URL: ${PORTAL_FEEDBACK_SUMMARY_URL:-}
      PORTAL_FEEDBACK_CLIENT_ID: ${PORTAL_FEEDBACK_CLIENT_ID:-}
      PORTAL_FEEDBACK_CLIENT_SECRET: ${PORTAL_FEEDBACK_CLIENT_SECRET:-}
      PORTAL_FEEDBACK_KEY_ID: ${PORTAL_FEEDBACK_KEY_ID:-}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8083"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8083/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12

  console-gateway:
    build:
      context: ./services/console-gateway
    environment:
      LISTEN_ADDR: ${CONSOLE_GATEWAY_LISTEN_ADDR:-:8082}
      PLATFORM_CORE_URL: ${PLATFORM_CORE_URL:-http://platform-core:8081}
      # Browser-facing Account Center URL. Do not use the private Docker URL above.
      PLATFORM_ACCOUNT_ORIGIN: ${PLATFORM_ACCOUNT_ORIGIN:-http://localhost:8088/account-auth}
      PLATFORM_CLIENT_ID: ${CONSOLE_PLATFORM_CLIENT_ID:-console-gateway}
      PLATFORM_CLIENT_SECRET: ${CONSOLE_PLATFORM_CLIENT_SECRET:-replace-console-gateway-client-secret}
      PLATFORM_KEY_ID: ${CONSOLE_PLATFORM_KEY_ID:-console-gateway-key}
      CONSOLE_REDIRECT_URI: ${CONSOLE_REDIRECT_URI:-http://localhost:8088/console-api/v1/auth/callback}
      CONSOLE_SESSION_KEY: ${CONSOLE_SESSION_KEY:-cUUpjiEH+E5FD5YBx3ZKWN7qS7tyWHo24/HCXs+OIGI=}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      PORTAL_SUMMARY_URL: ${PORTAL_SUMMARY_URL-http://portal-summary:8083/api/v1/console-summary}
      PORTAL_SUMMARY_CLIENT_ID: ${PORTAL_SUMMARY_CLIENT_ID:-console-gateway-portal}
      PORTAL_SUMMARY_CLIENT_SECRET: ${PORTAL_SUMMARY_CLIENT_SECRET:-replace-portal-summary-client-secret-32bytes-min!!}
      PORTAL_SUMMARY_KEY_ID: ${PORTAL_SUMMARY_KEY_ID:-portal-summary-key}
      PLATFORM_SUMMARY_URL: ${PLATFORM_SUMMARY_URL:-}
      PLATFORM_SUMMARY_CLIENT_ID: ${PLATFORM_SUMMARY_CLIENT_ID:-console-gateway-platform}
      PLATFORM_SUMMARY_CLIENT_SECRET: ${PLATFORM_SUMMARY_CLIENT_SECRET:-replace-platform-summary-client-secret-32bytes-min!!}
      PLATFORM_SUMMARY_KEY_ID: ${PLATFORM_SUMMARY_KEY_ID:-platform-summary-key}
      NOTICE_SUMMARY_URL: ${NOTICE_SUMMARY_URL-http://notice:8094/api/v1/console-summary}
      # Onboarded summary owners use their private Compose endpoints by default.
      # `-` (not `:-`) so an explicit empty value disables the module.
      NOTICE_API_URL: ${NOTICE_API_URL-http://notice:8094}
      LIBRARY_API_URL: ${LIBRARY_API_URL:-}
      FOOD_API_URL: ${FOOD_API_URL-http://food:8096}
      NOTICE_SUMMARY_CLIENT_ID: ${NOTICE_SUMMARY_CLIENT_ID:-console-gateway-notice}
      NOTICE_SUMMARY_CLIENT_SECRET: ${NOTICE_SUMMARY_CLIENT_SECRET:-replace-notice-summary-client-secret-32bytes-min!!}
      NOTICE_SUMMARY_KEY_ID: ${NOTICE_SUMMARY_KEY_ID:-notice-summary-key}
      LIBRARY_SUMMARY_URL: ${LIBRARY_SUMMARY_URL-http://library:8095/api/v1/console-summary}
      LIBRARY_SUMMARY_CLIENT_ID: ${LIBRARY_SUMMARY_CLIENT_ID:-console-gateway-library}
      LIBRARY_SUMMARY_CLIENT_SECRET: ${LIBRARY_SUMMARY_CLIENT_SECRET:-replace-library-summary-client-secret-32bytes-min!!}
      LIBRARY_SUMMARY_KEY_ID: ${LIBRARY_SUMMARY_KEY_ID:-library-summary-key}
      QUIZCRAFT_SUMMARY_URL: ${QUIZCRAFT_SUMMARY_URL:-}
      QUIZCRAFT_SUMMARY_CLIENT_ID: ${QUIZCRAFT_SUMMARY_CLIENT_ID:-console-gateway-quizcraft}
      QUIZCRAFT_SUMMARY_CLIENT_SECRET: ${QUIZCRAFT_SUMMARY_CLIENT_SECRET:-replace-quizcraft-summary-client-secret-32bytes-min!!}
      QUIZCRAFT_SUMMARY_KEY_ID: ${QUIZCRAFT_SUMMARY_KEY_ID:-quizcraft-summary-key}
      FOOD_SUMMARY_URL: ${FOOD_SUMMARY_URL-http://food:8096/api/v1/console-summary}
      FOOD_SUMMARY_CLIENT_ID: ${FOOD_SUMMARY_CLIENT_ID:-console-gateway-food}
      FOOD_SUMMARY_CLIENT_SECRET: ${FOOD_SUMMARY_CLIENT_SECRET:-replace-food-summary-client-secret-32bytes-min!!}
      FOOD_SUMMARY_KEY_ID: ${FOOD_SUMMARY_KEY_ID:-food-summary-key}
      # Console uses a separate, actor-bound Account Portfolio caller identity.
      ACCOUNT_PORTFOLIO_API_URL: ${ACCOUNT_PORTFOLIO_API_URL:-http://account-portfolio:8097}
      ACCOUNT_PORTFOLIO_CONSOLE_CLIENT_ID: ${ACCOUNT_PORTFOLIO_CONSOLE_CLIENT_ID:-console-gateway}
      ACCOUNT_PORTFOLIO_CONSOLE_KEY_ID: ${ACCOUNT_PORTFOLIO_CONSOLE_KEY_ID:-account-portfolio-console-key}
      ACCOUNT_PORTFOLIO_CONSOLE_SECRET: ${ACCOUNT_PORTFOLIO_CONSOLE_SECRET:-replace-account-portfolio-console-secret-32bytes-min!!}
      ACCOUNT_PORTFOLIO_REQUIRE_STRONG_SECRET: ${ACCOUNT_PORTFOLIO_REQUIRE_STRONG_SECRET:-0}
    depends_on:
      redis:
        condition: service_healthy
      platform-core:
        condition: service_started
      account-portfolio:
        condition: service_healthy
      portal-summary:
        condition: service_healthy
      notice:
        condition: service_started
      food:
        condition: service_started
      library:
        condition: service_started
    ports:
      - "8082:8082"
    expose:
      - "8082"

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_CONSOLE_BASE_PATH:-/}
    depends_on:
      - console-gateway
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - portal
      - portal-gateway
      - console
      - console-gateway
    ports:
      # The host TLS terminator is the only trusted source of forwarded
      # protocol metadata. Do not expose this hop directly to the network.
      - "127.0.0.1:${HENUKIT_EDGE_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/henukit.conf.example:/etc/nginx/conf.d/default.conf:ro
      # Mount the public release parent, not one resolved release. Nginx follows
      # its current symlink on each request and observes the activation fence.
      - type: bind
        source: ${HENUKIT_MATERIALS_PUBLIC_ROOT:-/opt/henukit-materials/public}
        target: /srv/materials
        read_only: true
        bind:
          create_host_path: true

volumes:
  henukit_postgres_data:
  henukit_redis_data:
  henukit_smtp_ledger:
