name: final-review-platform-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      API_PORT: 8080
      LOCAL_UPLOAD_DIR: /app/uploads
      AUTO_MIGRATE: "false"
    volumes:
      - uploads:/app/uploads
      - ./secrets:/run/secrets/final-review:ro
      - ./certs/wechat:/run/certs/final-review/wechat:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"

  worker:
    build:
      context: ./services/worker
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      LOCAL_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
      - ./secrets:/run/secrets/final-review:ro
      - ./certs/wechat:/run/certs/final-review/wechat:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?set PUBLIC_API_BASE_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?set PUBLIC_API_BASE_URL}
    depends_on:
      - api
    expose:
      - "3000"

  admin:
    build:
      context: ./apps/admin
      args:
        VITE_API_BASE_URL: ${PUBLIC_ADMIN_ORIGIN:?set PUBLIC_ADMIN_ORIGIN}/api/v1
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${PUBLIC_ADMIN_ORIGIN:?set PUBLIC_ADMIN_ORIGIN}/api/v1
    depends_on:
      - api
    expose:
      - "4173"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/final-review.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./certs/tls:/etc/nginx/certs:ro

volumes:
  postgres_data:
  redis_data:
  uploads:
