      responses:
        '413': { description: Request body exceeds 2 MiB, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/ErrorEnvelope' } } } }
        '200': { description: Unpublish write result, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/OperationEnvelope' } } } }
        '401': { $ref: './quizcraft.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './quizcraft.yaml#/components/responses/Forbidden' }
        '409': { $ref: './quizcraft.yaml#/components/responses/Conflict' }
        '503': { $ref: './quizcraft.yaml#/components/responses/ServiceUnavailable' }
