        required: true
        content:
          application/json:
            schema: { allOf: [{ $ref: './quizcraft.yaml#/components/schemas/BankImportRequest' }, { type: object, required: [expected_version] }] }
            examples:
              valid:
                value:
                  expected_version: 1
                  source_sha256: 1f1e1d1c1b1a19181716151413121110abcdefabcdefabcdefabcdefabcdefab
                  questions:
                    - { source_question_id: q0001, type: single, chapter_id: ch01, content: '1+1=?', options: ['1', '2'], answer: 1 }
            x-invalid-examples:
              - { expected_version: 1, source_sha256: bad, questions: [{ source_question_id: q0001, type: single, chapter_id: ch01, content: '1+1=?', options: [], answer: null }] }
      responses:
