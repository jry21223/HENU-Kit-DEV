      summary: Roll back by republishing a prior immutable version
      tags: [Workshop]
      operationId: consoleManagementGatewayRollbackWorkshopBank
      security: [{ consoleSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - $ref: './quizcraft.yaml#/components/parameters/BankID'
        - $ref: './quizcraft.yaml#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/RollbackCommand' } } } }
      responses:
        '413': { description: Request body exceeds 2 MiB, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/ErrorEnvelope' } } } }
        '200': { description: Rollback write result, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/OperationEnvelope' } } } }
