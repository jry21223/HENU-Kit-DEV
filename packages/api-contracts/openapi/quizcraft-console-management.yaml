        '401': { $ref: './quizcraft.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './quizcraft.yaml#/components/responses/Forbidden' }
        '409': { $ref: './quizcraft.yaml#/components/responses/Conflict' }
        '422': { description: Import rejected without content writes, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/ImportReportEnvelope' } } } }
        '503': { $ref: './quizcraft.yaml#/components/responses/ServiceUnavailable' }
