openapi: 3.0.3
info:
  title: HENU Kit Console question-bank management
  version: 0.1.0
  description: |
    API-only, default-off management bridge. Console checks its own normal OAuth
    Session with Platform Core on every request; no product OAuth, new grants or
    direct activation are introduced. Read and write bodies are limited to 2 MiB;
    complete owner responses are bounded to 8 MiB. Existing Workshop lifecycle,
    optimistic versions, idempotency and review-before-publish remain mandatory.
    Owner signature canonical lines are METHOD, request URI, timestamp, nonce,
    raw-body SHA256 hex, actor UUID, permission, bank UUID (empty for product),
    and Idempotency-Key (empty for GET), joined by LF. Dedicated management keys
    cannot be shared with Portal, summary or browser Session credentials.
servers:
  - url: https://console.henukit.cn
paths:
  /api/v1/quizcraft/workshop/banks:
    get:
      summary: List workshop banks and active versions
      tags: [Workshop]
      operationId: consoleManagementGatewayListWorkshopBanks
      security: [{ consoleSession: [] }]
      responses:
        '413': { description: Request body exceeds 2 MiB, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/ErrorEnvelope' } } } }
        '200': { description: Published Workshop banks, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/BankListEnvelope' } } } }
        '401': { $ref: './quizcraft.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './quizcraft.yaml#/components/responses/Forbidden' }
        '503': { $ref: './quizcraft.yaml#/components/responses/ServiceUnavailable' }
    post:
      summary: Create a stable workshop bank
      tags: [Workshop]
      operationId: consoleManagementGatewayCreateWorkshopBank
      security: [{ consoleSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }, { $ref: './quizcraft.yaml#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/CreateWorkshopBank' } } } }
      responses:
        '413': { description: Request body exceeds 2 MiB, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/ErrorEnvelope' } } } }
        '201': { description: Bank write result, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/OperationEnvelope' } } } }
        '401': { $ref: './quizcraft.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './quizcraft.yaml#/components/responses/Forbidden' }
        '409': { $ref: './quizcraft.yaml#/components/responses/Conflict' }
        '503': { $ref: './quizcraft.yaml#/components/responses/ServiceUnavailable' }
  /api/v1/console/workshop/banks:
    parameters:
      - { $ref: '#/components/parameters/Actor' }
      - { $ref: '#/components/parameters/Permission' }
      - { $ref: '#/components/parameters/BankScope' }
      - { $ref: '#/components/parameters/Timestamp' }
      - { $ref: '#/components/parameters/Nonce' }
      - { $ref: '#/components/parameters/KeyID' }
      - { $ref: '#/components/parameters/ServiceID' }
    get:
      summary: List workshop banks and active versions
      tags: [Workshop]
      operationId: consoleManagementOwnerListWorkshopBanks
      security: [{ managementBasic: [], managementSignature: [] }]
      responses:
        '413': { description: Request body exceeds 2 MiB, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/ErrorEnvelope' } } } }
        '200': { description: Published Workshop banks, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/BankListEnvelope' } } } }
        '401': { $ref: './quizcraft.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './quizcraft.yaml#/components/responses/Forbidden' }
        '503': { $ref: './quizcraft.yaml#/components/responses/ServiceUnavailable' }
    post:
      summary: Create a stable workshop bank
      tags: [Workshop]
      operationId: consoleManagementOwnerCreateWorkshopBank
      security: [{ managementBasic: [], managementSignature: [] }]
      parameters: [{ $ref: './quizcraft.yaml#/components/parameters/IdempotencyKey' }]
