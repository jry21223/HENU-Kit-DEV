        '403': { $ref: './quizcraft.yaml#/components/responses/Forbidden' }
        '409': { $ref: './quizcraft.yaml#/components/responses/Conflict' }
        '503': { $ref: './quizcraft.yaml#/components/responses/ServiceUnavailable' }
  /api/v1/console/workshop/banks/{bank_id}/rollback:
    parameters:
      - { $ref: '#/components/parameters/Actor' }
      - { $ref: '#/components/parameters/Permission' }
      - { $ref: '#/components/parameters/BankScope' }
      - { $ref: '#/components/parameters/Timestamp' }
      - { $ref: '#/components/parameters/Nonce' }
      - { $ref: '#/components/parameters/KeyID' }
      - { $ref: '#/components/parameters/ServiceID' }
    post:
      summary: Roll back by republishing a prior immutable version
      tags: [Workshop]
      operationId: consoleManagementOwnerRollbackWorkshopBank
      security: [{ managementBasic: [], managementSignature: [] }]
      parameters:
        - $ref: './quizcraft.yaml#/components/parameters/BankID'
        - $ref: './quizcraft.yaml#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: './quizcraft.yaml#/components/schemas/RollbackCommand' } } } }
      responses:
