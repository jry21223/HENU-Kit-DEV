        '403': { $ref: './quizcraft.yaml#/components/responses/Forbidden' }
        '409': { $ref: './quizcraft.yaml#/components/responses/Conflict' }
        '503': { $ref: './quizcraft.yaml#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    consoleSession: { type: apiKey, in: cookie, name: __Host-henukit_console_session }
    managementBasic: { type: http, scheme: basic }
    managementSignature: { type: apiKey, in: header, name: X-Signature }
  parameters:
    Actor: { name: X-Actor-User-Id, in: header, required: true, schema: { type: string, format: uuid } }
    Permission: { name: X-Permission-Code, in: header, required: true, schema: { type: string, enum: [quizcraft.workshop.read, quizcraft.workshop.write, quizcraft.workshop.publish] } }
    Origin: { name: Origin, in: header, required: true, description: Exact HTTPS Console request origin required for cookie-authenticated writes, schema: { type: string, format: uri } }
    BankScope: { name: X-Resource-Id, in: header, required: false, description: Requested bank UUID; absent for product-scoped listing or bank creation, schema: { type: string } }
    Timestamp: { name: X-Timestamp, in: header, required: true, schema: { type: string, pattern: '^[0-9]+$' } }
    Nonce: { name: X-Nonce, in: header, required: true, schema: { type: string, minLength: 32, maxLength: 32 } }
    KeyID: { name: X-Key-Id, in: header, required: true, schema: { type: string } }
    ServiceID: { name: X-Service-Id, in: header, required: true, schema: { type: string } }
