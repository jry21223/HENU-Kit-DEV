openapi: 3.1.0
info:
  title: HENU Kit Library API
  version: 0.1.0
  description: Library-owned public material download facts plus a bounded legacy compatibility surface for Console operations.
  license: { name: MIT, identifier: MIT }
servers:
  - url: https://library.internal
security:
  - serviceBasic: []
    serviceSignature: []
    serviceActor: []
tags:
  - name: Library
    description: Library-owned public material operations and explicitly bounded compatibility operations.
paths:
  /healthz:
    get:
      tags: [Library]
      operationId: getLibraryHealth
      summary: Check the Library service process
      security: []
      responses:
        "200":
          description: Process is alive
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/console-summary:
    get:
      tags: [Library]
      operationId: getLibraryConsoleSummary
      summary: Read the bounded Library summary
      responses:
        "200":
          description: Bounded Library summary with explicit degradation state
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/workspace:
    get:
      tags: [Library]
      operationId: getLibraryWorkspace
      summary: Read confirmed Library operational data
      parameters: [{ $ref: "#/components/parameters/ActorUserID" }, { $ref: "#/components/parameters/LibraryReadPermission" }, { $ref: "#/components/parameters/ProductScope" }]
      responses:
        "200":
          description: Only confirmed Library capabilities, with unavailable legacy sources made explicit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/LibraryWorkspace" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/commands:
    post:
      tags: [Library]
      operationId: executeLibraryCommand
      summary: Execute one allowlisted Library operation
      description: Executes one allowlisted Library command. Community, payment, quiz, points, and membership commands are invalid.
      parameters:
        - $ref: "#/components/parameters/ActorUserID"
        - $ref: "#/components/parameters/LibraryWritePermission"
        - $ref: "#/components/parameters/ProductScope"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LibraryCommand" } } }
      responses:
        "200":
          description: Command succeeded or the original idempotent result was replayed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/LibraryOperationResult" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/operations/{operation}:
    get:
      tags: [Library]
      operationId: getLibraryOperation
      summary: Resolve a possibly unknown Library write
      parameters:
        - name: operation
          in: path
          required: true
          schema: { $ref: "#/components/schemas/LibraryCommandKind" }
        - $ref: "#/components/parameters/ActorUserID"
        - $ref: "#/components/parameters/LibraryWritePermission"
        - $ref: "#/components/parameters/ProductScope"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Original result or explicit unknown state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/LibraryOperationResult" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/public-materials:
    get:
      tags: [Library]
      operationId: getPublicMaterialCatalog
      summary: Read the complete active public-free owner catalog
      description: Returns one database snapshot containing the complete active release catalog, stable per-material Download Start counts, and the global Download Start aggregate. No browser filter is accepted or applied.
      security:
        - downloadServiceBasic: []
          downloadServiceSignature: []
      parameters:
        - $ref: "#/components/parameters/DownloadServiceID"
        - $ref: "#/components/parameters/DownloadKeyID"
        - $ref: "#/components/parameters/ServiceTimestamp"
        - $ref: "#/components/parameters/ServiceNonce"
      responses:
        "200":
          description: Complete active catalog and owner-ledger aggregates, or an explicit empty success when no release is active
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/PublicMaterialCatalog" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/public-materials/{material_id}/download-starts:
    post:
      tags: [Library]
      operationId: createPublicMaterialDownloadStart
      summary: Create a bounded public-free material download grant
      description: The caller supplies only the owner material ID. Library verifies the active snapshot and exact private OSS object, persists an immutable download-start fact, and returns a transient GET capability that expires within 60 seconds.
      security:
        - downloadServiceBasic: []
          downloadServiceSignature: []
      parameters:
        - $ref: "#/components/parameters/MaterialID"
        - $ref: "#/components/parameters/DownloadServiceID"
        - $ref: "#/components/parameters/DownloadKeyID"
        - $ref: "#/components/parameters/ServiceTimestamp"
        - $ref: "#/components/parameters/ServiceNonce"
      responses:
        "201":
          description: Download start persisted and bounded GET grant created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/DownloadGrant" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/public-materials/download-starts/aggregate:
    get:
      tags: [Library]
      operationId: getGlobalDownloadStartAggregate
      summary: Read the global persisted download-start count
      security:
        - downloadServiceBasic: []
          downloadServiceSignature: []
      parameters:
        - $ref: "#/components/parameters/DownloadServiceID"
        - $ref: "#/components/parameters/DownloadKeyID"
        - $ref: "#/components/parameters/ServiceTimestamp"
        - $ref: "#/components/parameters/ServiceNonce"
      responses:
        "200":
          description: Global aggregate from the append-only owner ledger
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/DownloadStartAggregate" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/public-materials/{material_id}/download-starts/aggregate:
    get:
      tags: [Library]
      operationId: getMaterialDownloadStartAggregate
      summary: Read one material's persisted download-start count
      security:
        - downloadServiceBasic: []
          downloadServiceSignature: []
      parameters:
        - $ref: "#/components/parameters/MaterialID"
        - $ref: "#/components/parameters/DownloadServiceID"
        - $ref: "#/components/parameters/DownloadKeyID"
        - $ref: "#/components/parameters/ServiceTimestamp"
        - $ref: "#/components/parameters/ServiceNonce"
      responses:
        "200":
          description: Stable material aggregate from the append-only owner ledger
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/MaterialDownloadStartAggregate" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    serviceBasic: { type: http, scheme: basic }
    serviceSignature: { type: apiKey, in: header, name: X-Signature }
    serviceActor: { type: apiKey, in: header, name: X-Actor-User-Id }
    downloadServiceBasic: { type: http, scheme: basic, description: Dedicated least-privilege Portal Gateway to Library credential }
    downloadServiceSignature: { type: apiKey, in: header, name: X-Signature }
  parameters:
    ActorUserID: { name: X-Actor-User-Id, in: header, required: true, schema: { type: string, format: uuid } }
    LibraryReadPermission: { name: X-Permission-Code, in: header, required: true, schema: { type: string, const: library.read } }
    LibraryWritePermission: { name: X-Permission-Code, in: header, required: true, schema: { type: string, enum: [library.manage, library.review] } }
    ProductScope: { name: X-Product-Code, in: header, required: true, schema: { type: string, const: library } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
    MaterialID: { name: material_id, in: path, required: true, schema: { type: string, format: uuid } }
    DownloadServiceID: { name: X-Service-Id, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
    DownloadKeyID: { name: X-Key-Id, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
    ServiceTimestamp: { name: X-Timestamp, in: header, required: true, schema: { type: string, pattern: '^[0-9]{10,}$' } }
    ServiceNonce: { name: X-Nonce, in: header, required: true, schema: { type: string, minLength: 32, maxLength: 32 } }
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data: {}
        request_id: { type: string, pattern: '^req_[A-Za-z0-9_-]+$', maxLength: 120 }
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string } }
        request_id: { type: string, pattern: '^req_[A-Za-z0-9_-]+$', maxLength: 120 }
    DownloadGrant:
      type: object
      additionalProperties: false
      required: [download_start_id, method, location, expires_at]
      properties:
        download_start_id: { type: string, format: uuid }
        method: { type: string, const: GET }
        location: { type: string, format: uri, description: Transient exact-object OSS bearer capability; never persist or log }
        expires_at: { type: string, format: date-time }
    DownloadStartAggregate:
      type: object
      additionalProperties: false
      required: [download_starts, counting_since, as_of]
      properties:
        download_starts: { type: integer, format: int64, minimum: 0 }
        counting_since: { type: string, format: date-time }
        as_of: { type: string, format: date-time }
    MaterialDownloadStartAggregate:
      type: object
      additionalProperties: false
      required: [material_id, download_starts, counting_since, as_of]
      properties:
        material_id: { type: string, format: uuid }
        download_starts: { type: integer, format: int64, minimum: 0 }
        counting_since: { type: string, format: date-time }
        as_of: { type: string, format: date-time }
    PublicMaterialCatalog:
      type: object
      additionalProperties: false
      required: [release_id, materials, material_count, download_starts, counting_since, as_of]
      properties:
        release_id:
          type: [string, "null"]
          pattern: '^[a-f0-9]{40}-[a-f0-9]{16}$'
        materials:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/PublicCatalogMaterial" }
        material_count: { type: integer, minimum: 0, maximum: 500 }
        download_starts: { type: integer, format: int64, minimum: 0 }
        counting_since: { type: [string, "null"], format: date-time }
        as_of: { type: string, format: date-time }
    PublicCatalogMaterial:
      type: object
      additionalProperties: false
      required: [id, type, subject, title, role, file_name, file_size, downloads, download_available]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [note, exam, mock, path, lab, slides] }
        subject: { type: string, minLength: 1, maxLength: 160 }
        title: { type: string, minLength: 1, maxLength: 255 }
        role: { type: string, minLength: 1, maxLength: 160 }
        file_name: { type: string, minLength: 1, maxLength: 255 }
        file_size: { type: integer, format: int64, minimum: 0 }
        downloads: { type: integer, format: int64, minimum: 0 }
        download_available: { type: boolean, const: true }
    LibraryWorkspace:
      type: object
      additionalProperties: false
      required: [status, status_message, degraded, courses, materials, downloads, submissions, corrections, generated_at]
      properties:
        status: { type: string, enum: [ok, partial, unavailable] }
        status_message: { type: string, maxLength: 240 }
        degraded: { type: boolean }
        courses: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/LibraryCourse" } }
        materials: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/LibraryMaterial" } }
        downloads: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/LibraryDownload" } }
        submissions: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/LibraryMaterial" } }
        corrections: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/LibraryCorrection" } }
        generated_at: { type: string, format: date-time }
    LibraryCourse:
      type: object
      additionalProperties: false
      required: [id, name, slug, grade, status, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        slug: { type: string, maxLength: 160 }
        grade: { type: string, maxLength: 32 }
        status: { type: string, enum: [draft, published, archived] }
        updated_at: { type: string, format: date-time }
    LibraryMaterial:
      type: object
      additionalProperties: false
      required: [id, course_id, title, type, file_name, file_size, access_level, status, updated_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        type: { type: string, enum: [knowledge_note, mock_paper, answer, quick_review, past_exam, other] }
        file_name: { type: string, maxLength: 255 }
        file_size: { type: integer, minimum: 0 }
        access_level: { type: string, enum: [public, authenticated, restricted] }
        status: { type: string, enum: [draft, pending, published, rejected, archived] }
        updated_at: { type: string, format: date-time }
    LibraryDownload:
      type: object
      additionalProperties: false
      required: [id, material_id, material_title, access_level, downloaded_at]
      properties:
        id: { type: string, format: uuid }
        material_id: { type: string, format: uuid }
        material_title: { type: string, maxLength: 200 }
        access_level: { type: string, enum: [public, authenticated, restricted] }
        downloaded_at: { type: string, format: date-time }
    LibraryCorrection:
      type: object
      additionalProperties: false
      required: [id, target_type, target_id, reason, description, status, updated_at]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string, enum: [course, material] }
        target_id: { type: string, format: uuid }
        reason: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        status: { type: string, enum: [pending, approved, rejected] }
        updated_at: { type: string, format: date-time }
    LibraryCommandKind:
      type: string
      enum: [course_create, course_update, course_archive, material_create, material_update, material_archive, submission_approve, submission_reject, correction_resolve, correction_reject]
    LibraryCommand:
      oneOf:
        - $ref: "#/components/schemas/CourseCreateCommand"
        - $ref: "#/components/schemas/CourseUpdateCommand"
        - $ref: "#/components/schemas/CourseArchiveCommand"
        - $ref: "#/components/schemas/MaterialCreateCommand"
        - $ref: "#/components/schemas/MaterialUpdateCommand"
        - $ref: "#/components/schemas/MaterialArchiveCommand"
        - $ref: "#/components/schemas/SubmissionReviewCommand"
        - $ref: "#/components/schemas/CorrectionReviewCommand"
      example: { kind: submission_approve, resource_id: 22222222-2222-4222-8222-222222222222, expected_version: "2026-07-19T00:00:00Z", payload: { reviewReason: checked } }
      x-invalid-example: { kind: material_update, resource_id: 22222222-2222-4222-8222-222222222222, expected_version: "2026-07-19T00:00:00Z", payload: { paymentId: hidden-order } }
    CourseCreateCommand:
      type: object
      additionalProperties: false
      required: [kind, payload]
      properties:
        kind: { type: string, const: course_create }
        payload: { $ref: "#/components/schemas/CourseCreatePayload" }
    CourseUpdateCommand:
      type: object
      additionalProperties: false
      required: [kind, resource_id, expected_version, payload]
      properties:
        kind: { type: string, const: course_update }
        resource_id: { type: string, format: uuid }
        expected_version: { type: string, format: date-time }
        payload: { $ref: "#/components/schemas/CourseMutationPayload" }
    CourseArchiveCommand:
      type: object
      additionalProperties: false
      required: [kind, resource_id, expected_version, payload]
      properties:
        kind: { type: string, const: course_archive }
        resource_id: { type: string, format: uuid }
        expected_version: { type: string, format: date-time }
        payload: { $ref: "#/components/schemas/EmptyPayload" }
    MaterialCreateCommand:
      type: object
      additionalProperties: false
      required: [kind, payload]
      properties:
        kind: { type: string, const: material_create }
        payload: { $ref: "#/components/schemas/MaterialCreatePayload" }
    MaterialUpdateCommand:
      type: object
      additionalProperties: false
      required: [kind, resource_id, expected_version, payload]
      properties:
        kind: { type: string, const: material_update }
        resource_id: { type: string, format: uuid }
        expected_version: { type: string, format: date-time }
        payload: { $ref: "#/components/schemas/MaterialUpdatePayload" }
    MaterialArchiveCommand:
      type: object
      additionalProperties: false
      required: [kind, resource_id, expected_version, payload]
      properties:
        kind: { type: string, const: material_archive }
        resource_id: { type: string, format: uuid }
        expected_version: { type: string, format: date-time }
        payload: { $ref: "#/components/schemas/EmptyPayload" }
    SubmissionReviewCommand:
      type: object
      additionalProperties: false
      required: [kind, resource_id, expected_version, payload]
      properties:
        kind: { type: string, enum: [submission_approve, submission_reject] }
        resource_id: { type: string, format: uuid }
        expected_version: { type: string, format: date-time }
        payload: { $ref: "#/components/schemas/ReviewPayload" }
    CorrectionReviewCommand:
      type: object
      additionalProperties: false
      required: [kind, resource_id, expected_version, payload]
      properties:
        kind: { type: string, enum: [correction_resolve, correction_reject] }
        resource_id: { type: string, format: uuid }
        expected_version: { type: string, format: date-time }
        payload: { $ref: "#/components/schemas/ReviewPayload" }
    CourseCreatePayload:
      type: object
      additionalProperties: false
      required: [schoolId, collegeId, majorId, grade, name, slug]
      maxProperties: 9
      properties:
        schoolId: { type: string, format: uuid }
        collegeId: { type: string, format: uuid }
        majorId: { type: string, format: uuid }
        grade: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 160 }
        slug: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 4000 }
        examScope: { type: string, maxLength: 2000 }
        status: { type: string, enum: [draft, published, archived] }
    CourseMutationPayload:
      type: object
      additionalProperties: false
      maxProperties: 9
      properties:
        schoolId: { type: string, format: uuid }
        collegeId: { type: string, format: uuid }
        majorId: { type: string, format: uuid }
        grade: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 160 }
        slug: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 4000 }
        examScope: { type: string, maxLength: 2000 }
        status: { type: string, enum: [draft, published, archived] }
    MaterialCreatePayload:
      type: object
      additionalProperties: false
      required: [courseId, title, storageKey]
      maxProperties: 10
      properties:
        courseId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        type: { type: string, enum: [knowledge_note, mock_paper, answer, quick_review, past_exam, other] }
        description: { type: string, maxLength: 4000 }
        storageKey: { type: string, maxLength: 512 }
        fileName: { type: string, maxLength: 255 }
        fileSize: { type: integer, minimum: 0 }
        previewContent: { type: string, maxLength: 20000 }
        accessLevel: { type: string, enum: [free, login_required] }
        status: { type: string, enum: [draft, pending, published, rejected, archived] }
    MaterialUpdatePayload:
      type: object
      additionalProperties: false
      maxProperties: 7
      properties:
        courseId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        type: { type: string, enum: [knowledge_note, mock_paper, answer, quick_review, past_exam, other] }
        description: { type: string, maxLength: 4000 }
        previewContent: { type: string, maxLength: 20000 }
        accessLevel: { type: string, enum: [free, login_required] }
        status: { type: string, enum: [draft, pending, published, rejected, archived] }
    ReviewPayload:
      type: object
      additionalProperties: false
      properties:
        reviewReason: { type: string, maxLength: 1000 }
    EmptyPayload:
      type: object
      additionalProperties: false
      maxProperties: 0
    LibraryOperationResult:
      type: object
      additionalProperties: false
      required: [operation, state]
      properties:
        operation: { $ref: "#/components/schemas/LibraryCommandKind" }
        resource_id: { type: string, format: uuid }
        state: { type: string, enum: [succeeded, unknown] }
  responses:
    BadRequest: { description: Invalid or out-of-bound Library request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: Invalid service or actor identity, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: Required Library permission or product Scope is missing, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Conflict: { description: "Idempotency, version, or legacy state conflict", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: "Public material is unknown, inactive, withdrawn, or not public-free", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    ServiceUnavailable: { description: "Coordination or legacy result is unavailable or unknown", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
