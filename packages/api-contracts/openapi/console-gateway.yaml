        target_product_code: { type: string }
        target_resource_type: { type: string }
        target_resource_id: { type: string }
        decision: { type: string, enum: [allowed, denied] }
        reason_code: { type: string }
        created_at: { type: string, format: date-time }
    PlatformOperationsDependencies:
      type: object
      additionalProperties: false
      required: [postgres, redis]
      properties:
        postgres: { type: string, enum: [ready, unavailable] }
        redis: { type: string, enum: [ready, unavailable] }
    RevokePlatformSessionRequest:
      type: object
      additionalProperties: false
      required: [expected_active]
      properties:
        expected_active: { type: boolean, const: true }
    UpdatePlatformAccessRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, status, grants]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, suspended, deleted] }
        grants: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/PlatformAccessGrantInput" } }
    PlatformOperationResult:
      type: object
      additionalProperties: false
      required: [operation, status]
      properties:
        operation: { type: string, enum: [session_revoke, access_update] }
        status: { type: string, enum: [succeeded, unknown] }
        resource_id: { type: string, format: uuid }
        resource_version: { type: integer, minimum: 1 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing, invalid, expired, frozen, or revoked Session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Required permission or Scope is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Authorization code or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Platform resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Platform Core or transient coordination is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
