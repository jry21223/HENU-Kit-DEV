openapi: 3.1.0
info:
  title: HENUKit Console Gateway API
  version: 0.1.0
servers:
  - url: https://console.henukit.cn/api/v1
tags:
  - name: Console Authentication
    description: Console-local authorization-code flow and Session boundary.
  - name: Platform Operations
    description: Bounded account, Session, mail, Inbox, audit, and dependency operations.
  - name: Notice
    description: Permission-checked forwarding to the Notice data owner.
  - name: Library
    description: Permission-checked forwarding to the bounded Library Compatibility Adapter.
  - name: Food
    description: Permission-checked forwarding to the Food-owned operations API.
  - name: Account Portfolio
    description: Permission-checked forwarding to Account Portfolio operator operations.
paths:
  /healthz:
    get:
      tags: [Console Authentication]
      operationId: getConsoleGatewayHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Gateway process is alive
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ok]
                        properties:
                          ok:
                            type: boolean
                            const: true
  /auth/login:
    get:
      tags: [Console Authentication]
      operationId: beginConsoleLogin
      summary: Start the Platform Core authorization-code flow
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          schema:
            type: string
            format: uri-reference
            pattern: '^/(?!/)[^\\\r\n]*$'
            default: /
      responses:
        "302":
          description: Redirect to the Platform Core account origin
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              required: true
              description: Short-lived host-only HttpOnly Secure SameSite=Lax browser-binding cookie.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/callback:
    get:
      tags: [Console Authentication]
      operationId: completeConsoleLogin
      summary: Consume one authorization code and establish the Console Session
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 16
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "302":
          description: Console Session established and redirected to the stored same-origin path
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              required: true
              description: Clears the browser-binding cookie and establishes the host-only HttpOnly Secure SameSite=Lax Console Session cookie.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /session:
    get:
      tags: [Console Authentication]
      operationId: getConsoleSession
      summary: Return a server-verified Console Access Context
      description: The Gateway checks permission and Scope with Platform Core on every request and defaults to deny.
      security:
        - consoleSession: []
      responses:
        "200":
          description: Active Console Session and verified access context
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ConsoleSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /overview:
    get:
      tags: [Console Authentication]
      operationId: getConsoleOverview
      summary: Aggregate six bounded product-module summaries
      description: Runs all module reads concurrently, returns partial results, and labels cached fallback data as stale.
      security:
        - consoleSession: []
      responses:
        "200":
          description: Six module results, including honest degradation states
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ConsoleOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /operations:
    get:
      tags: [Platform Operations]
      operationId: getConsolePlatformOperations
      summary: Read the bounded Platform Operations workspace
      description: Platform Core rechecks platform.operations.read with platform Scope. Sensitive mail and Session fields are excluded.
      security:
        - consoleSession: []
      responses:
        "200":
          description: Operational metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PlatformOperationsSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /operations/account-lookups:
    post:
      tags: [Platform Operations]
      operationId: lookupConsoleAccount
      summary: Resolve one exact full email to the owning account identity
      description: "Forwards the full email to Platform Core, which normalizes it exactly like the login path and returns the resolved account id, display name, normalized email, and status. The email stays out of URLs, query strings, and logs. An unknown email returns account: null in the same envelope instead of a distinct error, so the response shape never distinguishes a miss from an empty lookup."
      security: [{ consoleSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConsoleAccountLookupRequest" } } } }
      responses:
        "200": { description: "Resolved account identity, or account null for an unknown email", content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ConsoleAccountLookupResult" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /operations/sessions/{session_id}/revocations:
    post:
      tags: [Platform Operations]
      operationId: revokeConsolePlatformSession
      summary: Revoke one active Platform Session
      security:
        - consoleSession: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokePlatformSessionRequest" }
      responses:
        "200":
          description: Session revoked or original idempotent result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PlatformOperationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /operations/users/{user_id}/access-updates:
    post:
      tags: [Platform Operations]
      operationId: updateConsolePlatformAccess
      summary: Replace one account's status, roles, and Scope grants
      security:
        - consoleSession: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePlatformAccessRequest" }
      responses:
        "200":
          description: Access updated or original idempotent result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PlatformOperationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /operations/results/{operation}:
    get:
      tags: [Platform Operations]
      operationId: getConsolePlatformOperationStatus
      summary: Resolve a possibly unknown write outcome
      security:
        - consoleSession: []
      parameters:
        - name: operation
          in: path
          required: true
          schema: { type: string, enum: [session_revoke, access_update] }
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "200":
          description: Succeeded or unknown result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PlatformOperationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /session/logout:
    post:
      tags: [Console Authentication]
      operationId: logoutConsoleSession
      summary: Clear the local Console Session
      security: []
      responses:
        "204":
          description: Session cookie cleared
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
  /notices:
    get:
      tags: [Notice]
      operationId: getConsoleNotices
      summary: Read the bounded Notice lifecycle snapshot
      security: [{ consoleSession: [] }]
      responses:
        "200":
          description: Notice-owned lifecycle data
          content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/NoticeSnapshot" } } }] } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /notices/sources:
    post:
      tags: [Notice]
      operationId: createConsoleNoticeSource
      summary: Create a Notice source through its owner
      security: [{ consoleSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequiredIdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateNoticeSourceRequest" } } } }
      responses:
        "200": { description: Source created, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /notices/sources/{source_id}/versions:
    post:
      tags: [Notice]
      operationId: createConsoleNoticeVersion
      summary: Create an immutable Notice version through its owner
      security: [{ consoleSession: [] }]
      parameters:
        - { name: source_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateNoticeVersionRequest" } } } }
      responses:
        "200": { description: Version created, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /notices/versions/{version_id}/reviews:
    post:
      tags: [Notice]
      operationId: reviewConsoleNoticeVersion
      summary: Review a Notice version through its owner
      security: [{ consoleSession: [] }]
      parameters:
        - { name: version_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NoticeReviewRequest" } } } }
      responses:
        "200": { description: Review recorded, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /notices/versions/{version_id}/distributions:
    post:
      tags: [Notice]
      operationId: distributeConsoleNoticeVersion
      summary: Queue an approved Notice version for an audience
      security: [{ consoleSession: [] }]
      parameters:
        - { name: version_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NoticeDistributionRequest" } } } }
      responses:
        "200": { description: Distribution queued, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /notices/operations/{operation}:
    get:
      tags: [Notice]
      operationId: getConsoleNoticeOperationStatus
      summary: Resolve a possibly unknown Notice write
      security: [{ consoleSession: [] }]
      parameters:
        - { name: operation, in: path, required: true, schema: { type: string, enum: [source_create, version_create, review, distribution] } }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      responses:
        "200": { description: Original result or unknown, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /library:
    get:
      tags: [Library]
      operationId: getConsoleLibraryWorkspace
      summary: Read the bounded Library workspace
      security: [{ consoleSession: [] }]
      responses:
        "200":
          description: Confirmed Library data with explicit legacy degradation
          content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/LibraryWorkspace" } } }] } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /library/commands:
    post:
      tags: [Library]
      operationId: executeConsoleLibraryCommand
      summary: Execute one allowlisted Library command
      security: [{ consoleSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequiredIdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LibraryCommand" } } } }
      responses:
        "200": { description: Original or newly completed operation, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/LibraryOperationResult" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /library/operations/{operation}:
    get:
      tags: [Library]
      operationId: getConsoleLibraryOperationStatus
      summary: Resolve a possibly unknown Library write
      security: [{ consoleSession: [] }]
      parameters:
        - { name: operation, in: path, required: true, schema: { $ref: "#/components/schemas/LibraryCommandKind" } }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      responses:
        "200": { description: Original result or unknown state, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/LibraryOperationResult" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /food:
    get:
      tags: [Food]
      operationId: getConsoleFoodWorkspace
      summary: Read the bounded Food operations workspace
      security: [{ consoleSession: [] }]
      parameters:
        - { name: campus, in: query, required: false, schema: { $ref: "#/components/schemas/FoodCampus" } }
      responses:
        "200": { description: Food-owned operation data, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/FoodWorkspace" } } }] } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /food/commands:
    post:
      tags: [Food]
      operationId: executeConsoleFoodCommand
      summary: Execute one allowlisted Food operation
      security: [{ consoleSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequiredIdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FoodCommand" } } } }
      responses:
        "200": { description: Original or newly completed operation, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/FoodOperationResult" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /food/operations/{operation}:
    get:
      tags: [Food]
      operationId: getConsoleFoodOperationStatus
      summary: Resolve a possibly unknown Food write
      security: [{ consoleSession: [] }]
      parameters:
        - { name: operation, in: path, required: true, schema: { $ref: "#/components/schemas/FoodCommandKind" } }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      responses:
        "200": { description: Original result or unknown state, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/FoodOperationResult" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /account/memberships/{user_id}:
    get:
      tags: [Account Portfolio]
      operationId: getConsoleAccountMembership
      summary: Read one initialized user's durable membership entitlement
      description: Requires account.membership.write within Account Portfolio product Scope. The target must already have a durable Account Portfolio state; the response omits target and operator identities.
      security: [{ consoleSession: [] }]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Durable membership entitlement and revision, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ConsoleAccountMembershipEnvelope" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /account/memberships/search:
    post:
      tags: [Account Portfolio]
      operationId: searchConsoleAccountMemberships
      summary: Search one bounded page of membership-operable accounts
      description: Combines at most 20 Platform Core identities with Account Portfolio entitlement state. Requires account.membership.write; operator identity comes only from the verified Console Session.
      security: [{ consoleSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConsoleMembershipAccountSearchRequest" } } } }
      responses:
        "200": { description: Bounded account and membership page, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ConsoleMembershipAccountPage" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /account/memberships/{user_id}/grants:
    post:
      tags: [Account Portfolio]
      operationId: grantConsoleAccountMembership
      summary: Grant a lifetime membership entitlement to one initialized user
      description: Requires account.membership.write within Account Portfolio product Scope. The operator is only the verified Console Session actor; browsers cannot select it.
      security: [{ consoleSession: [] }]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConsoleMembershipMutationRequest" } } } }
      responses:
        "200": { description: Updated durable membership or its original idempotent result, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ConsoleAccountMembershipEnvelope" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /account/memberships/{user_id}/revocations:
    post:
      tags: [Account Portfolio]
      operationId: revokeConsoleAccountMembership
      summary: Revoke one lifetime membership entitlement back to free
      description: Requires account.membership.write within Account Portfolio product Scope. The operator is only the verified Console Session actor; browsers cannot select it.
      security: [{ consoleSession: [] }]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConsoleMembershipMutationRequest" } } } }
      responses:
        "200": { description: Updated durable membership or its original idempotent result, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ConsoleAccountMembershipEnvelope" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /account/points/adjustments:
    post:
      tags: [Account Portfolio]
      operationId: adjustConsoleAccountPoints
      summary: Append an authorized credit or debit to one user's point ledger
      description: Requires account.points.adjust within Account Portfolio product Scope. The operator is only the verified Console Session actor; browsers cannot select it and never receive audit identities.
      security: [{ consoleSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConsolePointAdjustmentRequest" } } } }
      responses:
        "200": { description: "Durable balance and immutable ledger entry, or the original idempotent result", content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ConsoleAccountPointAdjustmentResult" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /account/membership-orders/{order_id}/closures:
    post:
      tags: [Account Portfolio]
      operationId: closeConsoleMembershipOrder
      summary: Close one unpaid membership order
      description: Requires account.orders.close within Account Portfolio product Scope. The order is named only by its Account Portfolio id; the private merchant order number is never accepted from or returned to a browser. A paid order is refused rather than closed.
      security: [{ consoleSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/MembershipOrderID" }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConsoleMembershipOrderCommandRequest" } } } }
      responses:
        "200": { description: "Closed order, or the original idempotent result", content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ConsoleMembershipOrderResult" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /account/membership-orders/{order_id}/refunds:
    post:
      tags: [Account Portfolio]
      operationId: refundConsoleMembershipOrder
      summary: Refund one paid membership order in full
      description: Requires account.orders.refund within Account Portfolio product Scope. The refunded amount is always the full verified paid amount and is never selected by a caller. The lifetime entitlement is revoked only when the refunded payment fact still owns it.
      security: [{ consoleSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/MembershipOrderID" }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConsoleMembershipOrderCommandRequest" } } } }
      responses:
        "202": { description: "Durable refund recorded, possibly still settling, or the original idempotent result", content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ConsoleMembershipOrderRefundResult" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /account/membership-orders/{order_id}/refunds/{refund_id}:
    get:
      tags: [Account Portfolio]
      operationId: getConsoleMembershipOrderRefund
      summary: Read one refund and its reconciled status
      description: Requires account.orders.read within Account Portfolio product Scope. Reconciles against the authoritative provider refund query; a dependency failure returns an explicit unavailable response and never a synthesized success.
      security: [{ consoleSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/MembershipOrderID" }
        - { $ref: "#/components/parameters/MembershipRefundID" }
      responses:
        "200": { description: Durable refund and its reconciled status, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ConsoleMembershipOrderRefundResult" } } }] } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /account/tickets:
    get:
      tags: [Account Portfolio]
      operationId: getConsoleAccountTickets
      summary: Read the authorized Account Portfolio support-ticket queue
      description: Requires account.tickets.read within Account Portfolio product Scope.
      security: [{ consoleSession: [] }]
      responses:
        "200": { description: Durable support-ticket queue, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ConsoleAccountTicketQueue" } } }] } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /account/tickets/{ticket_id}:
    get:
      tags: [Account Portfolio]
      operationId: getConsoleAccountTicket
      summary: Read one authorized support ticket and its durable history
      description: Requires account.tickets.read within Account Portfolio product Scope.
      security: [{ consoleSession: [] }]
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Durable support-ticket detail without user or operator identifiers, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ConsoleAccountTicketDetail" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /account/tickets/{ticket_id}/replies:
    post:
      tags: [Account Portfolio]
      operationId: replyConsoleAccountTicket
      summary: Add one operator reply to a support ticket
      description: Requires account.tickets.reply within Account Portfolio product Scope. The operator is only the verified Console Session actor.
      security: [{ consoleSession: [] }]
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConsoleOperatorReplyRequest" } } } }
      responses:
        "200": { description: Updated ticket or its original idempotent result, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ConsoleAccountTicketCommandResult" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /account/tickets/{ticket_id}/transitions:
    post:
      tags: [Account Portfolio]
      operationId: transitionConsoleAccountTicket
      summary: Transition one support ticket through the operator lifecycle
      description: Requires account.tickets.transition within Account Portfolio product Scope. The Console may only move open to in_progress or resolved, and in_progress to resolved.
      security: [{ consoleSession: [] }]
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConsoleTicketTransitionRequest" } } } }
      responses:
        "200": { description: Updated ticket or its original idempotent result, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/SuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ConsoleAccountTicketCommandResult" } } }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  parameters:
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$' }
    MembershipOrderID:
      name: order_id
      in: path
      required: true
      description: Account Portfolio membership order identifier. Never the private merchant order number.
      schema: { type: string, format: uuid }
    MembershipRefundID:
      name: refund_id
      in: path
      required: true
      description: Account Portfolio refund correlation. Never the provider or WeChat refund number.
      schema: { type: string, pattern: '^HNR[A-Z2-7]{29}$' }
  securitySchemes:
    consoleSession:
      type: apiKey
      in: cookie
      name: __Host-henukit_console_session
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data: {}
        request_id:
          type: string
          maxLength: 100
          pattern: '^req_[A-Za-z0-9_-]+$'
    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          $ref: "#/components/schemas/ErrorObject"
        request_id:
          type: string
          maxLength: 100
          pattern: '^req_[A-Za-z0-9_-]+$'
    ConsoleSession:
      type: object
      additionalProperties: false
      example:
        user:
          id: 171f1c6f-7b10-4c92-91a2-b39bf5af5302
        access_context:
          permissions: [console.overview.read]
          scopes: [{ kind: platform }]
          verified_at: "2026-07-19T00:00:00Z"
        expires_at: "2026-07-19T00:05:00Z"
      x-invalid-example:
        user:
          id: not-a-uuid
        expires_at: "not-a-date"
      required: [user, access_context, expires_at]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id:
              type: string
              format: uuid
        access_context:
          $ref: "#/components/schemas/ConsoleAccessContext"
        expires_at:
          type: string
          format: date-time
    ConsoleAccessContext:
      type: object
      additionalProperties: false
      required: [permissions, scopes, verified_at]
      properties:
        permissions:
          type: array
          items:
            type: string
          example: [console.overview.read]
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleScope"
        verified_at:
          type: string
          format: date-time
    ConsoleScope:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [platform, product]
        product_code:
          type: string
          minLength: 1
          maxLength: 80
      allOf:
        - if:
            properties: { kind: { const: product } }
            required: [kind]
          then:
            required: [product_code]
            properties:
              product_code: { type: string, minLength: 1, maxLength: 80 }
    CreateNoticeSourceRequest:
      type: object
      additionalProperties: false
      required: [code, name, canonical_url]
      properties:
        code: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        canonical_url: { type: string, format: uri, pattern: '^https://' }
    CreateNoticeVersionRequest:
      type: object
      additionalProperties: false
      required: [title, body, source_url]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 100000 }
        source_url: { type: string, format: uri, pattern: '^https://' }
        source_published_at: { type: string, format: date-time }
    NoticeReviewRequest:
      type: object
      additionalProperties: false
      required: [decision, expected_revision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        note: { type: string, maxLength: 1000 }
        expected_revision: { type: integer, minimum: 1 }
    NoticeAudience:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [all_students, college, role] }
        value: { type: string, minLength: 1, maxLength: 120 }
      anyOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [all_students] } }
        - type: object
          additionalProperties: false
          required: [kind, value]
          properties:
            kind: { type: string, enum: [college, role] }
            value: { type: string, minLength: 1, maxLength: 120 }
    NoticeDistributionRequest:
      type: object
      additionalProperties: false
      required: [channel, audience, expected_revision]
      properties:
        channel: { type: string, enum: [in_app, email] }
        audience: { $ref: "#/components/schemas/NoticeAudience" }
        expected_revision: { type: integer, minimum: 1 }
      example: { channel: email, audience: { kind: college, value: software-college }, expected_revision: 2 }
      x-invalid-example: { channel: email, audience: { kind: all_students, value: forbidden }, expected_revision: 2 }
    NoticeSource:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    NoticeVersion:
      type: object
      additionalProperties: false
      required: [id, source, version, title, body, source_url, content_hash, state, revision, created_at, distribution_count]
      properties:
        id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/NoticeSource" }
        version: { type: integer, minimum: 1 }
        title: { type: string }
        body: { type: string }
        source_url: { type: string, format: uri }
        content_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        state: { type: string, enum: [pending_review, approved, rejected, distributed] }
        revision: { type: integer, minimum: 1 }
        source_published_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        distribution_count: { type: integer, minimum: 0 }
        distribution_status: { type: string, enum: [queued, processing, delivered, failed] }
    NoticeSnapshot:
      type: object
      additionalProperties: false
      required: [items, generated_at]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/NoticeVersion" } }
        generated_at: { type: string, format: date-time }
    FoodWorkspace:
      type: object
      additionalProperties: false
      required: [status, status_message, stale, as_of, submissions, anomaly_tickets, tier_adjustments, posts]
      properties:
        status: { type: string, enum: [ok, empty, stale] }
        status_message: { type: string, maxLength: 240 }
        stale: { type: boolean }
        as_of: { type: string, format: date-time }
        submissions: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/FoodSubmission" } }
        anomaly_tickets: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/FoodAnomalyTicket" } }
        tier_adjustments: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/FoodTierAdjustment" } }
        posts: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/FoodPost" } }
    FoodSubmission:
      type: object
      additionalProperties: false
      required: [id, venue_name, item_name, description, campus, status, version, submitted_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        venue_name: { type: string, maxLength: 160 }
        item_name: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        campus: { oneOf: [{ $ref: "#/components/schemas/FoodCampus" }, { type: "null" }] }
        status: { type: string, enum: [pending, approved, rejected] }
        version: { type: integer, minimum: 1 }
        submitted_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FoodAnomalyTicket:
      type: object
      additionalProperties: false
      required: [id, venue_name, kind, details, severity, status, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        venue_name: { type: string, maxLength: 160 }
        kind: { type: string, enum: [duplicate, spam, quality, location] }
        details: { type: string, maxLength: 2000 }
        severity: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [open, resolved, dismissed] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FoodTierAdjustment:
      type: object
      additionalProperties: false
      required: [id, venue_name, current_tier, proposed_tier, reason, status, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        venue_name: { type: string, maxLength: 160 }
        current_tier: { type: string, enum: [featured, recommended, standard, watch] }
        proposed_tier: { type: string, enum: [featured, recommended, standard, watch] }
        reason: { type: string, maxLength: 2000 }
        status: { type: string, enum: [pending, confirmed, rejected] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FoodCommandKind:
      type: string
      enum: [submission_approve, submission_reject, submission_edit, post_edit, anomaly_resolve, anomaly_dismiss, tier_adjustment_confirm, tier_adjustment_reject]
    FoodCampus:
      type: string
      enum: [minglun, jinming, longzihu]
    FoodPostTier:
      type: string
      enum: [hang, top, elite, npc, bad]
    FoodCommandPayload:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: string, minLength: 2, maxLength: 1000 }
        venue_name: { type: string, minLength: 1, maxLength: 160 }
        item_name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        campus: { $ref: "#/components/schemas/FoodCampus" }
        tier: { $ref: "#/components/schemas/FoodPostTier" }
        review_text: { type: string, minLength: 2, maxLength: 2000 }
        price_reference: { type: string, maxLength: 200 }
        hours_reference: { type: string, maxLength: 200 }
        hidden: { type: boolean }
    FoodCommand:
      type: object
      additionalProperties: false
      required: [kind, resource_id, expected_version, payload]
      properties:
        kind: { $ref: "#/components/schemas/FoodCommandKind" }
        resource_id: { type: string, format: uuid }
        expected_version: { type: integer, minimum: 1 }
        payload: { $ref: "#/components/schemas/FoodCommandPayload" }
      example: { kind: submission_approve, resource_id: 11111111-1111-4111-8111-111111111111, expected_version: 1, payload: { note: checked } }
      x-invalid-example: { kind: submission_approve, resource_id: 11111111-1111-4111-8111-111111111111, expected_version: 1, payload: { paymentId: hidden } }
    FoodPost:
      type: object
      additionalProperties: false
      required: [id, venue_name, campus, tier, review_text, price_reference, hours_reference, author_display_name, hidden, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        venue_name: { type: string, maxLength: 160 }
        campus: { $ref: "#/components/schemas/FoodCampus" }
        tier: { $ref: "#/components/schemas/FoodPostTier" }
        review_text: { type: string, minLength: 2, maxLength: 2000 }
        price_reference: { type: string, maxLength: 200 }
        hours_reference: { type: string, maxLength: 200 }
        author_display_name: { type: string, minLength: 1, maxLength: 120 }
        hidden: { type: boolean }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FoodOperationResult:
      type: object
      additionalProperties: false
      required: [operation, state]
      properties:
        operation: { $ref: "#/components/schemas/FoodCommandKind" }
        resource_id: { type: string, format: uuid }
        state: { type: string, enum: [succeeded, unknown] }
        version: { type: integer, minimum: 1 }
    LibraryWorkspace:
      type: object
      additionalProperties: false
      required: [status, status_message, degraded, courses, materials, downloads, submissions, corrections, generated_at]
      properties:
        status: { type: string, enum: [ok, partial, unavailable] }
        status_message: { type: string, maxLength: 240 }
        degraded: { type: boolean }
        courses: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/LibraryCourse" } }
        materials: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/LibraryMaterial" } }
        downloads: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/LibraryDownload" } }
        submissions: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/LibraryMaterial" } }
        corrections: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/LibraryCorrection" } }
        generated_at: { type: string, format: date-time }
    LibraryCourse:
      type: object
      additionalProperties: false
      required: [id, name, slug, grade, status, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        slug: { type: string, maxLength: 160 }
        grade: { type: string, maxLength: 32 }
        status: { type: string, enum: [draft, published, archived] }
        updated_at: { type: string, format: date-time }
    LibraryMaterial:
      type: object
      additionalProperties: false
      required: [id, course_id, title, type, file_name, file_size, access_level, status, updated_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        type: { type: string, enum: [knowledge_note, mock_paper, answer, quick_review, past_exam, other] }
        file_name: { type: string, maxLength: 255 }
        file_size: { type: integer, minimum: 0 }
        access_level: { type: string, enum: [public, authenticated, restricted] }
        status: { type: string, enum: [draft, pending, published, rejected, archived] }
        updated_at: { type: string, format: date-time }
    LibraryDownload:
      type: object
      additionalProperties: false
      required: [id, material_id, material_title, access_level, downloaded_at]
      properties:
        id: { type: string, format: uuid }
        material_id: { type: string, format: uuid }
        material_title: { type: string, maxLength: 200 }
        access_level: { type: string, enum: [public, authenticated, restricted] }
        downloaded_at: { type: string, format: date-time }
    LibraryCorrection:
      type: object
      additionalProperties: false
      required: [id, target_type, target_id, reason, description, status, updated_at]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string, enum: [course, material] }
        target_id: { type: string, format: uuid }
        reason: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        status: { type: string, enum: [pending, approved, rejected] }
        updated_at: { type: string, format: date-time }
    LibraryCommandKind:
      type: string
      enum: [course_create, course_update, course_archive, material_create, material_update, material_archive, submission_approve, submission_reject, correction_resolve, correction_reject]
    LibraryCommand:
      oneOf:
