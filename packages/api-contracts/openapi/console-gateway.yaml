          - { id: library, status: ok, metrics: [], status_message: 摘要可用, as_of: "2026-07-19T01:00:00Z", request_id: req_library_valid }
          - { id: quizcraft, status: unavailable, unavailable_reason: not_onboarded, metrics: [], status_message: 尚未接入, request_id: req_quizcraft_valid }
          - { id: food, status: ok, metrics: [], status_message: 摘要可用, as_of: "2026-07-19T01:00:00Z", request_id: req_food_valid }
