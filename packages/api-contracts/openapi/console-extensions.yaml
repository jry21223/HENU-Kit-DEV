openapi: 3.1.0
info:
  title: HENU Kit Console and Campus extensions
  version: 0.1.0
  description: Phase 2 operations reads and writes, Phase 6 Library, Career and Campus operations, and signed-in
    Campus workflows. Paths use the browser gateway unless an operation supplies a service origin. x-upstream
    names the corresponding owner route.
servers:
  - url: https://console.henukit.cn
    description: Console gateway
paths:
  /api/v1/notices/sources:
    get:
      operationId: listNoticeSourcesExtension
      summary: List registered Notice sources
      security:
        - consoleSession: []
      x-permission: notice.read
      x-upstream: GET /api/v1/sources
      x-scope: product:notice
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    required:
                      - sources
                    properties:
                      sources:
                        type: array
                        items:
                          $ref: "#/components/schemas/NoticeSource"
                        maxItems: 200
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/operations/roles:
    get:
      operationId: listPlatformRolesExtension
      summary: List active Platform roles
      security:
        - consoleSession: []
      x-permission: platform.operations.read
      x-upstream: GET /api/v1/platform-operations/roles
      x-scope: platform
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    required:
                      - roles
                    properties:
                      roles:
                        type: array
                        items:
                          $ref: "#/components/schemas/PlatformRole"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/operations/inbox/{item_id}/updates:
    post:
      operationId: updatePlatformInboxExtension
      summary: Update a Platform operations inbox item
      security:
        - consoleSession: []
      x-permission: platform.operations.write
      x-upstream: POST /api/v1/platform-operations/inbox/{item_id}/updates
      x-scope: platform
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxUpdate"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: "#/components/schemas/InboxItem"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      description: Requires the exact Console HTTPS Origin.
  /api/v1/account/points/{user_id}:
    get:
      operationId: getAccountPointsExtension
      summary: Read a user balance and recent ledger entries
      security:
        - consoleSession: []
      x-permission: account.points.adjust
      x-upstream: GET /api/v1/console/points/{user_id}
      x-scope: product:account-portfolio
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: "#/components/schemas/Points"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      description: An empty ledger returns balance zero and an empty entries array.
  /api/v1/account/membership-orders:
    get:
      operationId: listMembershipOrdersExtension
      summary: List membership orders by creation time, newest first
      security:
        - consoleSession: []
      x-permission: account.orders.read
      x-upstream: GET /api/v1/console/membership-orders
      x-scope: product:account-portfolio
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - all
              - created
              - pending_payment
              - paid
              - closed
              - refunded
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    required:
                      - orders
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: "#/components/schemas/MembershipOrder"
                        maxItems: 100
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      description: Only public order and refund identifiers are returned.
  /api/v1/library/readiness:
    get:
      operationId: getLibraryCatalogReadinessExtension
      summary: Read native catalog capabilities
      security:
        - consoleSession: []
      x-permission: library.read
      x-upstream: GET /api/v1/console-readiness
      x-scope: product:library
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: "#/components/schemas/LibraryReadiness"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/library:
    get:
      operationId: getLibraryCatalogWorkspaceExtension
      summary: Read native courses, materials, corrections and immutable releases
      security:
        - consoleSession: []
      x-permission: library.read
      x-upstream: GET /api/v1/workspace
      x-scope: product:library
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: "#/components/schemas/LibraryWorkspace"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/library/commands:
    post:
      operationId: writeLibraryCatalogExtension
      summary: Apply a versioned Library catalog command
      security:
        - consoleSession: []
      x-permission: library.manage or library.review
      x-upstream: POST /api/v1/commands
      x-scope: product:library
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryCommand"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: "#/components/schemas/LibraryCommandResult"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      description: The command kind selects library.manage or library.review. Catalog writes do not activate public
        download releases.
  /api/v1/library/operations/{operation}:
    get:
      operationId: getLibraryCatalogOperationExtension
      summary: Read the original Library command result
      security:
        - consoleSession: []
      x-permission: library.manage or library.review
      x-upstream: GET /api/v1/operations/{operation}
      x-scope: product:library
      parameters:
        - name: operation
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: "#/components/schemas/LibraryCommandResult"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      description: Use the original Idempotency-Key and the command kind. The result is scoped to the authenticated
        operator and client.
  /api/v1/career/workspace:
    get:
      operationId: getCareerWorkspaceExtension
      summary: Read recent scans, resume extraction status and digest delivery
      security:
        - consoleSession: []
      x-permission: career.read
      x-upstream: GET /api/v1/console/workspace
      x-scope: product:career
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: "#/components/schemas/CareerWorkspace"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      description: Includes operational metadata without resume text, file contents or extracted resume fields.
  /api/v1/career/searches/{search_id}/retry-digest:
    post:
      operationId: retryCareerDigestExtension
      summary: Retry a digest for a completed search
      security:
        - consoleSession: []
      x-permission: career.manage
      x-upstream: POST /api/v1/console/searches/{search_id}/retry-digest
      x-scope: product:career
      parameters:
        - name: search_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: "#/components/schemas/DigestRetry"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/campus/workspace:
    get:
      operationId: getCampusWorkspaceExtension
      summary: Read Campus moderation workspace
      security:
        - consoleSession: []
      x-permission: campus.read
      x-upstream: GET /api/v1/campus/console/workspace
      x-scope: product:campus
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: "#/components/schemas/CampusWorkspace"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      description: Includes hidden items and messages. Contact exchange data is limited to aggregate counts.
  /api/v1/campus/items/{id}/moderate:
    post:
      operationId: moderateCampusItemExtension
      summary: Hide, restore, or close a Campus item
      security:
        - consoleSession: []
      x-permission: campus.moderate
      x-upstream: POST /api/v1/campus/console/items/{id}/moderate
      x-scope: product:campus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemModeration"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - status
                      - version
                      - moderation_note
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                      version:
                        type: integer
                        minimum: 1
                      moderation_note:
                        type: string
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      description: Requires a same-origin Console request.
  /api/v1/campus/messages/{id}/moderate:
    post:
      operationId: moderateCampusMessageExtension
      summary: Hide or restore a Campus message
      security:
        - consoleSession: []
      x-permission: campus.moderate
      x-upstream: POST /api/v1/campus/console/messages/{id}/moderate
      x-scope: product:campus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageModeration"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - hidden
                    properties:
                      id:
                        type: string
                      hidden:
                        type: boolean
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      description: Requires a same-origin Console request.
  /api/v1/console-summary:
    get:
      operationId: getLibraryOrCareerSummaryExtension
      summary: Library or Career operations summary
      security:
        - ownerHmac: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: "#/components/schemas/ConsoleSummary"
                  request_id:
                    type: string
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      servers:
        - url: https://library.example.invalid
          description: Library service origin
        - url: https://career.example.invalid
          description: Career service origin
  /api/v1/campus/console-summary:
    get:
      operationId: getCampusSummaryExtension
      summary: Campus operations summary
      security:
        - ownerHmac: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: "#/components/schemas/ConsoleSummary"
                  request_id:
                    type: string
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      servers:
        - url: https://portal-api.example.invalid
          description: Campus service origin
  /api/v1/campus/contact-book:
    get:
      operationId: getCampusContactBookExtension
      summary: Read the signed-in student’s private Contact Book
      security:
        - portalSession: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - contact
                  - request_id
                properties:
                  contact:
                    $ref: "#/components/schemas/ContactBook"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/CampusError"
        "401":
          $ref: "#/components/responses/CampusError"
        "403":
          $ref: "#/components/responses/CampusError"
        "404":
          $ref: "#/components/responses/CampusError"
        "409":
          $ref: "#/components/responses/CampusError"
        "503":
          $ref: "#/components/responses/CampusError"
      servers:
        - url: https://henukit.cn
          description: Portal gateway
    put:
      operationId: updateCampusContactBookExtension
      summary: Replace the signed-in student’s private Contact Book
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - contact
                  - request_id
                properties:
                  contact:
                    $ref: "#/components/schemas/ContactBook"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/CampusError"
        "401":
          $ref: "#/components/responses/CampusError"
        "403":
          $ref: "#/components/responses/CampusError"
        "404":
          $ref: "#/components/responses/CampusError"
        "409":
          $ref: "#/components/responses/CampusError"
        "503":
          $ref: "#/components/responses/CampusError"
      servers:
        - url: https://henukit.cn
          description: Portal gateway
  /api/v1/campus/items:
    post:
      operationId: createCampusItemExtension
      summary: Publish a help request or sale listing
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampusItemCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - item
                  - request_id
                properties:
                  item:
                    $ref: "#/components/schemas/CampusItem"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/CampusError"
        "401":
          $ref: "#/components/responses/CampusError"
        "403":
          $ref: "#/components/responses/CampusError"
        "404":
          $ref: "#/components/responses/CampusError"
        "409":
          $ref: "#/components/responses/CampusError"
        "503":
          $ref: "#/components/responses/CampusError"
      servers:
        - url: https://henukit.cn
          description: Portal gateway
  /api/v1/campus/items/{id}/messages:
    post:
      operationId: createCampusMessageExtension
      summary: Post a message on a visible listing
      security:
        - portalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - request_id
                properties:
                  message:
                    $ref: "#/components/schemas/CampusMessage"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/CampusError"
        "401":
          $ref: "#/components/responses/CampusError"
        "403":
          $ref: "#/components/responses/CampusError"
        "404":
          $ref: "#/components/responses/CampusError"
        "409":
          $ref: "#/components/responses/CampusError"
        "503":
          $ref: "#/components/responses/CampusError"
      servers:
        - url: https://henukit.cn
          description: Portal gateway
  /api/v1/campus/items/{id}/exchanges:
    get:
      operationId: listCampusExchangesExtension
      summary: List only exchanges involving the authenticated student
      security:
        - portalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - viewer_user_id
                  - is_owner
                  - exchanges
                  - request_id
                properties:
                  viewer_user_id:
                    type: string
                    format: uuid
                  is_owner:
                    type: boolean
                  exchanges:
                    type: array
                    items:
                      $ref: "#/components/schemas/CampusExchange"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/CampusError"
        "401":
          $ref: "#/components/responses/CampusError"
        "403":
          $ref: "#/components/responses/CampusError"
        "404":
          $ref: "#/components/responses/CampusError"
        "409":
          $ref: "#/components/responses/CampusError"
        "503":
          $ref: "#/components/responses/CampusError"
      servers:
        - url: https://henukit.cn
          description: Portal gateway
    post:
      operationId: requestCampusExchangeExtension
      summary: Request a contact exchange by selecting configured channels
      security:
        - portalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channels
              properties:
                channels:
                  type: array
                  items:
                    type: string
                    enum:
                      - qq
                      - wechat
                      - phone
                  maxItems: 3
                  minItems: 1
                  uniqueItems: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - exchange
                  - request_id
                properties:
                  exchange:
                    $ref: "#/components/schemas/CampusExchange"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/CampusError"
        "401":
          $ref: "#/components/responses/CampusError"
        "403":
          $ref: "#/components/responses/CampusError"
        "404":
          $ref: "#/components/responses/CampusError"
        "409":
          $ref: "#/components/responses/CampusError"
        "503":
          $ref: "#/components/responses/CampusError"
      servers:
        - url: https://henukit.cn
          description: Portal gateway
  /api/v1/campus/items/{id}/exchanges/{exchange_id}/respond:
    post:
      operationId: respondCampusExchangeExtension
      summary: Accept or decline an exchange as the listing owner
      security:
        - portalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: exchange_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - accept
                    - decline
                channels:
                  type: array
                  items:
                    type: string
                    enum:
                      - qq
                      - wechat
                      - phone
                  maxItems: 3
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - exchange
                  - item_status
                  - request_id
                properties:
                  exchange:
                    $ref: "#/components/schemas/CampusExchange"
                  item_status:
                    type: string
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/CampusError"
        "401":
          $ref: "#/components/responses/CampusError"
        "403":
          $ref: "#/components/responses/CampusError"
        "404":
          $ref: "#/components/responses/CampusError"
        "409":
          $ref: "#/components/responses/CampusError"
        "503":
          $ref: "#/components/responses/CampusError"
      description: Accepting requires at least one configured channel and makes the exchange snapshots visible to
        its two participants.
      servers:
        - url: https://henukit.cn
          description: Portal gateway
  /api/v1/campus/items/{id}/complete:
    post:
      operationId: completeCampusItemExtension
      summary: Complete a listing as its owner
      security:
        - portalSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - item_id
                  - status
                  - request_id
                properties:
                  item_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - done
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/CampusError"
        "401":
          $ref: "#/components/responses/CampusError"
        "403":
          $ref: "#/components/responses/CampusError"
        "404":
          $ref: "#/components/responses/CampusError"
        "409":
          $ref: "#/components/responses/CampusError"
        "503":
          $ref: "#/components/responses/CampusError"
      servers:
        - url: https://henukit.cn
          description: Portal gateway
  /api/v1/campus/categories:
    get:
      operationId: listCampusCategoriesExtension
      summary: List standard Campus categories
      servers:
        - url: https://henukit.cn
          description: Portal gateway
      security: []
      responses:
        "200":
          description: Standard categories available in both live and local mode.
          content:
            application/json:
              schema:
                type: object
                required:
                  - categories
                  - request_id
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      required:
                        - key
                        - name
                        - code
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                        code:
                          type: string
                  request_id:
                    type: string
        "503":
          $ref: "#/components/responses/CampusError"
components:
  securitySchemes:
    consoleSession:
      type: apiKey
      in: cookie
      name: __Host-henukit_console_session
    portalSession:
      type: apiKey
      in: cookie
      name: __Host-henukit_portal_session
    ownerHmac:
      type: apiKey
      in: header
      name: X-Signature
      description: Service credentials and five-line HMAC over method, RequestURI, timestamp, nonce and hex SHA-256
        body digest.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
  responses:
    Error:
      description: Invalid request, expired session, insufficient permission, missing item, conflict, or unavailable
        dependency.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CampusError:
      description: Campus rejected the request or is unavailable.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required:
                  - error
                  - message
                  - request_id
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  request_id:
                    type: string
              - $ref: "#/components/schemas/Error"
  schemas:
    NoticeSource:
      type: object
      required:
        - id
        - code
        - name
        - canonical_url
        - created_at
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        canonical_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
    PlatformRole:
      type: object
      required:
        - code
        - display_name
        - permissions
      properties:
        code:
          type: string
        display_name:
          type: string
        permissions:
          type: array
          items:
            type: string
    InboxUpdate:
      type: object
      required:
        - expected_version
        - status
      properties:
        expected_version:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - open
            - in_progress
            - blocked
            - resolved
            - archived
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
        source_product_code:
          type: string
        source_resource_type:
          type: string
        source_resource_id:
          type: string
    InboxItem:
      type: object
      required:
        - id
        - status
        - priority
        - version
        - source_product_code
        - source_resource_type
        - source_resource_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - open
            - in_progress
            - blocked
            - resolved
            - archived
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
        version:
          type: integer
          minimum: 1
        source_product_code:
          type: string
        source_resource_type:
          type: string
        source_resource_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        owner_user_id:
          type: string
          format: uuid
        sla_due_at:
          type: string
          format: date-time
        source_resource_url:
          type: string
          format: uri
      description: The updated Operations Inbox item.
    Points:
      type: object
      required:
        - balance
        - entries
      properties:
        balance:
          type: integer
          format: int64
        entries:
          type: array
          items:
            type: object
            required:
