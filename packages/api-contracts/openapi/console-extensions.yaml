    ContactSnapshot:
      type: object
      required: []
      properties:
        qq:
          type: string
        wechat:
          type: string
        phone:
          type: string
        note:
          type: string
    CampusWorkspace:
      type: object
      required:
        - generated_at
        - counts
        - items
        - messages
      properties:
        generated_at:
          type: string
          format: date-time
        counts:
          type: object
          required:
            - open
            - ongoing
            - done
            - hidden
            - messages_total
            - messages_hidden
            - exchanges_total
            - exchanges_accepted
          properties:
            open:
              type: integer
            ongoing:
              type: integer
            done:
              type: integer
            hidden:
              type: integer
            messages_total:
              type: integer
            messages_hidden:
              type: integer
            exchanges_total:
              type: integer
            exchanges_accepted:
              type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/CampusConsoleItem"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CampusConsoleMessage"
    CampusConsoleItem:
      type: object
      required:
        - id
        - title
        - status
        - version
        - moderation_note
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - help
            - sell
        category:
          type: string
        title:
          type: string
        desc:
          type: string
        price:
          type: number
        seller:
          type: string
        author_user_id:
          type: string
          format: uuid
        accepted_by_user_id:
          type: string
          format: uuid
        accepted_by_name:
          type: string
        place:
          type: string
        deadline:
          type: string
        status:
          type: string
          enum:
            - open
            - ongoing
            - done
            - hidden
        moderation_note:
          type: string
        version:
          type: integer
          minimum: 1
        time:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CampusConsoleMessage:
      type: object
      required:
        - id
        - item_id
        - author
        - text
        - hidden
        - time
        - created_at
      properties:
        id:
          type: string
        item_id:
          type: string
        item_title:
          type: string
        author:
          type: string
        author_user_id:
          type: string
          format: uuid
        text:
          type: string
        hidden:
          type: boolean
        time:
          type: string
        created_at:
          type: string
          format: date-time
    ItemModeration:
      type: object
      required:
        - expected_version
        - action
      properties:
        expected_version:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
            - hide
            - restore
            - close
        note:
          type: string
    MessageModeration:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - hide
            - restore
        note:
          type: string
    Error:
      type: object
      required:
        - error
        - request_id
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
        request_id:
          type: string
    LibraryCommand:
      oneOf:
        - type: object
          required:
            - kind
            - payload
          properties:
            kind:
              const: course_create
            resource_id:
              type: string
              format: uuid
            expected_version:
              type: string
              pattern: ^[1-9][0-9]*$
            payload:
              type: object
              required:
                - code
                - name
              properties:
                code:
                  type: string
                name:
                  type: string
                department:
                  type: string
          description: Requires library.manage.
        - type: object
          required:
            - kind
            - expected_version
            - payload
          properties:
            kind:
              const: course_update
            resource_id:
              type: string
              format: uuid
            expected_version:
              type: string
              pattern: ^[1-9][0-9]*$
            payload:
              type: object
              required: []
              properties:
                name:
                  type: string
                department:
                  type: string
                status:
                  type: string
                  enum:
                    - active
                    - archived
                course_id:
                  type: string
                  format: uuid
          description: Requires library.manage.
          anyOf:
            - required:
                - resource_id
            - properties:
                payload:
                  required:
                    - course_id
        - type: object
          required:
            - kind
            - payload
          properties:
            kind:
              const: material_create
            resource_id:
              type: string
              format: uuid
            expected_version:
              type: string
              pattern: ^[1-9][0-9]*$
            payload:
              type: object
              required:
                - course_id
                - title
                - material_type
              properties:
                course_id:
                  type: string
                  format: uuid
                title:
                  type: string
                material_type:
                  type: string
                  enum:
                    - handout
                    - exam
                    - slides
                    - exercise
                    - answer
                    - note
                    - textbook
                description:
                  type: string
                access_level:
                  type: string
                  enum:
                    - public_free
                    - authenticated
                    - restricted
                source_note:
                  type: string
          description: Requires library.manage.
        - type: object
          required:
            - kind
            - expected_version
            - payload
          properties:
            kind:
              const: material_update
            resource_id:
              type: string
              format: uuid
            expected_version:
              type: string
              pattern: ^[1-9][0-9]*$
            payload:
              type: object
              required: []
              properties:
                title:
                  type: string
                material_type:
                  type: string
                  enum:
                    - handout
                    - exam
                    - slides
                    - exercise
                    - answer
                    - note
                    - textbook
                description:
                  type: string
                access_level:
                  type: string
                  enum:
                    - public_free
                    - authenticated
                    - restricted
                source_note:
                  type: string
                status:
                  type: string
                  enum:
                    - draft
                    - pending_review
                    - published
                    - archived
                material_id:
                  type: string
                  format: uuid
          description: Requires library.manage.
          anyOf:
            - required:
                - resource_id
            - properties:
                payload:
                  required:
                    - material_id
        - type: object
          required:
            - kind
            - expected_version
            - payload
          properties:
            kind:
              const: submission_approve
            resource_id:
              type: string
              format: uuid
            expected_version:
              type: string
              pattern: ^[1-9][0-9]*$
            payload:
              type: object
              required: []
              properties:
                note:
                  type: string
                material_id:
                  type: string
                  format: uuid
          description: Requires library.review.
          anyOf:
            - required:
                - resource_id
            - properties:
                payload:
                  required:
                    - material_id
        - type: object
          required:
            - kind
            - expected_version
            - payload
          properties:
            kind:
              const: submission_reject
            resource_id:
              type: string
              format: uuid
            expected_version:
              type: string
              pattern: ^[1-9][0-9]*$
            payload:
              type: object
              required: []
              properties:
                note:
                  type: string
                material_id:
                  type: string
                  format: uuid
          description: Requires library.review.
          anyOf:
            - required:
                - resource_id
            - properties:
                payload:
                  required:
                    - material_id
        - type: object
          required:
            - kind
            - expected_version
            - payload
          properties:
            kind:
              const: correction_resolve
            resource_id:
              type: string
              format: uuid
            expected_version:
              type: string
              pattern: ^[1-9][0-9]*$
            payload:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - in_progress
                    - resolved
                    - dismissed
                resolution_note:
                  type: string
                correction_id:
                  type: string
                  format: uuid
          description: Requires library.review.
          anyOf:
            - required:
                - resource_id
            - properties:
                payload:
                  required:
                    - correction_id
