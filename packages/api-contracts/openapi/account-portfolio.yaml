openapi: 3.1.0
info:
  title: Account Portfolio
  version: 1.0.0
  description: >-
    Internal owner contract for persistent user points, memberships, membership
    orders, notifications, and support tickets. Browser traffic reaches this
    service only through Portal Gateway's authenticated forwarding boundary.
  license: { name: MIT, identifier: MIT }
servers: [{ url: "https://account-portfolio.internal" }]
security:
  - serviceBasic: []
    serviceSignature: []
    serviceActor: []
paths:
  /healthz:
    get:
      operationId: getAccountPortfolioHealth
      summary: Verify the service and its durable database dependency
      security: []
      responses:
        '200':
          description: Service and database are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '400':
          description: Invalid health request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/account/summary:
    get:
      operationId: getAccountSummary
      summary: Return the signed-in user's persisted Account Portfolio summary
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
      responses:
        '200':
          description: Account summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ReplayDetected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/account/points:
    get:
      operationId: getAccountPoints
      summary: Return the signed-in user's balance and immutable point ledger
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
        - name: cursor
          in: query
          required: false
          description: Versioned opaque encrypted continuation cursor returned by the previous page; it is owner-bound and expires shortly.
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: limit
          in: query
          required: false
          description: Number of immutable ledger entries to return.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Points account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsEnvelope'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ReplayDetected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/account/membership:
    get:
      operationId: getAccountMembership
      summary: Return the signed-in user's persistent membership entitlement
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
      responses:
        '200':
          description: Membership entitlement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ReplayDetected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/account/notifications:
    get:
      operationId: getAccountNotifications
      summary: Return persistent notifications belonging to the signed-in user
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
      responses:
        '200':
          description: Notifications, possibly empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ReplayDetected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/account/notifications/{notification_id}/read:
    post:
      operationId: markAccountNotificationRead
      summary: Mark one signed-in user's notification as read
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
        - $ref: '#/components/parameters/NotificationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Notification read state, including an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEnvelope'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/account/tickets:
    get:
      operationId: getAccountTickets
      summary: Return support tickets belonging to the signed-in user
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
      responses:
        '200':
          description: Support tickets, possibly empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketsEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ReplayDetected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    post:
      operationId: createAccountTicket
      summary: Create one durable support ticket for the signed-in user
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTicketRequest' }
      responses:
        '201':
          description: Created ticket, including an idempotent retry of this command
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/account/tickets/{ticket_id}:
    get:
      operationId: getAccountTicket
      summary: Return one signed-in user's support ticket and durable message history
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
        - $ref: '#/components/parameters/TicketID'
      responses:
        '200':
          description: Owner-scoped support ticket detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetailEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReplayDetected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/account/tickets/{ticket_id}/follow-ups:
    post:
      operationId: createAccountTicketFollowUp
      summary: Add a signed-in user's durable follow-up to one owned support ticket
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
        - $ref: '#/components/parameters/TicketID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketFollowUpRequest' }
      responses:
        '200':
          description: Updated ticket after a durable follow-up or its idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/account/membership-orders:
    get:
      operationId: getAccountMembershipOrders
      summary: Return the signed-in user's membership orders, possibly empty
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
      responses:
        '200':
          description: Membership orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipOrdersEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ReplayDetected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    post:
      operationId: createAccountMembershipOrder
      summary: Create one signed-in user's ¥9.9 lifetime membership order when a Provider is enabled
      description: >-
        This owner seam is not exposed through Portal Gateway while payment
        Providers are disabled. A disabled Provider returns an explicit
        unavailable response and creates no order or entitlement.
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMembershipOrderRequest' }
      responses:
        '201':
          description: Durable order created, pending payment, or terminally failed without an entitlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipOrderEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '503': { $ref: '#/components/responses/PaymentProviderUnavailable' }
  /api/v1/payment-providers/{provider}/notifications:
    post:
      operationId: recordAccountPaymentProviderNotification
      summary: Verify and record a provider notification without accepting browser authority
      description: >-
        This endpoint is not a browser API. Account Portfolio accepts only a
        Provider-verified notification and stores a digest rather than the
        signature or raw payment payload.
      security: []
      parameters:
        - $ref: '#/components/parameters/PaymentProviderName'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Verified notification acknowledged, including replay or ordered no-op acknowledgement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderNotificationEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/PaymentProviderUnavailable' }
  /api/v1/console/memberships/{user_id}:
    get:
      operationId: getConsoleAccountMembership
      summary: Return one initialized Account Portfolio user's membership for an authorized Console operator
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
        - $ref: '#/components/parameters/AccountUserID'
      responses:
        '200':
          description: Durable target membership and revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleMembershipEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReplayDetected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/console/memberships/{user_id}/grants:
    post:
      operationId: grantConsoleAccountMembership
      summary: Grant a durable lifetime membership to one initialized user
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
        - $ref: '#/components/parameters/AccountUserID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipMutationRequest' }
      responses:
        '200':
          description: Updated durable membership or the original idempotent grant result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleMembershipCommandEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/console/memberships/{user_id}/revocations:
    post:
      operationId: revokeConsoleAccountMembership
      summary: Revoke one durable lifetime membership back to the free plan
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
        - $ref: '#/components/parameters/AccountUserID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipMutationRequest' }
      responses:
        '200':
          description: Updated durable membership or the original idempotent revocation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleMembershipCommandEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/console/points/adjustments:
    post:
      operationId: adjustConsoleAccountPoints
      summary: Append one authorized operator point credit or debit for a target user
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsolePointAdjustmentRequest' }
      responses:
        '200':
          description: Durable balance and appended ledger entry, or the original idempotent result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsolePointAdjustmentEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/console/tickets:
    get:
      operationId: getConsoleAccountTickets
      summary: Return the authorized Console support-ticket queue
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
      responses:
        '200':
          description: Durable support-ticket queue, possibly empty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketsEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ReplayDetected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/console/tickets/{ticket_id}:
    get:
      operationId: getConsoleAccountTicket
      summary: Return one authorized Console support-ticket detail
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
        - $ref: '#/components/parameters/TicketID'
      responses:
        '200':
          description: Durable support-ticket detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetailEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReplayDetected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/console/tickets/{ticket_id}/replies:
    post:
      operationId: replyConsoleAccountTicket
      summary: Add an authorized operator reply to one support ticket
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
        - $ref: '#/components/parameters/TicketID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorReplyRequest' }
      responses:
        '200':
          description: Updated support ticket after the operator reply or its idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/console/tickets/{ticket_id}/transitions:
    post:
      operationId: transitionConsoleAccountTicket
      summary: Move one support ticket through its authorized lifecycle
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/KeyID'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ActorUserID'
        - $ref: '#/components/parameters/TicketID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketTransitionRequest' }
      responses:
        '200':
          description: Updated support ticket after the lifecycle transition or its idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CommandConflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
components:
  securitySchemes:
    serviceBasic:
      type: http
      scheme: basic
    serviceSignature:
      type: apiKey
      in: header
      name: X-Signature
    serviceActor:
      type: apiKey
      in: header
      name: X-Actor-User-Id
      description: >-
        Portal Gateway authenticates with Basic credentials plus a signed,
        timestamped nonce and a trusted actor header. For Account Portfolio,
        the actor is the sixth and final line of the HMAC canonical request;
        it is not a browser authentication scheme.
  parameters:
    ServiceID:
      name: X-Service-Id
      in: header
      required: true
      description: Must equal the service Basic username.
      schema: { type: string, minLength: 1, maxLength: 120 }
    KeyID:
      name: X-Key-Id
      in: header
      required: true
      description: Selects a configured Account Portfolio service key.
      schema: { type: string, minLength: 1, maxLength: 120 }
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Unix seconds within the five-minute replay window.
      schema: { type: integer, format: int64 }
    Nonce:
      name: X-Nonce
      in: header
      required: true
      description: Base64url encoding of 24 random bytes.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{32}$' }
    ActorUserID:
      name: X-Actor-User-Id
      in: header
      required: true
      description: Authenticated Portal Session user ID or authorized Console operator ID, selected only by its Gateway.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-scoped command key. Retrying the same command returns the original result.
      schema: { type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$' }
    TicketID:
      name: ticket_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationID:
      name: notification_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountUserID:
      name: user_id
      in: path
      required: true
      description: A user whose Account Portfolio state has already been initialized by a verified owner read.
      schema: { type: string, format: uuid }
    PaymentProviderName:
      name: provider
      in: path
      required: true
      description: Configured provider identifier. No production provider is enabled by default.
      schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,79}$' }
  responses:
    InvalidRequest:
      description: Invalid command, identifier, or lifecycle input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Invalid service authentication or actor context
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: The authenticated service caller cannot use this route
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ReplayDetected:
      description: Replayed signed service nonce
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: The caller cannot access the requested resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    CommandConflict:
      description: A command idempotency key was reused with a different payload or the expected resource revision is stale
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    DependencyUnavailable:
      description: The owner service or durable dependency is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PaymentProviderUnavailable:
      description: No payment Provider is enabled; no order or entitlement was created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    DataEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data: { type: object }
        request_id: { type: string }
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        request_id: { type: string }
    AccountSummaryEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/AccountSummary' }
        request_id: { type: string }
    AccountSummary:
      type: object
      required: [points_balance, plan, lifetime, unread_notification_count, open_ticket_count]
      properties:
        points_balance: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        plan: { type: string, enum: [free, lifetime] }
        lifetime: { type: boolean }
        unread_notification_count: { type: integer, minimum: 0 }
        open_ticket_count: { type: integer, minimum: 0 }
    PointsEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [balance, entries, next_cursor]
          properties:
            balance: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
            entries:
              type: array
              items: { $ref: '#/components/schemas/PointLedgerEntry' }
            next_cursor:
              type: [string, 'null']
              maxLength: 512
        request_id: { type: string }
    PointLedgerEntry:
      type: object
      additionalProperties: false
      required: [id, amount, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        amount:
          oneOf:
            - { type: integer, format: int64, minimum: -9007199254740991, maximum: -1 }
            - { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    MembershipEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [plan, lifetime]
          properties:
            plan: { type: string, enum: [free, lifetime] }
            lifetime: { type: boolean }
        request_id: { type: string }
    ConsoleMembership:
      type: object
      additionalProperties: false
      required: [plan, lifetime, version]
      properties:
        plan: { type: string, enum: [free, lifetime] }
        lifetime: { type: boolean }
        version: { type: integer, minimum: 1 }
    ConsoleMembershipEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [membership]
          properties:
            membership: { $ref: '#/components/schemas/ConsoleMembership' }
        request_id: { type: string }
    ConsoleMembershipCommandEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [membership]
          properties:
            membership: { $ref: '#/components/schemas/ConsoleMembership' }
        request_id: { type: string }
    ConsolePointAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [user_id, amount, reason]
      properties:
        user_id: { type: string, format: uuid }
        amount:
          oneOf:
            - { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
            - { type: integer, format: int64, minimum: -9007199254740991, maximum: -1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ConsolePointAdjustmentEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [balance, entry]
          properties:
            balance: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
            entry: { $ref: '#/components/schemas/PointLedgerEntry' }
        request_id: { type: string }
    MembershipMutationRequest:
      type: object
      additionalProperties: false
      required: [reason, expected_version]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
        expected_version: { type: integer, minimum: 1 }
    NotificationsEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [notifications]
          properties:
            notifications:
              type: array
              items: { $ref: '#/components/schemas/Notification' }
        request_id: { type: string }
    Notification:
      type: object
      required: [id, title, body, kind, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        kind: { type: string }
        ticket_id: { type: string, format: uuid }
        ticket_reference: { type: string, pattern: '^HKT-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' }
        read_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    NotificationEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [notification]
          properties:
            notification: { $ref: '#/components/schemas/Notification' }
        request_id: { type: string }
    TicketsEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [tickets]
          properties:
            tickets:
              type: array
              items: { $ref: '#/components/schemas/Ticket' }
        request_id: { type: string }
    Ticket:
      type: object
      required: [id, reference, title, category, status, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, pattern: '^HKT-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' }
        title: { type: string }
        category: { type: string }
        status: { type: string, enum: [open, in_progress, resolved] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [ticket]
          properties:
            ticket: { $ref: '#/components/schemas/Ticket' }
        request_id: { type: string }
    TicketDetailEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [ticket, messages, events]
          properties:
            ticket: { $ref: '#/components/schemas/Ticket' }
            messages:
              type: array
              items: { $ref: '#/components/schemas/TicketMessage' }
            events:
              type: array
              items: { $ref: '#/components/schemas/TicketEvent' }
        request_id: { type: string }
    CreateTicketRequest:
      type: object
      required: [title, category, body]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        category: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z][a-z0-9_-]*$' }
        body: { type: string, minLength: 1, maxLength: 5000 }
    TicketFollowUpRequest:
      type: object
      required: [body, expected_version]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
        expected_version: { type: integer, minimum: 1 }
    OperatorReplyRequest:
      type: object
      required: [body, expected_version]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
        expected_version: { type: integer, minimum: 1 }
    TicketTransitionRequest:
      type: object
      required: [status, expected_version]
      additionalProperties: false
      properties:
        status: { type: string, enum: [in_progress, resolved] }
        expected_version: { type: integer, minimum: 1 }
    TicketMessage:
      type: object
      required: [id, author_kind, body, created_at]
      properties:
        id: { type: string, format: uuid }
        author_kind: { type: string, enum: [user, operator] }
        body: { type: string }
        created_at: { type: string, format: date-time }
    TicketEvent:
      type: object
      required: [id, kind, from_status, to_status, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [operator_reply, status_transition, reopened] }
        from_status: { type: string, enum: [open, in_progress, resolved] }
        to_status: { type: string, enum: [open, in_progress, resolved] }
        created_at: { type: string, format: date-time }
    MembershipOrdersEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [orders]
          properties:
            orders:
              type: array
              items: { $ref: '#/components/schemas/MembershipOrder' }
        request_id: { type: string }
    MembershipOrder:
      type: object
      required: [id, plan, amount_cents, status, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        plan: { type: string, enum: [lifetime] }
        amount_cents: { type: integer, enum: [990] }
        status: { type: string, enum: [created, pending_payment, paid, closed, failed, refunded] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MembershipOrderEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [order]
          properties:
            order: { $ref: '#/components/schemas/MembershipOrder' }
        request_id: { type: string }
    CreateMembershipOrderRequest:
      type: object
      additionalProperties: false
    ProviderNotificationEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [accepted, outcome, order]
          properties:
            accepted: { type: boolean, enum: [true] }
            outcome: { type: string, enum: [applied, replayed, ignored] }
            order: { $ref: '#/components/schemas/MembershipOrder' }
        request_id: { type: string }
