openapi: 3.1.0
info:
  title: Portal Gateway
  version: 0.2.0
  description: >
    Default-read BFF for HENU Kit Portal (henukit.cn). It authenticates users
    via Platform Core OAuth and proxies GET requests to product services with
    verified permissions. ADR-0018 adds exactly two default-off QuizCraft
    Practice commands; it does not permit a generic product write proxy.
servers:
  - url: http://127.0.0.1:8084
    description: Local development
  - url: https://henukit.cn
    description: Production

paths:
  /api/v1/healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/login:
    get:
      operationId: login
      summary: Start OAuth code flow with Platform Core
      security: []
      parameters:
        - name: return_to
          in: query
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to Platform Core authorize endpoint

  /api/v1/auth/callback:
    get:
      operationId: callback
      summary: OAuth callback — exchange code for Portal Session
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to return_to with session cookie set
        "400":
          description: Invalid or expired state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/session:
    get:
      operationId: getSession
      summary: Return current Portal Session
      security:
        - portalSession: []
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/session/logout:
    post:
      operationId: logout
      summary: Clear Portal Session cookie
      security: []
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: signed_out

  /api/v1/notices:
    get:
      operationId: getPortalNotices
      summary: Return the signed-in student's all-students in-app Notice feed
      description: >
        Portal Gateway validates the Portal Session and the exact
        `portal.notice.read` product `portal` permission before it calls the
        dedicated Notice Owner route. Targeted, email-only, and lifecycle
        management data are not part of this response.
      security:
        - portalSession: []
      responses:
        "200":
          description: Notice-owned public feed; `created_at` is Notice intake time, not delivery completion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/summary:
    get:
      operationId: getAccountSummary
      summary: Return the signed-in user's persisted Account Portfolio summary
      security:
        - portalSession: []
      responses:
        "200":
          description: Persisted zero state or current account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/points:
    get:
      operationId: getAccountPoints
      summary: Return the signed-in user's persistent points balance and ledger
      security:
        - portalSession: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Versioned opaque encrypted continuation cursor returned by the preceding point-ledger page; Portal forwards it without inspection.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: Number of immutable point-ledger entries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Points account, possibly with an empty ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPointsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/membership:
    get:
      operationId: getAccountMembership
      summary: Return the signed-in user's persisted membership entitlement
      security:
        - portalSession: []
      responses:
        "200":
          description: Membership entitlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMembershipResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/notifications:
    get:
      operationId: getAccountNotifications
      summary: Return notifications belonging to the signed-in user
      security:
        - portalSession: []
      responses:
        "200":
          description: Persistent notifications, possibly empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountNotificationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/notifications/{notification_id}/read:
    post:
      operationId: markAccountNotificationRead
      summary: Mark one signed-in user's persistent notification as read
      security:
        - portalSession: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]+$'
      responses:
        "200":
          description: Persistent notification read state, including an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountNotificationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/tickets:
    get:
      operationId: getAccountTickets
      summary: Return support tickets belonging to the signed-in user
      security:
        - portalSession: []
      responses:
        "200":
          description: Persistent support tickets, possibly empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTicketsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createAccountTicket
      summary: Create one persistent support ticket for the signed-in user
      security:
        - portalSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateTicketRequest"
      responses:
        "201":
          description: Created persistent support ticket, including an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTicketResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/tickets/{ticket_id}:
    get:
      operationId: getAccountTicket
      summary: Return one signed-in user's support ticket and persistent history
      security:
        - portalSession: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Owner-scoped support ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTicketDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/tickets/{ticket_id}/follow-ups:
    post:
      operationId: createAccountTicketFollowUp
      summary: Add one persistent follow-up to the signed-in user's support ticket
      security:
        - portalSession: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountTicketFollowUpRequest"
      responses:
        "200":
          description: Updated persistent ticket after a follow-up or idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTicketResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/membership-orders:
    get:
      operationId: getAccountMembershipOrders
      summary: Return membership orders belonging to the signed-in user
      security:
        - portalSession: []
      responses:
        "200":
          description: Membership orders, possibly empty while the provider is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMembershipOrdersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createAccountMembershipOrder
      summary: Create the signed-in user's own lifetime membership order
      description: >-
        The ADR-0019 write exception. The order belongs to the verified Portal
        Session user; a browser can neither select the actor nor supply an
        amount or merchant order number. A disabled payment provider returns an
        honest unavailable response and creates no order.
      security:
        - portalSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateMembershipOrderRequest"
      responses:
        "201":
          description: Created order, including an idempotent retry, with its checkout handle while payment is pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMembershipOrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/library/courses:
    get:
      operationId: libraryCourses
      summary: List available courses
      security:
        - portalSession: []
      responses:
        "200":
          description: Course list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryCoursesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/food/venues:
    get:
      operationId: foodVenues
      summary: List food venues for a campus
      security:
        - portalSession: []
      parameters:
        - name: campus
          in: query
          required: true
          schema:
            type: string
            enum: [minglun, jinming, longzihu]
      responses:
        "200":
          description: Venue list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodVenuesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/practice/banks:
    get:
      operationId: practiceBanks
      summary: List available question banks
      security:
        - portalSession: []
      responses:
        "200":
          description: Bank list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeBanksResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/practice/sessions:
    post:
      operationId: createPortalPracticeSession
      summary: Create a real QuizCraft Practice Session
      description: >
        This is the only Portal write path for a new Practice Session. A
        signed-in Portal Session is forwarded as an actor-bound service
        request; a visitor is identified only by a Core-issued anonymous
        HttpOnly cookie. The route remains disabled until the QuizCraft V2
        cutover gate is explicitly enabled.
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalPracticeSessionRequest"
      responses:
        "201":
          description: Server-selected questions pinned to one immutable bank version; question answers are intentionally absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalPracticeSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/practice/sessions/{session_id}/answers:
    post:
      operationId: submitPortalPracticeAnswer
      summary: Submit one answer for server-side Practice evaluation
      description: >
        The browser supplies only the selected answer. QuizCraft owns the
        answer key, score, immutable attempt fact, and retry outcome. This
        route remains disabled until the QuizCraft V2 cutover gate is
        explicitly enabled.
      security: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalPracticeAnswerRequest"
      responses:
        "200":
          description: Server-confirmed correctness and optional explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalPracticeAnswerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/practice/catalog:
    get:
      operationId: quizCraftCatalog
      summary: List published QuizCraft V2 banks available for real Practice sessions
      description: Available only during and after the explicit #166 cutover; it never falls back to legacy or mock data.
      security: []
      responses:
        "200":
          description: Published QuizCraft V2 bank versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizCraftCatalogResponse"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/rankings/overall:
    get:
      operationId: quizCraftOverallRanking
      summary: Read the public QuizCraft V2 overall ranking
      description: Derived only from immutable scored attempts and restricted to controlled public identity fields.
      security: []
      parameters:
        - $ref: "#/components/parameters/QuizCraftRankingPeriod"
      responses:
        "200":
          description: Real weekly or lifetime standings; an empty list is a successful empty ranking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizCraftRankingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/banks/{bank_id}/rankings:
    get:
      operationId: quizCraftBankRanking
      summary: Read one published bank's public QuizCraft V2 ranking
      security: []
      parameters:
        - name: bank_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/QuizCraftRankingPeriod"
      responses:
        "200":
          description: Real bank standings with controlled public identity fields only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizCraftRankingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/practice/stats:
    get:
      operationId: personalPracticeStats
      summary: Read the signed-in user's fact-derived QuizCraft Practice statistics
      description: >
        This endpoint is served by QuizCraft V2 only when the explicit
        Portal V2-read cutover flag is enabled. Before that deployment window,
        Portal clients must not treat a response as V2 data or synthesize a
        success fallback.
      security:
        - portalSession: []
      responses:
        "200":
          description: Persistent stats derived from immutable QuizCraft Practice attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalPracticeStatsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/learning-state:
    get:
      operationId: getPortalLearningState
      summary: Read the signed-in user's Core-owned QuizCraft learning state
      description: >
        Portal Gateway derives the actor only from its encrypted Portal
        Session, verifies the same actor and product-scoped permission with
        Platform Core, and forwards a signed actor-bound request to QuizCraft.
        The response contains wrong marks and counts only, never fabricated
        question content or a legacy/mock success fallback.
      security:
        - portalSession: []
      parameters:
        - $ref: "#/components/parameters/LearningStatePageQuery"
        - $ref: "#/components/parameters/LearningStatePageSizeQuery"
        - $ref: "#/components/parameters/LearningStateWrongQuery"
      responses:
        "200":
          description: Persistent wrong marks and counts derived by QuizCraft Core
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningStateEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    portalSession:
      type: apiKey
      in: cookie
      name: __Host-henukit_portal_session

  parameters:
    QuizCraftRankingPeriod:
      name: period
      in: query
      required: false
      schema:
        type: string
        enum: [weekly, lifetime]
        default: weekly
    LearningStatePageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LearningStatePageSizeQuery:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    LearningStateWrongQuery:
      name: wrong
      in: query
      required: false
      description: Filter by the Core-owned latest wrong mark before counting and paginating.
      schema:
        type: boolean

  schemas:
    PortalSession:
      type: object
      required: [user_id, expires_at]
      properties:
        user_id:
          type: string
        display_name:
          type: string
          description: Registration display name when available; clients should not treat user_id as a human label.
          maxLength: 80
        expires_at:
          type: string
          format: date-time

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: string
        request_id:
          type: string

    AccountSummaryResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/AccountSummary"
        request_id:
          type: string

    AccountSummary:
      type: object
      required: [points_balance, plan, lifetime, unread_notification_count, open_ticket_count]
      properties:
        points_balance:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        plan:
          type: string
          enum: [free, lifetime]
        lifetime:
          type: boolean
        unread_notification_count:
          type: integer
          minimum: 0
        open_ticket_count:
          type: integer
          minimum: 0

    AccountPointsResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [balance, entries, next_cursor]
          properties:
            balance:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            entries:
              type: array
              items:
                $ref: "#/components/schemas/AccountPointEntry"
            next_cursor:
              type: [string, 'null']
              maxLength: 512
        request_id:
          type: string

    AccountPointEntry:
      type: object
      additionalProperties: false
      required: [id, amount, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        amount:
          oneOf:
            - type: integer
              format: int64
              minimum: -9007199254740991
              maximum: -1
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    AccountMembershipResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [plan, lifetime]
          properties:
            plan:
              type: string
              enum: [free, lifetime]
            lifetime:
              type: boolean
        request_id:
          type: string

    AccountNotificationsResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [notifications]
          properties:
            notifications:
              type: array
              items:
                $ref: "#/components/schemas/AccountNotification"
        request_id:
          type: string

    AccountNotification:
      type: object
      required: [id, title, body, kind, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        kind:
          type: string
        ticket_id:
          type: string
          format: uuid
        ticket_reference:
          type: string
          pattern: '^HKT-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        read_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    AccountNotificationResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [notification]
          properties:
            notification:
              $ref: "#/components/schemas/AccountNotification"
        request_id:
          type: string

    AccountTicketsResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [tickets]
          properties:
            tickets:
              type: array
              items:
                $ref: "#/components/schemas/AccountTicket"
        request_id:
          type: string

    AccountTicket:
      type: object
      required: [id, reference, title, category, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: '^HKT-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        title:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AccountTicketResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [ticket]
          properties:
            ticket:
              $ref: "#/components/schemas/AccountTicket"
        request_id:
          type: string

    AccountTicketDetailResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [ticket, messages, events]
          properties:
            ticket:
              $ref: "#/components/schemas/AccountTicket"
            messages:
              type: array
              items:
                $ref: "#/components/schemas/AccountTicketMessage"
            events:
              type: array
              items:
                $ref: "#/components/schemas/AccountTicketEvent"
        request_id:
          type: string

    AccountCreateTicketRequest:
      type: object
      required: [title, category, body]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        category:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z][a-z0-9_-]*$'
        body:
          type: string
          minLength: 1
          maxLength: 5000

    AccountTicketFollowUpRequest:
      type: object
      required: [body, expected_version]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
        expected_version:
          type: integer
          minimum: 1

    AccountTicketMessage:
      type: object
      required: [id, author_kind, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        author_kind:
          type: string
          enum: [user, operator]
        body:
          type: string
        created_at:
          type: string
          format: date-time

    AccountTicketEvent:
      type: object
      required: [id, kind, from_status, to_status, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [operator_reply, status_transition, reopened]
        from_status:
          type: string
          enum: [open, in_progress, resolved]
        to_status:
          type: string
          enum: [open, in_progress, resolved]
        created_at:
          type: string
          format: date-time

    AccountMembershipOrdersResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [orders]
          properties:
            orders:
              type: array
              items:
                $ref: "#/components/schemas/AccountMembershipOrder"
        request_id:
          type: string

    AccountCreateMembershipOrderRequest:
      type: object
      additionalProperties: false
      description: >-
        Carries nothing. The plan, the amount, and the merchant order number are
        all owned by the server, so a browser cannot influence what is charged.

    AccountMembershipOrderResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [order]
          properties:
            order:
              $ref: "#/components/schemas/AccountMembershipOrder"
            checkout_url:
              type: string
              pattern: '^weixin://'
              maxLength: 512
              description: >-
                Single-use WeChat payment URI the browser renders as a QR code.
                Present only while the order awaits payment and the code is
                still valid, so an expired code is never returned as if it were
                scannable. It carries no merchant order number, and it is not
                part of the order, so it never appears in an order listing.
        request_id:
          type: string

    AccountMembershipOrder:
      type: object
      required: [id, plan, amount_cents, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        plan:
          type: string
          enum: [lifetime]
        amount_cents:
          type: integer
          enum: [990]
        status:
          type: string
          enum: [created, pending_payment, paid, closed, failed, refunded]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LibraryCoursesResponse:
      type: object
      required: [courses, request_id]
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/CourseSummary"
        request_id:
          type: string

    CourseSummary:
      type: object
      required: [id, name, subject, material_count]
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        material_count:
          type: integer

    FoodVenuesResponse:
      type: object
      required: [campus, venues, request_id]
      properties:
        campus:
          type: string
        venues:
          type: array
          items:
            $ref: "#/components/schemas/VenueSummary"
        request_id:
          type: string

    VenueSummary:
      type: object
      required: [id, name, rating, tier, campus]
      properties:
        id:
          type: string
        name:
          type: string
        rating:
          type: number
          format: double
        tier:
          type: string
        campus:
          type: string

    PracticeBanksResponse:
      type: object
      required: [banks, request_id]
      properties:
        banks:
          type: array
          items:
            $ref: "#/components/schemas/BankSummary"
        request_id:
          type: string

    BankSummary:
      type: object
      required: [id, name, subject, question_count]
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        question_count:
          type: integer

    PortalPracticeSessionRequest:
      type: object
      additionalProperties: false
      required: [bank_id, bank_version_id, mode]
      properties:
        bank_id:
          type: string
          format: uuid
        bank_version_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [random, difficult, chapter]
        chapter_id:
          type: string
          minLength: 1
          maxLength: 160
        question_count:
          type: integer
          minimum: 1
          maximum: 500

    PortalPracticeQuestion:
      type: object
      additionalProperties: false
      required: [question_id, question_version_id, type, chapter_id, chapter, content]
      properties:
        question_id:
          type: string
          format: uuid
        question_version_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [single, multi, judge, blank]
        chapter_id:
          type: string
        chapter:
          type: string
        content:
          type: string
        options:
          type: array
          items:
            type: string

    PortalPracticeSessionResponse:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          type: object
          additionalProperties: false
          required: [session_id, bank_id, bank_version_id, mode, excluded_unavailable_count, questions]
          properties:
            session_id:
              type: string
              format: uuid
            bank_id:
              type: string
              format: uuid
            bank_version_id:
              type: string
              format: uuid
            mode:
              type: string
              enum: [random, difficult, chapter]
            excluded_unavailable_count:
              type: integer
              minimum: 0
            questions:
              type: array
              items:
                $ref: "#/components/schemas/PortalPracticeQuestion"

    PortalPracticeAnswerRequest:
      type: object
      additionalProperties: false
      required: [question_id, question_version_id, answer]
      properties:
        question_id:
          type: string
          format: uuid
        question_version_id:
          type: string
          format: uuid
        answer: {}

    PortalPracticeAnswerResponse:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          type: object
          additionalProperties: false
          required: [question_id, question_version_id, correct, replayed, expected_answer, analysis]
          properties:
            question_id:
              type: string
              format: uuid
            question_version_id:
              type: string
              format: uuid
            correct:
              type: boolean
            replayed:
              type: boolean
            expected_answer: {}
            analysis:
              type: string

    MasterySubject:
      type: object
      required: [bank_id, label, value, total_questions, correct_questions]
      properties:
        bank_id:
          type: string
          format: uuid
        label:
          type: string
        value:
          type: integer
          minimum: 0
          maximum: 100
        total_questions:
          type: integer
          format: int64
          minimum: 0
        correct_questions:
          type: integer
          format: int64
          minimum: 0

    PersonalPracticeStats:
      type: object
      required: [total_answers, correct_answers, accuracy, streak_days, mastery]
      properties:
        total_answers:
          type: integer
          format: int64
          minimum: 0
        correct_answers:
          type: integer
          format: int64
          minimum: 0
        accuracy:
          type: integer
          minimum: 0
          maximum: 100
        streak_days:
          type: integer
          minimum: 0
        mastery:
          type: array
          items:
            $ref: "#/components/schemas/MasterySubject"

    QuizCraftCatalogResponse:
      type: object
      additionalProperties: false
      required: [banks, request_id]
      properties:
        banks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [bank_id, bank_version_id, name, question_count, available]
            properties:
              bank_id:
                type: string
                format: uuid
              bank_version_id:
                type: string
                format: uuid
              name:
                type: string
                minLength: 1
              question_count:
                type: integer
                minimum: 0
              available:
                type: boolean
        request_id:
          type: string
          minLength: 1

    QuizCraftRankingResponse:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          type: string
          minLength: 1
        data:
          type: object
          additionalProperties: false
          required: [scope, period, metric, entries]
          properties:
            scope:
              type: string
              enum: [overall, bank]
            bank_id:
              type: string
              format: uuid
            period:
              type: string
              enum: [weekly, lifetime]
            metric:
              type: string
              const: correct_answer_count
            entries:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [rank, nickname, system_avatar, correct_answer_count]
                properties:
                  rank:
                    type: integer
                    format: int64
                    minimum: 1
                  nickname:
                    type: string
                    minLength: 1
                  system_avatar:
                    type: string
                    enum: [scholar-blue, coder-green, reader-amber, owl-purple]
                  correct_answer_count:
                    type: integer
                    format: int64
                    minimum: 0

    PersonalPracticeStatsEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          $ref: "#/components/schemas/PersonalPracticeStats"

    LearningStateItem:
      type: object
      additionalProperties: false
      required: [bank_id, question_id, question_version_id, wrong, attempt_count, correct_count, updated_at]
      properties:
        bank_id:
          type: string
          format: uuid
        question_id:
          type: string
          format: uuid
        question_version_id:
          type: string
          format: uuid
        wrong:
          type: boolean
        attempt_count:
          type: integer
          format: int64
          minimum: 1
        correct_count:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time

    LearningStateEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          type: string
          minLength: 1
        data:
          $ref: "#/components/schemas/LearningStatePage"

    LearningStatePage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LearningStateItem"
        pagination:
          $ref: "#/components/schemas/LearningStatePagination"

    LearningStatePagination:
      type: object
      additionalProperties: false
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
          format: int64
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        total_pages:
          type: integer
          format: int64
          minimum: 0

    PortalNoticeSource:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        url:
          type: string
          format: iri
          pattern: '^https://'
          maxLength: 2048
          description: Public source URL. maxLength gives clients a 2,048-character upper bound; Gateway also rejects a decoded URL over 2,048 UTF-8 bytes or without a valid ASCII public-DNS hostname, while retaining UTF-8 path and query text.

    PortalNotice:
      type: object
      additionalProperties: false
      required: [id, title, body, source, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 100000
        source:
          $ref: "#/components/schemas/PortalNoticeSource"
        created_at:
          type: string
          format: date-time

    NoticeListResponse:
      type: object
      description: Compatibility facade for the retired public notice proxy. `notices` remains the required legacy list; the current dedicated Owner feed also emits the richer optional `data` object.
      required: [notices, request_id]
      properties:
        notices:
          type: array
          items:
            $ref: "#/components/schemas/NoticeSummary"
        request_id:
          type: string
        data:
          description: Additive rich Portal notice feed. Current Portal Gateway always emits it after verifying the dedicated Notice Owner response, while legacy clients may ignore it.
          $ref: "#/components/schemas/PortalNoticeFeed"

    NoticeSummary:
      type: object
      required: [id, title, source, published_at]
      properties:
        id:
          type: string
        title:
          type: string
        source:
          type: string
          description: Verified public source name.
        published_at:
          type: string
          format: date-time
          description: Compatibility timestamp. The current dedicated Owner feed supplies Notice intake time, not email-delivery completion.

    PortalNoticeFeed:
      type: object
      additionalProperties: false
      required: [notices]
      properties:
        notices:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/PortalNotice"

  responses:
    BadRequest:
      description: Invalid command input or identifier
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Not authenticated or session expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The signed-in user cannot access the requested resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: A command idempotency key was reused or the ticket revision is stale
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Product service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadGateway:
      description: A private Owner response failed the Gateway contract
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
