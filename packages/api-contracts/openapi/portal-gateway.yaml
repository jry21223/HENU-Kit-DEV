openapi: 3.1.0
info:
  title: Portal Gateway
  version: 0.1.0
  description: >
    Read-only BFF for HENU Kit Portal (henukit.cn). Authenticates users via
    Platform Core OAuth and proxies GET requests to product services with
    verified permissions.
servers:
  - url: http://127.0.0.1:8084
    description: Local development
  - url: https://henukit.cn
    description: Production

paths:
  /api/v1/healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/login:
    get:
      operationId: login
      summary: Start OAuth code flow with Platform Core
      security: []
      parameters:
        - name: return_to
          in: query
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to Platform Core authorize endpoint

  /api/v1/auth/callback:
    get:
      operationId: callback
      summary: OAuth callback — exchange code for Portal Session
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to return_to with session cookie set
        "400":
          description: Invalid or expired state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/session:
    get:
      operationId: getSession
      summary: Return current Portal Session
      security:
        - portalSession: []
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/session/logout:
    post:
      operationId: logout
      summary: Clear Portal Session cookie
      security: []
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: signed_out

  /api/v1/account/summary:
    get:
      operationId: getAccountSummary
      summary: Return the signed-in user's persisted Account Portfolio summary
      security:
        - portalSession: []
      responses:
        "200":
          description: Persisted zero state or current account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/points:
    get:
      operationId: getAccountPoints
      summary: Return the signed-in user's persistent points balance and ledger
      security:
        - portalSession: []
      responses:
        "200":
          description: Points account, possibly with an empty ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPointsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/membership:
    get:
      operationId: getAccountMembership
      summary: Return the signed-in user's persisted membership entitlement
      security:
        - portalSession: []
      responses:
        "200":
          description: Membership entitlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMembershipResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/notifications:
    get:
      operationId: getAccountNotifications
      summary: Return notifications belonging to the signed-in user
      security:
        - portalSession: []
      responses:
        "200":
          description: Persistent notifications, possibly empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountNotificationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/tickets:
    get:
      operationId: getAccountTickets
      summary: Return support tickets belonging to the signed-in user
      security:
        - portalSession: []
      responses:
        "200":
          description: Persistent support tickets, possibly empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTicketsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/membership-orders:
    get:
      operationId: getAccountMembershipOrders
      summary: Return membership orders belonging to the signed-in user
      security:
        - portalSession: []
      responses:
        "200":
          description: Membership orders, possibly empty while the provider is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMembershipOrdersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/library/courses:
    get:
      operationId: libraryCourses
      summary: List available courses
      security:
        - portalSession: []
      responses:
        "200":
          description: Course list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryCoursesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/food/venues:
    get:
      operationId: foodVenues
      summary: List food venues for a campus
      security:
        - portalSession: []
      parameters:
        - name: campus
          in: query
          required: true
          schema:
            type: string
            enum: [minglun, jinming, longzihu]
      responses:
        "200":
          description: Venue list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodVenuesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/practice/banks:
    get:
      operationId: practiceBanks
      summary: List available question banks
      security:
        - portalSession: []
      responses:
        "200":
          description: Bank list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeBanksResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/notices:
    get:
      operationId: noticeList
      summary: List published notices
      security:
        - portalSession: []
      responses:
        "200":
          description: Notice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    portalSession:
      type: apiKey
      in: cookie
      name: __Host-henukit_portal_session

  schemas:
    PortalSession:
      type: object
      required: [user_id, expires_at]
      properties:
        user_id:
          type: string
        display_name:
          type: string
          description: Registration display name when available; clients should not treat user_id as a human label.
          maxLength: 80
        expires_at:
          type: string
          format: date-time

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: string
        request_id:
          type: string

    AccountSummaryResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/AccountSummary"
        request_id:
          type: string

    AccountSummary:
      type: object
      required: [points_balance, plan, lifetime, unread_notification_count, open_ticket_count]
      properties:
        points_balance:
          type: integer
          format: int64
          minimum: 0
        plan:
          type: string
          enum: [free, lifetime]
        lifetime:
          type: boolean
        unread_notification_count:
          type: integer
          minimum: 0
        open_ticket_count:
          type: integer
          minimum: 0

    AccountPointsResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [balance, entries]
          properties:
            balance:
              type: integer
              format: int64
              minimum: 0
            entries:
              type: array
              items:
                $ref: "#/components/schemas/AccountPointEntry"
        request_id:
          type: string

    AccountPointEntry:
      type: object
      required: [id, amount, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    AccountMembershipResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [plan, lifetime]
          properties:
            plan:
              type: string
              enum: [free, lifetime]
            lifetime:
              type: boolean
        request_id:
          type: string

    AccountNotificationsResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [notifications]
          properties:
            notifications:
              type: array
              items:
                $ref: "#/components/schemas/AccountNotification"
        request_id:
          type: string

    AccountNotification:
      type: object
      required: [id, title, body, kind, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        kind:
          type: string
        read_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    AccountTicketsResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [tickets]
          properties:
            tickets:
              type: array
              items:
                $ref: "#/components/schemas/AccountTicket"
        request_id:
          type: string

    AccountTicket:
      type: object
      required: [id, title, category, status, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved]
        updated_at:
          type: string
          format: date-time

    AccountMembershipOrdersResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [orders]
          properties:
            orders:
              type: array
              items:
                $ref: "#/components/schemas/AccountMembershipOrder"
        request_id:
          type: string

    AccountMembershipOrder:
      type: object
      required: [id, plan, amount_cents, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        plan:
          type: string
          enum: [lifetime]
        amount_cents:
          type: integer
          enum: [990]
        status:
          type: string
          enum: [created, pending_payment, paid, closed, failed, refunded]
        created_at:
          type: string
          format: date-time

    LibraryCoursesResponse:
      type: object
      required: [courses, request_id]
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/CourseSummary"
        request_id:
          type: string

    CourseSummary:
      type: object
      required: [id, name, subject, material_count]
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        material_count:
          type: integer

    FoodVenuesResponse:
      type: object
      required: [campus, venues, request_id]
      properties:
        campus:
          type: string
        venues:
          type: array
          items:
            $ref: "#/components/schemas/VenueSummary"
        request_id:
          type: string

    VenueSummary:
      type: object
      required: [id, name, rating, tier, campus]
      properties:
        id:
          type: string
        name:
          type: string
        rating:
          type: number
          format: double
        tier:
          type: string
        campus:
          type: string

    PracticeBanksResponse:
      type: object
      required: [banks, request_id]
      properties:
        banks:
          type: array
          items:
            $ref: "#/components/schemas/BankSummary"
        request_id:
          type: string

    BankSummary:
      type: object
      required: [id, name, subject, question_count]
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        question_count:
          type: integer

    NoticeListResponse:
      type: object
      required: [notices, request_id]
      properties:
        notices:
          type: array
          items:
            $ref: "#/components/schemas/NoticeSummary"
        request_id:
          type: string

    NoticeSummary:
      type: object
      required: [id, title, source, published_at]
      properties:
        id:
          type: string
        title:
          type: string
        source:
          type: string
        published_at:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Not authenticated or session expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Product service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
