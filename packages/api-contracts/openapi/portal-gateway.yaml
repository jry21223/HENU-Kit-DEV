openapi: 3.1.0
info:
  title: Portal Gateway
  version: 0.3.0
  description: >
    Default-read BFF for HENU Kit Portal (henukit.cn). It authenticates users
    via Platform Core OAuth and proxies GET requests to product services with
    verified permissions. ADR-0018 adds exactly two default-off QuizCraft
    Practice commands; it does not permit a generic product write proxy.
servers:
  - url: http://127.0.0.1:8084
    description: Local development
  - url: https://henukit.cn
    description: Production

paths:
  /api/v1/healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/login:
    get:
      operationId: login
      summary: Start OAuth code flow with Platform Core
      security: []
      parameters:
        - name: return_to
          in: query
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to Platform Core authorize endpoint

  /api/v1/auth/callback:
    get:
      operationId: callback
      summary: OAuth callback — exchange code for Portal Session
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to return_to with session cookie set
        "400":
          description: Invalid or expired state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/session:
    get:
      operationId: getSession
      summary: Return current Portal Session
      security:
        - portalSession: []
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/session/logout:
    post:
      operationId: logout
      summary: Clear Portal Session cookie
      security: []
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: signed_out

  /api/v1/library/materials:
    get:
      operationId: getPublicLibraryCatalog
      summary: Return one complete Library-owned active public catalog snapshot
      description: >
        Returns the full active public-free catalog and the Library ledger's
        global Download Start aggregate from one owner snapshot. Browser search
        and filters are local presentation only and never alter these totals.
      security: []
      responses:
        "200":
          description: Complete active catalog, including an honest empty success
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicLibraryCatalogResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/library/materials/{material_id}:
    get:
      operationId: getPublicLibraryMaterial
      summary: Return one browser-safe material from the active owner catalog
      security: []
      parameters:
        - name: material_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Active public-free material
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicLibraryMaterialResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/MaterialNotAvailable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/library/materials/{material_id}/download:
    get:
      operationId: startPublicMaterialDownload
      summary: Start the sole owner-backed public material download flow
      description: >
        Selects only a material ID. Portal Gateway asks Library to validate the
        active public-free snapshot and persist a Download Start, then relays
        the exact GET-only OSS capability as a no-store 303. The Location is a
        short-lived bearer capability and is never returned as page JSON.
      security: []
      parameters:
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
      responses:
        "303":
          description: Redirect to the validated exact-version OSS attachment
          headers:
            Location:
              required: true
              description: Exact-object OSS GET capability with temporary ECS role credentials and at most 60 seconds of validity.
              schema: { type: string, format: uri }
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
            Referrer-Policy:
              required: true
              schema: { type: string, const: no-referrer }
            X-Content-Type-Options:
              required: true
              schema: { type: string, const: nosniff }
        "404": { $ref: "#/components/responses/MaterialNotAvailable" }
        "503": { $ref: "#/components/responses/DownloadTemporarilyUnavailable" }

  /api/v1/account/summary:
    get:
      operationId: getAccountSummary
      summary: Return the signed-in user's persisted Account Portfolio summary
      security:
        - portalSession: []
      responses:
        "200":
          description: Persisted zero state or current account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/points:
    get:
      operationId: getAccountPoints
      summary: Return the signed-in user's persistent points balance and ledger
      security:
        - portalSession: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Versioned opaque encrypted continuation cursor returned by the preceding point-ledger page; Portal forwards it without inspection.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: Number of immutable point-ledger entries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Points account, possibly with an empty ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPointsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/membership:
    get:
      operationId: getAccountMembership
      summary: Return the signed-in user's persisted membership entitlement
      security:
        - portalSession: []
      responses:
        "200":
          description: Membership entitlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMembershipResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/notifications:
    get:
      operationId: getAccountNotifications
      summary: Return notifications belonging to the signed-in user
      security:
        - portalSession: []
      responses:
        "200":
          description: Persistent notifications, possibly empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountNotificationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/notifications/{notification_id}/read:
    post:
      operationId: markAccountNotificationRead
      summary: Mark one signed-in user's persistent notification as read
      security:
        - portalSession: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]+$'
      responses:
        "200":
          description: Persistent notification read state, including an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountNotificationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/tickets:
    get:
      operationId: getAccountTickets
      summary: Return support tickets belonging to the signed-in user
      security:
        - portalSession: []
      responses:
        "200":
          description: Persistent support tickets, possibly empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTicketsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createAccountTicket
      summary: Create one persistent support ticket for the signed-in user
      security:
        - portalSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateTicketRequest"
      responses:
        "201":
          description: Created persistent support ticket, including an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTicketResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/tickets/{ticket_id}:
    get:
      operationId: getAccountTicket
      summary: Return one signed-in user's support ticket and persistent history
      security:
        - portalSession: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Owner-scoped support ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTicketDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/tickets/{ticket_id}/follow-ups:
    post:
      operationId: createAccountTicketFollowUp
      summary: Add one persistent follow-up to the signed-in user's support ticket
      security:
        - portalSession: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountTicketFollowUpRequest"
      responses:
        "200":
          description: Updated persistent ticket after a follow-up or idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTicketResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/account/membership-orders:
    get:
      operationId: getAccountMembershipOrders
      summary: Return membership orders belonging to the signed-in user
      security:
        - portalSession: []
      responses:
        "200":
          description: Membership orders, possibly empty while the provider is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMembershipOrdersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createAccountMembershipOrder
      summary: Create the signed-in user's own lifetime membership order
      description: >-
        The ADR-0019 write exception. The order belongs to the verified Portal
        Session user; a browser can neither select the actor nor supply an
        amount or merchant order number. A disabled payment provider returns an
        honest unavailable response and creates no order.
      security:
        - portalSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateMembershipOrderRequest"
      responses:
        "201":
          description: Created order, including an idempotent retry, with its checkout handle while payment is pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMembershipOrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/library/courses:
    get:
      operationId: libraryCourses
      summary: List available courses
      security:
        - portalSession: []
      responses:
        "200":
          description: Course list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryCoursesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/food/venues:
    get:
      operationId: foodVenues
      summary: List food venues for a campus
      security:
        - portalSession: []
      parameters:
        - name: campus
          in: query
          required: true
          schema:
            type: string
            enum: [minglun, jinming, longzihu]
      responses:
        "200":
          description: Venue list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodVenuesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/career/searches:
    post:
      operationId: createCareerSearch
      summary: Create an async Work Radar search (Lifetime members only)
      security:
        - portalSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: The queued search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerSearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listCareerSearches
      summary: List the signed-in Lifetime user's Work Radar search history
      security:
        - portalSession: []
      responses:
        "200":
          description: Search history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerSearchesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/career/searches/{search_id}:
    get:
      operationId: getCareerSearch
      summary: Read one signed-in Lifetime user's search status
      security:
        - portalSession: []
      parameters:
        - name: search_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Search status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerSearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/career/profile:
    get:
      operationId: getCareerProfile
      summary: Read the signed-in Lifetime user's Career profile
      security:
        - portalSession: []
      responses:
        "200":
          description: The actor's profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: updateCareerProfile
      summary: Replace the signed-in Lifetime user's Career profile
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_roles:
                  type: string
                tech_stack:
                  type: string
                locations:
                  type: string
                job_type:
                  type: string
                  enum: ["", daily_intern, summer_intern, campus_recruit]
                graduation_year:
                  type: [integer, "null"]
                resume_text:
                  type: string
                email_notification_enabled:
                  type: boolean
      responses:
        "200":
          description: The stored profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  # Legacy practice reads (/api/v1/practice/banks, /schools, /lists/{id},
  # /leaderboard) were removed with ADR-0036: Portal Gateway routes every
  # practice read to the QuizCraft Go core contract instead, and the removed
  # paths fail closed with an honest 404. See /api/v1/practice/catalog and
  # /api/v1/rankings/*.

  /api/v1/practice/sessions:
    post:
      operationId: createPortalPracticeSession
      summary: Create a real QuizCraft Practice Session
      description: >
        This is the only Portal write path for a new Practice Session. A
        signed-in Portal Session is forwarded as an actor-bound service
        request; a visitor is identified only by a Core-issued anonymous
        HttpOnly cookie. The route remains disabled until the QuizCraft V2
        cutover gate is explicitly enabled.
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalPracticeSessionRequest"
      responses:
        "201":
          description: Server-selected questions pinned to one immutable bank version; question answers are intentionally absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalPracticeSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/practice/sessions/{session_id}/answers:
    post:
      operationId: submitPortalPracticeAnswer
      summary: Submit one answer for server-side Practice evaluation
      description: >
        The browser supplies only the selected answer. QuizCraft owns the
        answer key, score, immutable attempt fact, and retry outcome. This
        route remains disabled until the QuizCraft V2 cutover gate is
        explicitly enabled.
      security: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalPracticeAnswerRequest"
      responses:
        "200":
          description: Server-confirmed correctness and optional explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalPracticeAnswerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/practice/catalog:
    get:
      operationId: quizCraftCatalog
      summary: List published QuizCraft V2 banks available for real Practice sessions
      description: Available only during and after the explicit #166 cutover; it never falls back to legacy or mock data.
      security: []
      responses:
        "200":
          description: Published QuizCraft V2 bank versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizCraftCatalogResponse"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/rankings/overall:
    get:
      operationId: quizCraftOverallRanking
      summary: Read the public QuizCraft V2 overall ranking
      description: Derived only from immutable scored attempts and restricted to controlled public identity fields.
      security: []
      parameters:
        - $ref: "#/components/parameters/QuizCraftRankingPeriod"
      responses:
        "200":
          description: Real weekly or lifetime standings; an empty list is a successful empty ranking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizCraftRankingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/banks/{bank_id}/rankings:
    get:
      operationId: quizCraftBankRanking
      summary: Read one published bank's public QuizCraft V2 ranking
      security: []
      parameters:
        - name: bank_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/QuizCraftRankingPeriod"
      responses:
        "200":
          description: Real bank standings with controlled public identity fields only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizCraftRankingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/practice/stats:
    get:
      operationId: personalPracticeStats
      summary: Read the signed-in user's fact-derived QuizCraft Practice statistics
      description: >
        This endpoint is served by QuizCraft V2 only when the explicit
        Portal V2-read cutover flag is enabled. Before that deployment window,
        Portal clients must not treat a response as V2 data or synthesize a
        success fallback.
      security:
        - portalSession: []
      responses:
        "200":
          description: Persistent stats derived from immutable QuizCraft Practice attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalPracticeStatsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/notices:
    get:
      operationId: noticeList
      summary: List published notices
      security:
        - portalSession: []
      responses:
        "200":
          description: Notice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    portalSession:
      type: apiKey
      in: cookie
      name: __Host-henukit_portal_session

  parameters:
    QuizCraftRankingPeriod:
      name: period
      in: query
      required: false
      schema:
        type: string
        enum: [weekly, lifetime]
        default: weekly

  schemas:
    PortalSession:
      type: object
      required: [user_id, expires_at]
      properties:
        user_id:
          type: string
        display_name:
          type: string
          description: Registration display name when available; clients should not treat user_id as a human label.
          maxLength: 80
        expires_at:
          type: string
          format: date-time

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
        detail:
          type: string
        request_id:
          type: string

    AccountSummaryResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/AccountSummary"
        request_id:
          type: string

    AccountSummary:
      type: object
      required: [points_balance, plan, lifetime, unread_notification_count, open_ticket_count]
      properties:
        points_balance:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        plan:
          type: string
          enum: [free, lifetime]
        lifetime:
          type: boolean
        unread_notification_count:
          type: integer
          minimum: 0
        open_ticket_count:
          type: integer
          minimum: 0

    AccountPointsResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [balance, entries, next_cursor]
          properties:
            balance:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            entries:
              type: array
              items:
                $ref: "#/components/schemas/AccountPointEntry"
            next_cursor:
              type: [string, 'null']
              maxLength: 512
        request_id:
          type: string

    AccountPointEntry:
      type: object
      additionalProperties: false
      required: [id, amount, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        amount:
          oneOf:
            - type: integer
              format: int64
              minimum: -9007199254740991
              maximum: -1
            - type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    AccountMembershipResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [plan, lifetime]
          properties:
            plan:
              type: string
              enum: [free, lifetime]
            lifetime:
              type: boolean
        request_id:
          type: string

    AccountNotificationsResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [notifications]
          properties:
            notifications:
              type: array
              items:
                $ref: "#/components/schemas/AccountNotification"
        request_id:
          type: string

    AccountNotification:
      type: object
      required: [id, title, body, kind, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        kind:
          type: string
        ticket_id:
          type: string
          format: uuid
        ticket_reference:
          type: string
          pattern: '^HKT-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        read_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    AccountNotificationResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [notification]
          properties:
            notification:
              $ref: "#/components/schemas/AccountNotification"
        request_id:
          type: string

    AccountTicketsResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [tickets]
          properties:
            tickets:
              type: array
              items:
                $ref: "#/components/schemas/AccountTicket"
        request_id:
          type: string

    AccountTicket:
      type: object
      required: [id, reference, title, category, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: '^HKT-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        title:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AccountTicketResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [ticket]
          properties:
            ticket:
              $ref: "#/components/schemas/AccountTicket"
        request_id:
          type: string

    AccountTicketDetailResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [ticket, messages, events]
          properties:
            ticket:
              $ref: "#/components/schemas/AccountTicket"
            messages:
              type: array
              items:
                $ref: "#/components/schemas/AccountTicketMessage"
            events:
              type: array
              items:
                $ref: "#/components/schemas/AccountTicketEvent"
        request_id:
          type: string

    AccountCreateTicketRequest:
      type: object
      required: [title, category, body]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        category:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z][a-z0-9_-]*$'
        body:
          type: string
          minLength: 1
          maxLength: 5000

    AccountTicketFollowUpRequest:
      type: object
      required: [body, expected_version]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
        expected_version:
          type: integer
          minimum: 1

    AccountTicketMessage:
      type: object
      required: [id, author_kind, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        author_kind:
          type: string
          enum: [user, operator]
        body:
          type: string
        created_at:
          type: string
          format: date-time

    AccountTicketEvent:
      type: object
      required: [id, kind, from_status, to_status, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [operator_reply, status_transition, reopened]
        from_status:
          type: string
          enum: [open, in_progress, resolved]
        to_status:
          type: string
          enum: [open, in_progress, resolved]
        created_at:
          type: string
          format: date-time

    AccountMembershipOrdersResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [orders]
          properties:
            orders:
              type: array
              items:
                $ref: "#/components/schemas/AccountMembershipOrder"
        request_id:
          type: string

    AccountCreateMembershipOrderRequest:
      type: object
      additionalProperties: false
      description: >-
        Carries nothing. The plan, the amount, and the merchant order number are
        all owned by the server, so a browser cannot influence what is charged.

    AccountMembershipOrderResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [order]
          properties:
            order:
              $ref: "#/components/schemas/AccountMembershipOrder"
            checkout_url:
              type: string
              pattern: '^weixin://'
              maxLength: 512
              description: >-
                Single-use WeChat payment URI the browser renders as a QR code.
                Present only while the order awaits payment and the code is
                still valid, so an expired code is never returned as if it were
                scannable. It carries no merchant order number, and it is not
                part of the order, so it never appears in an order listing.
        request_id:
          type: string

    AccountMembershipOrder:
      type: object
      required: [id, plan, amount_cents, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        plan:
          type: string
          enum: [lifetime]
        amount_cents:
          type: integer
          enum: [990]
        status:
          type: string
          enum: [created, pending_payment, paid, closed, failed, refunded]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LibraryCoursesResponse:
      type: object
      required: [courses, request_id]
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/CourseSummary"
        request_id:
          type: string

    CourseSummary:
      type: object
      required: [id, name, subject, material_count]
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        material_count:
          type: integer

    PublicLibraryCatalogResponse:
      type: object
      additionalProperties: false
      required: [materials, statistics, request_id]
      properties:
        materials:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/PublicLibraryMaterial" }
        statistics: { $ref: "#/components/schemas/PublicLibraryStatistics" }
        request_id: { type: string }

    PublicLibraryMaterialResponse:
      type: object
      additionalProperties: false
      required: [material, request_id]
      properties:
        material: { $ref: "#/components/schemas/PublicLibraryMaterial" }
        request_id: { type: string }

    PublicLibraryStatistics:
      type: object
      additionalProperties: false
      required: [releaseId, materialCount, downloadStarts, countingSince, asOf]
      properties:
        releaseId:
          type: [string, "null"]
          pattern: '^[a-f0-9]{40}-[a-f0-9]{16}$'
        materialCount: { type: integer, format: int64, minimum: 0 }
        downloadStarts: { type: integer, format: int64, minimum: 0 }
        countingSince: { type: [string, "null"], format: date-time }
        asOf: { type: string, format: date-time }

    PublicLibraryMaterial:
      type: object
      additionalProperties: false
      required: [id, type, subject, title, author, intro, toc, pages, price, previewPages, downloads, downloadAvailable, fileSize]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [handout, exam, slides, exercise, answer, note, textbook] }
        subject: { type: string, minLength: 1, maxLength: 255 }
        title: { type: string, minLength: 1, maxLength: 255 }
        author:
          type: string
          const: 资料库收录
          description: Honest presentation label; the owner manifest role is not represented as a personal author.
        intro: { type: string }
        toc: { type: array, maxItems: 0 }
        pages: { type: array, maxItems: 0 }
        price: { type: integer, const: 0 }
        previewPages: { type: integer, const: 0 }
        downloads: { type: integer, format: int64, minimum: 0 }
        downloadAvailable: { type: boolean, const: true }
        fileSize: { type: integer, format: int64, minimum: 0 }

    FoodVenuesResponse:
      type: object
      required: [campus, venues, request_id]
      properties:
        campus:
          type: string
        venues:
          type: array
          items:
            $ref: "#/components/schemas/VenueSummary"
        request_id:
          type: string

    CareerSearchResponse:
      type: object
      required: [search, request_id]
      properties:
        search:
          $ref: "#/components/schemas/CareerSearch"
        request_id:
          type: string

    CareerSearchesResponse:
      type: object
      required: [searches, request_id]
      properties:
        searches:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CareerSearch"
        request_id:
          type: string

    CareerSearch:
      type: object
      required: [id, status, user_id, has_email, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed]
        stage:
          type: string
          enum: [crawling, matching, rendering]
        user_id:
          type: string
          format: uuid
        has_email:
          type: boolean
        digest_status:
          type: string
          description: Durable Platform Core enqueue state; sent means accepted into the mail queue, not delivered to the mailbox.
          enum: [sending, retry, sent, skipped]
        error_code:
          type: string
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/CareerSearchResult"

    CareerSearchResult:
      type: object
      required: [source_count, job_count, matched_count, summary, jobs]
      properties:
        source_count: { type: integer, minimum: 0 }
        job_count: { type: integer, minimum: 0 }
        matched_count: { type: integer, minimum: 0 }
        summary: { type: string }
        jobs:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/CareerJob"

    CareerJob:
      type: object
      required: [source_key, company, title, location, url, match_score, match_reasons]
      properties:
        source_key: { type: string }
        company: { type: string }
        title: { type: string }
        location: { type: string }
        job_type: { type: string }
        description: { type: string }
        requirements:
          type: array
          items: { type: string }
        url: { type: string, format: uri }
        published_at: { type: string, format: date-time }
        fetched_at: { type: string, format: date-time }
        match_score: { type: integer, minimum: 0, maximum: 100 }
        match_reasons:
          type: array
          items: { type: string }

    CareerProfileResponse:
      type: object
      required: [profile, request_id]
      properties:
        profile:
          $ref: "#/components/schemas/CareerProfile"
        request_id:
          type: string

    CareerProfile:
      type: object
      required: [user_id, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
        target_roles:
          type: string
        tech_stack:
          type: string
        locations:
          type: string
        job_type:
          type: string
          enum: ["", daily_intern, summer_intern, campus_recruit]
        graduation_year:
          type: [integer, "null"]
        resume_text:
          type: string
        email_notification_enabled:
          type: boolean
        updated_at:
          type: string
          format: date-time

    VenueSummary:
      type: object
      required: [id, name, rating, tier, campus]
      properties:
        id:
          type: string
        name:
          type: string
        rating:
          type: number
          format: double
        tier:
          type: string
        campus:
          type: string

    PortalPracticeSessionRequest:
      type: object
      additionalProperties: false
      required: [bank_id, bank_version_id, mode]
      properties:
        bank_id:
          type: string
          format: uuid
        bank_version_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [random, difficult, chapter]
        chapter_id:
          type: string
          minLength: 1
          maxLength: 160
        question_count:
          type: integer
          minimum: 1
          maximum: 500

    PortalPracticeQuestion:
      type: object
      additionalProperties: false
      required: [question_id, question_version_id, type, chapter_id, chapter, content]
      properties:
        question_id:
          type: string
          format: uuid
        question_version_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [single, multi, judge, blank]
        chapter_id:
          type: string
        chapter:
          type: string
        content:
          type: string
        options:
          type: array
          items:
            type: string

    PortalPracticeSessionResponse:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          type: object
          additionalProperties: false
          required: [session_id, bank_id, bank_version_id, mode, excluded_unavailable_count, questions]
          properties:
            session_id:
              type: string
              format: uuid
            bank_id:
              type: string
              format: uuid
            bank_version_id:
              type: string
              format: uuid
            mode:
              type: string
              enum: [random, difficult, chapter]
            excluded_unavailable_count:
              type: integer
              minimum: 0
            questions:
              type: array
              items:
                $ref: "#/components/schemas/PortalPracticeQuestion"

    PortalPracticeAnswerRequest:
      type: object
      additionalProperties: false
      required: [question_id, question_version_id, answer]
      properties:
        question_id:
          type: string
          format: uuid
        question_version_id:
          type: string
          format: uuid
        answer: {}

    PortalPracticeAnswerResponse:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          type: object
          additionalProperties: false
          required: [question_id, question_version_id, correct, replayed, expected_answer, analysis]
          properties:
            question_id:
              type: string
              format: uuid
            question_version_id:
              type: string
              format: uuid
            correct:
              type: boolean
            replayed:
              type: boolean
            expected_answer: {}
            analysis:
              type: string

    MasterySubject:
      type: object
      required: [bank_id, label, value, total_questions, correct_questions]
      properties:
        bank_id:
          type: string
          format: uuid
        label:
          type: string
        value:
          type: integer
          minimum: 0
          maximum: 100
        total_questions:
          type: integer
          format: int64
          minimum: 0
        correct_questions:
          type: integer
          format: int64
          minimum: 0

    PersonalPracticeStats:
      type: object
      required: [total_answers, correct_answers, accuracy, streak_days, mastery]
      properties:
        total_answers:
          type: integer
          format: int64
          minimum: 0
        correct_answers:
          type: integer
          format: int64
          minimum: 0
        accuracy:
          type: integer
          minimum: 0
          maximum: 100
        streak_days:
          type: integer
          minimum: 0
        mastery:
          type: array
          items:
            $ref: "#/components/schemas/MasterySubject"

    QuizCraftCatalogResponse:
      type: object
      additionalProperties: false
      required: [banks, request_id]
      properties:
        banks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [bank_id, bank_version_id, name, question_count, available, chapters]
            properties:
              bank_id:
                type: string
                format: uuid
              bank_version_id:
                type: string
                format: uuid
              name:
                type: string
                minLength: 1
              question_count:
                type: integer
                minimum: 0
              available:
                type: boolean
              chapters:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, name]
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 160
                    name:
                      type: string
                      minLength: 1
                      maxLength: 240
        request_id:
          type: string
          minLength: 1

    QuizCraftRankingResponse:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          type: string
          minLength: 1
        data:
          type: object
          additionalProperties: false
          required: [scope, period, metric, entries]
          properties:
            scope:
              type: string
              enum: [overall, bank]
            bank_id:
              type: string
              format: uuid
            period:
              type: string
              enum: [weekly, lifetime]
            metric:
              type: string
              const: correct_answer_count
            entries:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [rank, nickname, system_avatar, correct_answer_count]
                properties:
                  rank:
                    type: integer
                    format: int64
                    minimum: 1
                  nickname:
                    type: string
                    minLength: 1
                    maxLength: 80
                    description: The platform users.display_name, or the neutral 游客x label derived from the internal identity key when the name is unset or the learner is a guest (ADR-0038). Never a user id.
                  system_avatar:
                    type: string
                    enum: [scholar-blue, coder-green, reader-amber, owl-purple]
                    description: Deterministically derived from the internal identity key (ADR-0038); not user-controlled and carries no personal data.
                  correct_answer_count:
                    type: integer
                    format: int64
                    minimum: 0

    PersonalPracticeStatsEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          $ref: "#/components/schemas/PersonalPracticeStats"

    NoticeListResponse:
      type: object
      required: [notices, request_id]
      properties:
        notices:
          type: array
          items:
            $ref: "#/components/schemas/NoticeSummary"
        request_id:
          type: string

    NoticeSummary:
      type: object
      required: [id, title, source, published_at]
      properties:
        id:
          type: string
        title:
          type: string
        source:
          type: string
        published_at:
          type: string
          format: date-time

  responses:
    MaterialNotAvailable:
      description: Material is unknown, inactive, withdrawn, or not public-free
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error: MATERIAL_NOT_AVAILABLE
            message: 资料不存在或已下架，请返回资料库重新选择。
            request_id: req_example
    DownloadTemporarilyUnavailable:
      description: The exact owner-backed download capability could not be created
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error: DOWNLOAD_TEMPORARILY_UNAVAILABLE
            message: 暂时无法生成下载链接，请稍后重试。
            request_id: req_example
    BadRequest:
      description: Invalid command input or identifier
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Not authenticated or session expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The signed-in user cannot access the requested resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: A command idempotency key was reused or the ticket revision is stale
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: The actor has an active Career task or exhausted the hourly quota
      content:
        application/json:
