name: final-review-platform-v2

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: final_review_v2
      POSTGRES_USER: final_review
      POSTGRES_PASSWORD: final_review_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U final_review -d final_review_v2"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      APP_ENV: development
      API_PORT: 8080
      DATABASE_URL: postgres://final_review:final_review_dev@postgres:5432/final_review_v2?sslmode=disable
      REDIS_ADDR: redis:6379
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: ./services/worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://final_review:final_review_dev@postgres:5432/final_review_v2?sslmode=disable
      REDIS_ADDR: redis:6379
      LLM_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

  admin:
    build:
      context: ./apps/admin
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      - api
    ports:
      - "5173:4173"

volumes:
  postgres_data:
  redis_data:
